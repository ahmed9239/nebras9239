<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نِبْرَاس الشَّامِلَة - محطة التداول المؤسسي V21.0</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.99); }
    }
    .animate-pulse-fast { animation: pulse-fast 1.2s infinite; }
    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-down { animation: slideDown 0.35s ease-out forwards; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen selection:bg-emerald-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // مولد نغمة تنبيه صوتية احترافية مدمجة (بدون ملفات خارجية)
    const playSmartAlertSound = () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const playTone = (freq, startTime, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.18, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        };

        playTone(587.33, now, 0.14);        // D5
        playTone(880.00, now + 0.14, 0.28); // A5
      } catch (e) {
        console.error('Audio play error:', e);
      }
    };

    function NebrasApp() {
      const [activeTab, setActiveTab] = useState('radar');
      const [timeframe, setTimeframe] = useState('15m');
      const [elliottScope, setElliottScope] = useState('small');
      const [category, setCategory] = useState('all');
      const [vipFilter, setVipFilter] = useState('all'); // all | long | short
      const [loading, setLoading] = useState(true);
      const [allTickers, setAllTickers] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedSymbol, setSelectedSymbol] = useState('BTCUSDT');
      
      const [userTelegram, setUserTelegram] = useState(localStorage.getItem('nebras_telegram') || '@ahmed17200');
      const [notificationsEnabled, setNotificationsEnabled] = useState(JSON.parse(localStorage.getItem('nebras_notif_active') || 'true'));
      const [soundEnabled, setSoundEnabled] = useState(JSON.parse(localStorage.getItem('nebras_sound_active') || 'true'));
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showNotifModal, setShowNotifModal] = useState(false);
      
      // شريط التنبيه المرئي المنبثق أعلى الشاشة
      const [visualBanner, setVisualBanner] = useState(null);
      const lastAlertedSymbolRef = useRef('');

      const [platformNotifications, setPlatformNotifications] = useState(JSON.parse(localStorage.getItem('nebras_notif_list') || '[]'));

      const [journalTrades, setJournalTrades] = useState(JSON.parse(localStorage.getItem('nebras_journal') || '[]'));
      const [newTradeSymbol, setNewTradeSymbol] = useState('BTCUSDT');
      const [newTradeType, setNewTradeType] = useState('LONG');
      const [newTradeEntry, setNewTradeEntry] = useState('');
      const [newTradeResult, setNewTradeResult] = useState('WIN');
      const [newTradePnL, setNewTradePnL] = useState('');

      const [capital, setCapital] = useState(1000);
      const [riskPercent, setRiskPercent] = useState(2);
      const [entryPrice, setEntryPrice] = useState(67000);
      const [stopLoss, setStopLoss] = useState(66000);

      const aiSymbols = ['TAO', 'FET', 'NEAR', 'RNDR', 'WLD', 'AGIX', 'AKT'];
      const majorSymbols = ['BTC', 'ETH', 'SOL', 'BNB', 'XRP', 'ADA', 'AVAX'];

      const saveTelegramSettings = (e) => {
        e.preventDefault();
        localStorage.setItem('nebras_telegram', userTelegram);
        setShowSettingsModal(false);
      };

      const toggleNotifications = () => {
        const newState = !notificationsEnabled;
        setNotificationsEnabled(newState);
        localStorage.setItem('nebras_notif_active', JSON.stringify(newState));

        if (newState) {
          if (soundEnabled) playSmartAlertSound();
          if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
          }
          addPlatformNotification("تم تفعيل تنبيهات مرصد الصفقات الذكية 🔔");
        } else {
          addPlatformNotification("تم إيقاف التنبيهات الفورية 🔕");
        }
      };

      const toggleSound = () => {
        const newState = !soundEnabled;
        setSoundEnabled(newState);
        localStorage.setItem('nebras_sound_active', JSON.stringify(newState));
        if (newState) playSmartAlertSound();
      };

      const addPlatformNotification = (text, symbol = null) => {
        const newNotif = {
          id: Date.now(),
          text: text,
          symbol: symbol,
          time: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        };
        setPlatformNotifications(prev => {
          const updated = [newNotif, ...prev].slice(0, 30);
          localStorage.setItem('nebras_notif_list', JSON.stringify(updated));
          return updated;
        });
      };

      const clearPlatformNotifications = () => {
        setPlatformNotifications([]);
        localStorage.removeItem('nebras_notif_list');
      };

      const triggerSmartAlert = (signal) => {
        if (!notificationsEnabled) return;
        if (lastAlertedSymbolRef.current === signal.symbol) return;

        lastAlertedSymbolRef.current = signal.symbol;
        const directionText = signal.isShort ? 'بيع (SHORT 🔴)' : 'شراء (LONG 🟢)';
        const msg = `صفقة ذكية VIP: ${signal.label} | ${directionText} | دخول $${signal.entryFormatted}`;

        // 1. تنبيه صوتي
        if (soundEnabled) {
          playSmartAlertSound();
        }

        // 2. تنبيه مرئي داخل المنصة
        setVisualBanner({
          symbol: signal.symbol,
          label: signal.label,
          isShort: signal.isShort,
          entry: signal.entryFormatted,
          tp1: signal.tp1Formatted,
          sl: signal.slFormatted,
          reason: signal.smartReason
        });

        setTimeout(() => {
          setVisualBanner(prev => (prev && prev.symbol === signal.symbol ? null : prev));
        }, 7500);

        // 3. حفظ في سجل الإشعارات
        addPlatformNotification(msg, signal.symbol);

        // 4. إشعار النظام
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification("🎯 مرصد الصفقات الذكية - نِبْرَاس", { body: msg });
        }
      };

      const addJournalTrade = (e) => {
        e.preventDefault();
        if (!newTradeEntry || !newTradePnL) return;
        const trade = {
          id: Date.now(),
          symbol: newTradeSymbol,
          type: newTradeType,
          entry: newTradeEntry,
          result: newTradeResult,
          pnl: parseFloat(newTradePnL),
          date: new Date().toLocaleDateString('ar-SA')
        };
        const updated = [trade, ...journalTrades];
        setJournalTrades(updated);
        localStorage.setItem('nebras_journal', JSON.stringify(updated));
        setNewTradePnL('');
      };

      const deleteJournalTrade = (id) => {
        const updated = journalTrades.filter(t => t.id !== id);
        setJournalTrades(updated);
        localStorage.setItem('nebras_journal', JSON.stringify(updated));
      };

      const journalStats = useMemo(() => {
        const total = journalTrades.length;
        if (total === 0) return { winRate: 0, totalPnL: 0, wins: 0, losses: 0 };
        const wins = journalTrades.filter(t => t.result === 'WIN').length;
        const losses = total - wins;
        const winRate = ((wins / total) * 100).toFixed(1);
        const totalPnL = journalTrades.reduce((acc, t) => acc + t.pnl, 0).toFixed(2);
        return { winRate, totalPnL, wins, losses };
      }, [journalTrades]);

      const fetchAllBinanceData = async () => {
        try {
          const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
          const data = await res.json();
          
          const usdtPairs = data
            .filter(t => t.symbol.endsWith('USDT'))
            .map(t => {
              const base = t.symbol.replace('USDT', '');
              const priceNum = parseFloat(t.lastPrice);
              if (priceNum <= 0) return null;
              
              let decimals = 2;
              if (priceNum < 0.0001) decimals = 8;
              else if (priceNum < 1) decimals = 4;

              const changeNum = parseFloat(t.priceChangePercent);
              const volNum = parseFloat(t.quoteVolume);

              const buyPercent = Math.min(Math.max(50 + (changeNum * 2.5), 20), 85).toFixed(1);
              const sellPercent = (100 - parseFloat(buyPercent)).toFixed(1);
              const netInflowNum = (volNum * (changeNum / 100) * 0.15) / 1000000;
              
              const isShort = netInflowNum < -0.25;
              const isBreakout = Math.abs(changeNum) >= 4.0 || volNum > 50000000;
              
              let entry = priceNum * (isShort ? 1.002 : 0.998);
              let sl = isShort ? entry * 1.018 : entry * 0.982;
              const tp1 = isShort ? entry * 0.975 : entry * 1.025;
              const tp2 = isShort ? entry * 0.945 : entry * 1.055;

              let elliottPhase = 'الموجة الأولى (Wave 1)';
              let elliottColor = 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30';
              if (changeNum > 4.5 && volNum > 30000000) {
                elliottPhase = 'الموجة الدافعة الثالثة (Wave 3 - الانفجار الأعنف 🚀)';
                elliottColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50';
              } else if (changeNum > 2.0 && changeNum <= 4.5) {
                elliottPhase = 'الموجة الخامسة (Wave 5 - القمة ⚠️)';
                elliottColor = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
              } else if (changeNum < 0 && changeNum > -3.0) {
                elliottPhase = 'موجة التصحيح الرابعة (Wave 4 - ارتداد 🔄)';
                elliottColor = 'bg-purple-500/10 text-purple-400 border-purple-500/30';
              } else if (changeNum <= -3.0) {
                elliottPhase = 'تصحيح مركب (Wave A-B-C هابط)';
                elliottColor = 'bg-rose-500/10 text-rose-400 border-rose-500/30';
              }

              let smcType = 'منطقة تجميع هادئة';
              let smcColor = 'bg-gray-800 text-gray-300 border-gray-700';
              if (volNum > 60000000 && changeNum > 2.5) {
                smcType = 'منطقة طلب مؤسسي (Bullish OB 🟩)';
                smcColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
              } else if (volNum > 60000000 && changeNum < -2.5) {
                smcType = 'منطقة عرض مؤسسي (Bearish OB 🟥)';
                smcColor = 'bg-rose-500/10 text-rose-400 border-rose-500/30';
              } else if (Math.abs(changeNum) > 4.5) {
                smcType = 'فجوة سعرية مؤسسية (FVG ⚡)';
                smcColor = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
              }

              // تحديد درجة قوة الصفقة الذكية (Smart Money Confluence)
              let smartScore = 0;
              let smartReasons = [];
              if (Math.abs(netInflowNum) > 0.5) { smartScore += 35; smartReasons.push('تدفق سيولة مؤسسية'); }
              if (volNum > 40000000) { smartScore += 30; smartReasons.push('فوليوم ضخم'); }
              if (Math.abs(changeNum) >= 3.0) { smartScore += 25; smartReasons.push('زخم سعري مؤكد'); }
              if (smcType !== 'منطقة تجميع هادئة') { smartScore += 10; smartReasons.push('تأكيد SMC'); }

              const isSmartSignal = smartScore >= 65 && volNum > 25000000;

              let liqType = 'متوازن';
              let liqColor = 'text-gray-400 border-gray-700';
              let estimatedLiqUsd = ((volNum * Math.abs(changeNum)) / 45).toFixed(0);
              if (changeNum > 3.5) {
                liqType = `تصفية شورت ضخمة (Short Squeeze 🚀)`;
                liqColor = 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30';
              } else if (changeNum < -3.5) {
                liqType = `تصفية لونج ضخمة (Long Squeeze ⚠️)`;
                liqColor = 'text-rose-400 bg-rose-500/10 border-rose-500/30';
              } else {
                liqType = 'استقرار في عقود الهامش';
              }

              let tradeStatus = 'active';
              let statusLabel = isShort ? 'شورت نشطة 🔄' : 'لونج نشطة 🔄';
              let statusColor = isShort ? 'bg-rose-500/10 text-rose-400 border-rose-500/30' : 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30';

              if (isShort) {
                if (priceNum <= tp2) { tradeStatus = 'success'; statusLabel = 'تحقق الهدف TP2 🚀'; statusColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50'; }
                else if (priceNum <= tp1) { statusLabel = 'تحقق الهدف TP1 ✅'; statusColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'; }
              } else {
                if (priceNum >= tp2) { tradeStatus = 'success'; statusLabel = 'تحقق الهدف TP2 🚀'; statusColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50'; }
                else if (priceNum >= tp1) { statusLabel = 'تحقق الهدف TP1 ✅'; statusColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'; }
              }

              let catTag = 'عملة نشطة';
              if (majorSymbols.includes(base)) catTag = 'قيادية 👑';
              else if (aiSymbols.includes(base)) catTag = 'ذكاء اصطناعي 🤖';

              let signalTag = 'سيولة متوازنة';
              let signalColor = 'text-gray-400 bg-gray-800/40 border-gray-700/50';

              if (netInflowNum > 1) {
                signalTag = 'دخول سيولة حاد 🔥';
                signalColor = 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30';
              } else if (netInflowNum < -1) {
                signalTag = 'خروج سيولة حاد ⚠️';
                signalColor = 'text-rose-400 bg-rose-500/10 border-rose-500/30';
              }

              return {
                symbol: t.symbol,
                base: base,
                label: `${base}/USDT`,
                rawPrice: priceNum,
                price: priceNum.toFixed(decimals),
                entryFormatted: entry.toFixed(decimals),
                slFormatted: sl.toFixed(decimals),
                tp1Formatted: tp1.toFixed(decimals),
                tp2Formatted: tp2.toFixed(decimals),
                changeNum: changeNum,
                change: changeNum.toFixed(2),
                volumeNum: volNum,
                volume: (volNum / 1000000).toFixed(2) + 'M',
                buyPercent: buyPercent,
                sellPercent: sellPercent,
                netInflowNum: netInflowNum,
                netInflow: (netInflowNum >= 0 ? `+${netInflowNum.toFixed(2)}M$` : `${netInflowNum.toFixed(2)}M$`),
                catTag: catTag,
                isShort: isShort,
                isBreakout: isBreakout,
                isSmartSignal: isSmartSignal,
                smartScore: Math.min(smartScore, 98),
                smartReason: smartReasons.join(' + ') || 'توافق سيولة وزخم',
                elliottPhase: elliottPhase,
                elliottColor: elliottColor,
                smcType: smcType,
                smcColor: smcColor,
                liqType: liqType,
                liqColor: liqColor,
                estimatedLiqUsd: estimatedLiqUsd,
                tradeStatus: tradeStatus,
                statusLabel: statusLabel,
                statusColor: statusColor,
                signalTag: signalTag,
                signalColor: signalColor
              };
            })
            .filter(Boolean);

          setAllTickers(usdtPairs);
          setLoading(false);

          // إطلاق التنبيه الصوتي والمرئي لأقوى صفقة ذكية مرصودة
          const topSmart = usdtPairs
            .filter(p => p.isSmartSignal)
            .sort((a, b) => b.smartScore - a.smartScore || Math.abs(b.netInflowNum) - Math.abs(a.netInflowNum))[0];

          if (topSmart) {
            triggerSmartAlert(topSmart);
          }
        } catch (err) {
          console.error('Binance Fetch Error:', err);
        }
      };

      useEffect(() => {
        fetchAllBinanceData();
        const interval = setInterval(fetchAllBinanceData, 3500);
        return () => clearInterval(interval);
      }, [notificationsEnabled, soundEnabled]);

      useEffect(() => {
        if (activeTab === 'chart' && window.TradingView) {
          let cleanSymbol = selectedSymbol ? selectedSymbol.replace('BINANCE:', '') : 'BTCUSDT';
          new window.TradingView.widget({
            "autosize": true,
            "symbol": `BINANCE:${cleanSymbol}`,
            "interval": timeframe === '5m' ? '5' : timeframe === '1h' ? '60' : '15',
            "timezone": "Asia/Riyadh",
            "theme": "dark",
            "style": "1",
            "locale": "ar",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "container_id": "tradingview_chart"
          });
        }
      }, [activeTab, selectedSymbol, timeframe]);

      const filteredPairs = useMemo(() => {
        let result = [...allTickers];
        if (category === 'inflow') {
          result = result.filter(item => item.netInflowNum > 0).sort((a, b) => b.netInflowNum - a.netInflowNum);
        } else if (category === 'outflow') {
          result = result.filter(item => item.netInflowNum < 0).sort((a, b) => a.netInflowNum - b.netInflowNum);
        } else if (category === 'majors') {
          result = result.filter(item => majorSymbols.includes(item.base));
        } else if (category === 'ai') {
          result = result.filter(item => aiSymbols.includes(item.base));
        } else {
          result.sort((a, b) => b.volumeNum - a.volumeNum);
        }
        if (searchTerm) {
          result = result.filter(item => item.label.toLowerCase().includes(searchTerm.toLowerCase()));
        }
        return result.slice(0, 60);
      }, [allTickers, searchTerm, category]);

      const breakoutSignals = useMemo(() => {
        return allTickers
          .filter(item => item.isBreakout)
          .sort((a, b) => Math.abs(b.changeNum) - Math.abs(a.changeNum))
          .slice(0, 15);
      }, [allTickers]);

      const elliottSignals = useMemo(() => {
        let list = [...allTickers];
        if (elliottScope === 'small') {
          list = list.filter(item => Math.abs(item.changeNum) >= 2.5);
        } else {
          list = list.filter(item => majorSymbols.includes(item.base) || Math.abs(item.netInflowNum) > 0.5);
        }
        return list.sort((a, b) => b.volumeNum - a.volumeNum).slice(0, 20);
      }, [allTickers, elliottScope]);

      const smcSignals = useMemo(() => {
        return allTickers
          .filter(item => item.volumeNum > 20000000 && Math.abs(item.changeNum) > 1.5)
          .sort((a, b) => b.volumeNum - a.volumeNum)
          .slice(0, 25);
      }, [allTickers]);

      const liquidationSignals = useMemo(() => {
        return allTickers
          .filter(item => Math.abs(item.changeNum) > 2.5 || item.volumeNum > 20000000)
          .sort((a, b) => Math.abs(b.changeNum) - Math.abs(a.changeNum))
          .slice(0, 25);
      }, [allTickers]);

      // صفقات مرصد الأموال الذكية VIP (تقاطع السيولة + الفوليوم + الزخم)
      const smartMoneyVipSignals = useMemo(() => {
        let list = allTickers
          .filter(item => item.isSmartSignal || Math.abs(item.netInflowNum) > 0.35)
          .sort((a, b) => b.smartScore - a.smartScore || Math.abs(b.netInflowNum) - Math.abs(a.netInflowNum));

        if (vipFilter === 'long') list = list.filter(i => !i.isShort);
        if (vipFilter === 'short') list = list.filter(i => i.isShort);

        return list.slice(0, 25);
      }, [allTickers, vipFilter]);

      const topInflow = useMemo(() => {
        const sorted = [...allTickers].sort((a, b) => b.netInflowNum - a.netInflowNum);
        return sorted.find(item => item.netInflowNum > 0) || sorted[0];
      }, [allTickers]);

      const topOutflow = useMemo(() => {
        const sorted = [...allTickers].sort((a, b) => a.netInflowNum - b.netInflowNum);
        return sorted.find(item => item.netInflowNum < 0) || sorted[sorted.length - 1];
      }, [allTickers]);

      const riskAmount = (capital * (riskPercent / 100)).toFixed(2);
      const priceDiff = Math.abs(entryPrice - stopLoss);
      const posSize = priceDiff > 0 ? (riskAmount / (priceDiff / entryPrice)).toFixed(2) : 0;

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col pb-6 relative">
          
          {/* تنبيه مرئي فوري منبثق (Visual Alert Toast) */}
          {visualBanner && (
            <div className="fixed top-3 left-3 right-3 max-w-md mx-auto z-[100] animate-slide-down">
              <div className={`rounded-2xl p-3.5 shadow-2xl border-2 backdrop-blur-md flex items-center justify-between gap-2 ${visualBanner.isShort ? 'bg-rose-950/95 border-rose-500' : 'bg-emerald-950/95 border-emerald-400'}`}>
                <div 
                  onClick={() => { setSelectedSymbol(visualBanner.symbol); setActiveTab('signals'); setVisualBanner(null); }}
                  className="cursor-pointer flex-1 space-y-1"
                >
                  <div className="flex items-center gap-1.5">
                    <span className="animate-ping inline-flex h-2 w-2 rounded-full bg-amber-400"></span>
                    <span className="text-[10px] font-black text-amber-300">🎯 إشارة مرصد الصفقات الذكية VIP</span>
                  </div>
                  <div className="text-xs font-extrabold text-white">
                    {visualBanner.label} — {visualBanner.isShort ? 'بيع SHORT 🔴' : 'شراء LONG 🟢'} عند <span className="font-mono text-amber-300">${visualBanner.entry}</span>
                  </div>
                  <div className="text-[10px] text-gray-300">{visualBanner.reason}</div>
                </div>
                <button onClick={() => setVisualBanner(null)} className="text-gray-300 hover:text-white px-2 py-1 text-xs font-bold">✕</button>
              </div>
            </div>
          )}

          {/* Header */}
          <header className="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 flex items-center justify-between shadow-xl">
            <div>
              <h1 className="text-sm font-black text-emerald-400 tracking-wide flex items-center gap-1.5">

                </div>
                {elliottSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setEntryPrice(item.rawPrice); setActiveTab('chart'); }} className="bg-gray-900 border border-cyan-500/40 rounded-2xl p-3.5 space-y-3 cursor-pointer">
                    <div className="flex justify-between items-center"><span className={`font-black text-[10px] px-2.5 py-1 rounded-lg border ${item.elliottColor}`}>{item.elliottPhase}</span><span className="font-extrabold text-sm text-white">{item.label}</span></div>
                    <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]">
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-gray-800"><span className="text-gray-400 block text-[8px]">الدخول</span><span className="text-white font-mono font-bold">${item.entryFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-rose-500/30"><span className="text-rose-400 block text-[8px]">وقف (SL)</span><span className="text-rose-300 font-mono font-bold">${item.slFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-emerald-500/30"><span className="text-emerald-400 block text-[8px]">الهدف 1</span><span className="text-emerald-300 font-mono font-bold">${item.tp1Formatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-cyan-500/30"><span className="text-cyan-400 block text-[8px]">الهدف 2</span><span className="text-cyan-300 font-mono font-bold">${item.tp2Formatted}</span></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* 5. SMC Tab */}
            {activeTab === 'smc' && (
              <div className="space-y-3">
                <div className="bg-gradient-to-r from-emerald-950/70 to-gray-900 border border-emerald-500/50 rounded-2xl p-3.5"><h2 className="font-black text-emerald-400 text-xs">📊 مناطق SMC / ICT</h2></div>
                {smcSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setEntryPrice(item.rawPrice); setActiveTab('chart'); }} className="bg-gray-900 border border-emerald-500/40 rounded-2xl p-3.5 space-y-3 cursor-pointer">
                    <div className="flex justify-between items-center"><span className="font-extrabold text-sm text-white">{item.label}</span><span className={`text-[10px] px-2 py-0.5 rounded border font-bold ${item.smcColor}`}>{item.smcType}</span></div>
                    <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]">
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-gray-800"><span className="text-gray-400 block text-[8px]">الدخول</span><span className="text-white font-mono font-bold">${item.entryFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-rose-500/30"><span className="text-rose-400 block text-[8px]">وقف (SL)</span><span className="text-rose-300 font-mono font-bold">${item.slFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-emerald-500/30"><span className="text-emerald-400 block text-[8px]">الهدف 1</span><span className="text-emerald-300 font-mono font-bold">${item.tp1Formatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-cyan-500/30"><span className="text-cyan-400 block text-[8px]">الهدف 2</span><span className="text-cyan-300 font-mono font-bold">${item.tp2Formatted}</span></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* 6. Liquidations Tab */}
            {activeTab === 'liquidation' && (
              <div className="space-y-3">
                <div className="bg-gradient-to-r from-rose-950/70 to-gray-900 border border-rose-500/50 rounded-2xl p-3.5"><h2 className="font-black text-rose-400 text-xs">⚡ التصفيات والسقويز</h2></div>
                {liquidationSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setEntryPrice(item.rawPrice); setActiveTab('chart'); }} className="bg-gray-900 border border-rose-500/40 rounded-2xl p-3.5 space-y-3 cursor-pointer">
                    <div className="flex justify-between items-center"><span className="font-extrabold text-sm text-white">{item.label}</span><span className={`text-[10px] px-2.5 py-0.5 rounded-full border font-bold ${item.liqColor}`}>{item.liqType}</span></div>
                    <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]">
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-gray-800"><span className="text-gray-400 block text-[8px]">الدخول</span><span className="text-white font-mono font-bold">${item.entryFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-rose-500/30"><span className="text-rose-400 block text-[8px]">وقف (SL)</span><span className="text-rose-300 font-mono font-bold">${item.slFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-emerald-500/30"><span className="text-emerald-400 block text-[8px]">الهدف 1</span><span className="text-emerald-300 font-mono font-bold">${item.tp1Formatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-cyan-500/30"><span className="text-cyan-400 block text-[8px]">الهدف 2</span><span className="text-cyan-300 font-mono font-bold">${item.tp2Formatted}</span></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* 7. Journal Tab */}
            {activeTab === 'journal' && (
              <div className="space-y-4">
                <div className="bg-gray-900 border border-emerald-500/40 rounded-2xl p-4 space-y-3">
                  <h2 className="font-bold text-emerald-400 text-xs">📖 دفتر الصفقات (Win Rate: {journalStats.winRate}%)</h2>
                  <form onSubmit={addJournalTrade} className="space-y-2 pt-2 border-t border-gray-800">
                    <div className="grid grid-cols-2 gap-2">
                      <input type="text" value={newTradeSymbol} onChange={(e) => setNewTradeSymbol(e.target.value)} placeholder="العملة (BTCUSDT)" className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white" required />
                      <select value={newTradeType} onChange={(e) => setNewTradeType(e.target.value)} className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white"><option value="LONG">LONG 🟢</option><option value="SHORT">SHORT 🔴</option></select>
                    </div>
                    <div className="grid grid-cols-3 gap-2">
                      <input type="number" step="any" value={newTradeEntry} onChange={(e) => setNewTradeEntry(e.target.value)} placeholder="الدخول" className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white" required />
                      <select value={newTradeResult} onChange={(e) => setNewTradeResult(e.target.value)} className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white"><option value="WIN">ربح ✅</option><option value="LOSS">خسارة ❌</option></select>
                      <input type="number" step="any" value={newTradePnL} onChange={(e) => setNewTradePnL(e.target.value)} placeholder="الربح ($)" className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white" required />
                    </div>
                    <button type="submit" className="w-full bg-emerald-500 text-gray-950 font-bold py-2 rounded-xl text-xs">تسجيل الصفقة</button>
                  </form>
                </div>
                {journalTrades.map((t) => (
                  <div key={t.id} className="bg-gray-900 border border-gray-800 rounded-xl p-3 flex justify-between items-center text-xs">
                    <div><span className={`font-bold ${t.type === 'LONG' ? 'text-emerald-400' : 'text-rose-400'}`}>{t.type}</span> <strong className="text-white">{t.symbol}</strong></div>
                    <div className="flex items-center gap-3"><span className={`font-mono font-bold ${t.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>${t.pnl}</span><button onClick={() => deleteJournalTrade(t.id)} className="text-gray-500 hover:text-rose-400">✕</button></div>
                  </div>
                ))}
              </div>
            )}

            {/* 8. Heatmap Tab */}
            {activeTab === 'heatmap' && (
              <div className="grid grid-cols-3 gap-2">
                {allTickers.slice(0, 30).map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className={`p-3 rounded-xl border flex flex-col justify-between items-center text-center cursor-pointer ${item.changeNum >= 0 ? 'bg-emerald-950/40 border-emerald-500/30' : 'bg-rose-950/40 border-rose-500/30'}`}>
                    <span className="font-extrabold text-xs text-white">{item.base}</span>
                    <span className={`font-mono font-bold text-xs ${item.changeNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{item.change}%</span>
                  </div>
                ))}
              </div>
            )}

            {/* 9. Chart Tab */}
            {activeTab === 'chart' && (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-2 space-y-2 h-[520px]">
                <div className="flex justify-between items-center px-2">
                  <span className="text-xs font-bold text-emerald-400">الشارت المباشر: BINANCE:{selectedSymbol}</span>
                  <div className="flex gap-1 text-[10px]">
                    <button onClick={() => setTimeframe('5m')} className={`px-2 py-0.5 rounded ${timeframe === '5m' ? 'bg-emerald-500 text-black font-bold' : 'bg-gray-800 text-gray-300'}`}>5m</button>
                    <button onClick={() => setTimeframe('15m')} className={`px-2 py-0.5 rounded ${timeframe === '15m' ? 'bg-emerald-500 text-black font-bold' : 'bg-gray-800 text-gray-300'}`}>15m</button>
                    <button onClick={() => setTimeframe('1h')} className={`px-2 py-0.5 rounded ${timeframe === '1h' ? 'bg-emerald-500 text-black font-bold' : 'bg-gray-800 text-gray-300'}`}>1h</button>
                  </div>
                </div>
                <div id="tradingview_chart" className="h-[470px] w-full"></div>
              </div>
            )}

            {/* 10. Risk Tab */}
            {activeTab === 'risk' && (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-4 text-xs">
                <h2 className="font-bold text-emerald-400 text-sm">حاسبة إدارة المخاطر</h2>
                <div className="space-y-3">
                  <div><label className="text-gray-400 block mb-1">رأس المال ($):</label><input type="number" value={capital} onChange={(e) => setCapital(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white" /></div>
                  <div><label className="text-gray-400 block mb-1">نسبة المخاطرة (%):</label><input type="number" value={riskPercent} onChange={(e) => setRiskPercent(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white" /></div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="text-gray-400 block mb-1">سعر الدخول:</label><input type="number" step="any" value={entryPrice} onChange={(e) => setEntryPrice(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white" /></div>
                    <div><label className="text-gray-400 block mb-1">وقف الخسارة:</label><input type="number" step="any" value={stopLoss} onChange={(e) => setStopLoss(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white" /></div>
                  </div>
                  <div className="p-3 bg-gray-950 border border-emerald-500/30 rounded-lg space-y-1">
                    <div className="flex justify-between"><span className="text-gray-400">مبلغ المخاطرة:</span><span className="font-bold text-rose-400">${riskAmount}</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">حجم الصفقة المقترح:</span><span className="font-bold text-emerald-400">${posSize}</span></div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NebrasApp />);
  </script>
</body>
</html>
