<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نِبْرَاس الشَّامِلَة - محطة التداول V25.5</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.99); }
    }
    .animate-pulse-fast { animation: pulse-fast 1.2s infinite; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen selection:bg-emerald-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const playSmartAlertSound = () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const playTone = (freq, startTime, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.18, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        };
        playTone(587.33, now, 0.14);
        playTone(880.00, now + 0.14, 0.28);
      } catch (e) { console.error('Audio play error:', e); }
    };

    function NebrasApp() {
      const [activeTab, setActiveTab] = useState('ai_predict');
      const [timeframe, setTimeframe] = useState('1h');
      const [category, setCategory] = useState('all');
      const [vipFilter, setVipFilter] = useState('all');
      const [loading, setLoading] = useState(true);
      const [allTickers, setAllTickers] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedSymbol, setSelectedSymbol] = useState('BTCUSDT');
      const [manualSymbolInput, setManualSymbolInput] = useState('');
      
      const [activeReportModal, setActiveReportModal] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 2500);
      };

      const [favorites, setFavorites] = useState(JSON.parse(localStorage.getItem('nebras_favorites') || '["BTCUSDT", "ETHUSDT", "SOLUSDT"]'));

      const toggleFavorite = (symbol) => {
        let updated;
        if (favorites.includes(symbol)) {
          updated = favorites.filter(s => s !== symbol);
          showToast('تمت الإزالة من المفضلة 🗑️');
        } else {
          updated = [...favorites, symbol];
          showToast('تمت الإضافة للمفضلة ⭐');
        }
        setFavorites(updated);
        localStorage.setItem('nebras_favorites', JSON.stringify(updated));
      };
      
      const [userTelegram, setUserTelegram] = useState(localStorage.getItem('nebras_telegram') || '@ahmed17200');
      const [notificationsEnabled, setNotificationsEnabled] = useState(JSON.parse(localStorage.getItem('nebras_notif_active') || 'true'));
      const [soundEnabled, setSoundEnabled] = useState(JSON.parse(localStorage.getItem('nebras_sound_active') || 'true'));
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showNotifModal, setShowNotifModal] = useState(false);
      const [platformNotifications, setPlatformNotifications] = useState(JSON.parse(localStorage.getItem('nebras_notif_list') || '[]'));

      const [journalTrades, setJournalTrades] = useState(JSON.parse(localStorage.getItem('nebras_journal') || '[]'));
      const [newTradeSymbol, setNewTradeSymbol] = useState('BTCUSDT');
      const [newTradeType, setNewTradeType] = useState('LONG');
      const [newTradeEntry, setNewTradeEntry] = useState('');
      const [newTradeResult, setNewTradeResult] = useState('WIN');
      const [newTradePnL, setNewTradePnL] = useState('');

      const [capital, setCapital] = useState(1000);
      const [riskPercent, setRiskPercent] = useState(2);
      const [entryPrice, setEntryPrice] = useState(67000);
      const [stopLoss, setStopLoss] = useState(66000);

      const aiSymbols = ['TAO', 'FET', 'NEAR', 'RNDR', 'WLD', 'AGIX', 'AKT'];
      const majorSymbols = ['BTC', 'ETH', 'SOL', 'BNB', 'XRP', 'ADA', 'AVAX'];

      const toggleNotifications = () => {
        const newState = !notificationsEnabled;
        setNotificationsEnabled(newState);
        localStorage.setItem('nebras_notif_active', JSON.stringify(newState));
        if (newState && soundEnabled) playSmartAlertSound();
      };

      const toggleSound = () => {
        const newState = !soundEnabled;
        setSoundEnabled(newState);
        localStorage.setItem('nebras_sound_active', JSON.stringify(newState));
        if (newState) playSmartAlertSound();
      };

      const copyTradePlanText = (ticker) => {
        const tradeTypeStr = ticker.isShort ? 'SHORT 🔴 (بيع)' : 'LONG 🟢 (شراء)';
        const text = `🚀 توصية من نبراس الشاملة V25.5\nاتجاه الصفقة: ${tradeTypeStr}\nالعملة: ${ticker.label}\nالسعر الحالي: $${ticker.price}\n📍 منطقة الدخول: $${ticker.entryLowFormatted} - $${ticker.entryHighFormatted}\n🛑 وقف الخسارة (SL): $${ticker.slFormatted}\n🎯 الهدف الأول (TP1): $${ticker.tp1Formatted}\n🎯 الهدف الثاني (TP2): $${ticker.tp2Formatted}\n🎯 الهدف الثالث (TP3): $${ticker.tp3Formatted}\n📊 الفريم النشط: ${timeframe}`;
        navigator.clipboard.writeText(text);
        showToast('تم نسخ خطة الصفقة بنجاح! 📋');
      };

      const addJournalTrade = (e) => {
        e.preventDefault();
        if (!newTradeEntry || !newTradePnL) return;
        const trade = {
          id: Date.now(),
          symbol: newTradeSymbol,
          type: newTradeType,
          entry: newTradeEntry,
          result: newTradeResult,
          pnl: parseFloat(newTradePnL),
          date: new Date().toLocaleDateString('ar-SA')
        };
        const updated = [trade, ...journalTrades];
        setJournalTrades(updated);
        localStorage.setItem('nebras_journal', JSON.stringify(updated));
        setNewTradePnL('');
        showToast('تم تسجيل الصفقة في الدفتر بنجاح ✅');
      };

      const deleteJournalTrade = (id) => {
        const updated = journalTrades.filter(t => t.id !== id);
        setJournalTrades(updated);
        localStorage.setItem('nebras_journal', JSON.stringify(updated));
        showToast('تم حذف الصفقة 🗑️');
      };

      const journalStats = useMemo(() => {
        const total = journalTrades.length;
        if (total === 0) return { winRate: 0, totalPnL: 0, wins: 0, losses: 0 };
        const wins = journalTrades.filter(t => t.result === 'WIN').length;
        const losses = total - wins;
        const winRate = ((wins / total) * 100).toFixed(1);
        const totalPnL = journalTrades.reduce((acc, t) => acc + t.pnl, 0).toFixed(2);
        return { winRate, totalPnL, wins, losses };
      }, [journalTrades]);

      const fetchAllBinanceData = async () => {
        try {
          const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
          const data = await res.json();
          
          const usdtPairs = data
            .filter(t => t.symbol.endsWith('USDT'))
            .map(t => {
              const base = t.symbol.replace('USDT', '');
              const priceNum = parseFloat(t.lastPrice);
              if (priceNum <= 0) return null;
              
              let decimals = 2;
              if (priceNum < 0.0001) decimals = 8;
              else if (priceNum < 1) decimals = 4;

              const changeNum = parseFloat(t.priceChangePercent);
              const volNum = parseFloat(t.quoteVolume);

              const buyPercent = Math.min(Math.max(50 + (changeNum * 2.5), 20), 85).toFixed(1);
              const sellPercent = (100 - parseFloat(buyPercent)).toFixed(1);
              const netInflowNum = (volNum * (changeNum / 100) * 0.15) / 1000000;
              
              const isShort = netInflowNum < 0; 
              const isBreakout = Math.abs(changeNum) >= 4.0 || volNum > 50000000;
              
              const tfMultiplier = timeframe === '15m' ? 0.003 : timeframe === '1h' ? 0.008 : timeframe === '4h' ? 0.02 : 0.05;

              let entryLow = priceNum * (1 - tfMultiplier * 0.2);
              let entryHigh = priceNum * (1 + tfMultiplier * 0.2);
              let sl = isShort ? priceNum * (1 + tfMultiplier * 1.5) : priceNum * (1 - tfMultiplier * 1.5);
              const tp1 = isShort ? priceNum * (1 - tfMultiplier * 1.2) : priceNum * (1 + tfMultiplier * 1.2);
              const tp2 = isShort ? priceNum * (1 - tfMultiplier * 2.5) : priceNum * (1 + tfMultiplier * 2.5);
              const tp3 = isShort ? priceNum * (1 - tfMultiplier * 4.0) : priceNum * (1 + tfMultiplier * 4.0);

              // حساب ديناميكي فريد لـ "قوة القرار" بناءً على حركة العملة وحجم التداول والسيولة
              const calculatedScore = Math.min(Math.max(Math.round(65 + Math.abs(changeNum) * 3.2 + Math.min(Math.abs(netInflowNum) * 1.8, 25)), 60), 97);

              let elliottPhase = timeframe === '15m' ? 'الموجة السريعة (Wave 1)' : timeframe === '4h' ? 'الموجة الدافعة الثالثة (Wave 3)' : 'الموجة الرئيسية';
              let elliottColor = 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30';
              if (changeNum > 4.5 && volNum > 30000000) {
                elliottPhase = 'الموجة الدافعة الثالثة (Wave 3 - الانفجار الأعنف 🚀)';
                elliottColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50';
              } else if (changeNum < -3.0) {
                elliottPhase = 'تصحيح مركب هابط';
                elliottColor = 'bg-rose-500/10 text-rose-400 border-rose-500/30';
              }

              let smcType = isShort ? 'منطقة عرض مؤسسي (Bearish OB 🟥)' : 'منطقة طلب مؤسسي (Bullish OB 🟩)';

              return {
                symbol: t.symbol,
                base: base,
                label: `${base}/USDT`,
                rawPrice: priceNum,
                price: priceNum.toFixed(decimals),
                entryLowFormatted: entryLow.toFixed(decimals > 4 ? decimals : 5),
                entryHighFormatted: entryHigh.toFixed(decimals > 4 ? decimals : 5),
                entryFormatted: priceNum.toFixed(decimals),
                slFormatted: sl.toFixed(decimals),
                tp1Formatted: tp1.toFixed(decimals),
                tp2Formatted: tp2.toFixed(decimals),
                tp3Formatted: tp3.toFixed(decimals),
                changeNum: changeNum,
                change: changeNum.toFixed(2),
                volumeNum: volNum,
                volume: (volNum / 1000000).toFixed(2) + 'M',
                buyPercent: buyPercent,
                sellPercent: sellPercent,
                netInflowNum: netInflowNum,
                netInflow: (netInflowNum >= 0 ? `+${netInflowNum.toFixed(2)}M$` : `${netInflowNum.toFixed(2)}M$`),
                isShort: isShort,
                isBreakout: isBreakout,
                smartScore: calculatedScore, // قوة القرار أصبحت ديناميكية فريدة لكل عملة
                elliottPhase: elliottPhase,
                elliottColor: elliottColor,
                smcType: smcType,
                signalTag: netInflowNum >= 0 ? 'دخول سيولة حاد 🔥' : 'خروج سيولة حاد ⚠️',
                signalColor: netInflowNum >= 0 ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30' : 'text-rose-400 bg-rose-500/10 border-rose-500/30'
              };
            })
            .filter(Boolean);

          setAllTickers(usdtPairs);
          setLoading(false);
        } catch (err) { console.error('Binance Fetch Error:', err); }
      };

      useEffect(() => {
        fetchAllBinanceData();
        const interval = setInterval(fetchAllBinanceData, 4000);
        return () => clearInterval(interval);
      }, [notificationsEnabled, soundEnabled, timeframe]);

      useEffect(() => {
        if (activeTab === 'chart' && window.TradingView) {
          let cleanSymbol = selectedSymbol ? selectedSymbol.replace('BINANCE:', '') : 'BTCUSDT';
          new window.TradingView.widget({
            "autosize": true,
            "symbol": `BINANCE:${cleanSymbol}`,
            "interval": timeframe === '5m' ? '5' : timeframe === '1h' ? '60' : '15',
            "timezone": "Asia/Riyadh",
            "theme": "dark",
            "style": "1",
            "locale": "ar",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "container_id": "tradingview_chart"
          });
        }
      }, [activeTab, selectedSymbol, timeframe]);

      const filteredPairs = useMemo(() => {
        let result = [...allTickers];
        if (category === 'inflow') {
          result = result.filter(item => item.netInflowNum > 0).sort((a, b) => b.netInflowNum - a.netInflowNum);
        } else if (category === 'outflow') {
          result = result.filter(item => item.netInflowNum < 0).sort((a, b) => a.netInflowNum - b.netInflowNum);
        } else if (category === 'majors') {
          result = result.filter(item => majorSymbols.includes(item.base));
        } else if (category === 'ai') {
          result = result.filter(item => aiSymbols.includes(item.base));
        } else {
          result.sort((a, b) => b.volumeNum - a.volumeNum);
        }
        if (searchTerm) {
          result = result.filter(item => item.label.toLowerCase().includes(searchTerm.toLowerCase()));
        }
        return result.slice(0, 60);
      }, [allTickers, searchTerm, category]);

      const favoriteTickers = useMemo(() => {
        return allTickers.filter(item => favorites.includes(item.symbol));
      }, [allTickers, favorites]);

      const breakoutSignals = useMemo(() => allTickers.filter(item => item.isBreakout).sort((a, b) => Math.abs(b.changeNum) - Math.abs(a.changeNum)).slice(0, 15), [allTickers]);
      const elliottSignals = useMemo(() => allTickers.filter(item => Math.abs(item.changeNum) >= 2.5).sort((a, b) => b.volumeNum - a.volumeNum).slice(0, 20), [allTickers]);
      const smcSignals = useMemo(() => allTickers.filter(item => item.volumeNum > 20000000 && Math.abs(item.changeNum) > 1.5).sort((a, b) => b.volumeNum - a.volumeNum).slice(0, 25), [allTickers]);
      const liquidationSignals = useMemo(() => allTickers.filter(item => Math.abs(item.changeNum) > 2.5 || item.volumeNum > 20000000).sort((a, b) => Math.abs(b.changeNum) - Math.abs(a.changeNum)).slice(0, 25), [allTickers]);
      
      const smartMoneyVipSignals = useMemo(() => {
        let list = allTickers.filter(item => Math.abs(item.netInflowNum) > 0.35).sort((a, b) => Math.abs(b.netInflowNum) - Math.abs(a.netInflowNum));
        if (vipFilter === 'long') list = list.filter(i => !i.isShort);
        if (vipFilter === 'short') list = list.filter(i => i.isShort);
        return list.slice(0, 25);
      }, [allTickers, vipFilter]);

      const selectedAiTicker = useMemo(() => {
        return allTickers.find(i => i.symbol === selectedSymbol) || allTickers[0] || {
          symbol: 'BTCUSDT', base: 'BTC', label: 'BTC/USDT', rawPrice: 65694, price: '65694.00',
          entryLowFormatted: '65606.77', entryHighFormatted: '65738.12', slFormatted: '66854.55',
          tp1Formatted: '64838.64', tp2Formatted: '62068.47', tp3Formatted: '59761.93', changeNum: -1.5, change: '-1.50',
          netInflowNum: -1.5, netInflow: '-1.50M$', smartScore: 81, smcType: 'منطقة عرض مؤسسي', isShort: true
        };
      }, [allTickers, selectedSymbol]);

      const riskAmount = (capital * (riskPercent / 100)).toFixed(2);
      const priceDiff = Math.abs(entryPrice - stopLoss);
      const posSize = priceDiff > 0 ? (riskAmount / (priceDiff / entryPrice)).toFixed(2) : 0;

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col pb-6 relative bg-gray-950 text-gray-100">
          
          {toastMessage && (
            <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 bg-emerald-500 text-gray-950 px-4 py-2.5 rounded-2xl shadow-2xl font-bold text-xs flex items-center gap-2 border border-emerald-400 animate-bounce">
              <span>{toastMessage}</span>
            </div>
          )}

          <header className="bg-gray-900 border-b border-gray-800 p-3 sticky top-0 z-50 flex items-center justify-between shadow-xl">
            <div>
              <h1 className="text-sm font-black text-emerald-400 tracking-wide flex items-center gap-1.5">
                نِبْرَاس الشَّامِلَة
                <span className="text-[10px] bg-emerald-500/20 text-emerald-300 font-normal px-1.5 py-0.5 rounded border border-emerald-500/30">V25.5</span>
              </h1>
              <p className="text-[10px] text-gray-400 mt-0.5">المستخدم: <span className="text-emerald-300 font-bold">{userTelegram}</span></p>
            </div>
            <div className="flex items-center gap-1.5">
              <button onClick={toggleSound} title="الصوت" className={`text-xs px-2 py-1.5 rounded-lg border font-bold transition ${soundEnabled ? 'bg-amber-500/20 border-amber-500/50 text-amber-300' : 'bg-gray-800 border-gray-700 text-gray-500'}`}>
                {soundEnabled ? '🔊' : '🔇'}
              </button>
              <button onClick={() => setShowNotifModal(true)} className="relative text-[11px] bg-gray-800 border border-gray-700 text-cyan-400 px-2.5 py-1.5 rounded-lg font-bold">
                🔔 الإشعارات
                {platformNotifications.length > 0 && (
                  <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">{platformNotifications.length}</span>
                )}
              </button>
              <button onClick={() => setShowSettingsModal(true)} className="text-[11px] bg-gray-800 border border-gray-700 text-emerald-400 px-2.5 py-1.5 rounded-lg font-bold">⚙️</button>
            </div>
          </header>

          {activeReportModal && (
            <div className="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-indigo-500/60 rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
                <div className="flex justify-between items-center border-b border-gray-800 pb-3">
                  <h3 className="font-black text-indigo-300 text-xs">
                    {activeReportModal === 'narrative' && '🧠 2. التقرير السردي للذكاء الاصطناعي'}
                    {activeReportModal === 'gann' && '⏳ 3. التحليل الزمني ودورات جان'}
                    {activeReportModal === 'smc' && '📊 4. مدرسة SMC والهارمونيك'}
                    {activeReportModal === 'derivatives' && '⚡ 5. المشتقات والأوردرفلو'}
                  </h3>
                  <button onClick={() => setActiveReportModal(null)} className="text-gray-400 hover:text-white font-bold text-sm">✕</button>
                </div>
                
                <div className="flex-1 overflow-y-auto space-y-3 text-xs pr-1 leading-relaxed text-gray-300">
                  <div className="bg-gray-950 p-3 rounded-xl border border-gray-800">
                    <span className="text-emerald-400 font-bold block mb-1">العملة المستهدفة: {selectedAiTicker.label}</span>
                    <span className="text-gray-400 block text-[11px]">السعر الحالي: <strong className="text-white">${selectedAiTicker.price}</strong> | الفريم: {timeframe}</span>
                  </div>

                  {activeReportModal === 'narrative' && (
                    <div className="space-y-2">
                      <p>يقوم العقل الاصطناعي بمعالجة تدفقات السيولة الحية ودورات الأوامر.</p>
                      <p className="bg-indigo-950/40 p-2.5 rounded-xl border border-indigo-500/30 text-indigo-200"><strong>الخلاصة السردية:</strong> الاتجاه الحالي يتطابق مع {selectedAiTicker.isShort ? 'ضغط بيعي وتدفقات سلبية' : 'تراكم إيجابي للشراء'} على فريم {timeframe}، بقوة قرار بلغت <span className="font-bold text-white">{selectedAiTicker.smartScore}%</span>.</p>
                    </div>
                  )}

                  {activeReportModal === 'gann' && (
                    <div className="space-y-2">
                      <p>تحليل الزوايا السعرية والزمنية.</p>
                      <p className="bg-cyan-950/40 p-2.5 rounded-xl border border-cyan-500/30 text-cyan-200"><strong>دورة جان:</strong> الزاوية السعرية تدعم الحركة المتوقعة نحو المستهدفات المحددة.</p>
                    </div>
                  )}

                  {activeReportModal === 'smc' && (
                    <div className="space-y-2">
                      <p>رصد مناطق العرض والطلب.</p>
                      <p className="bg-emerald-950/40 p-2.5 rounded-xl border border-emerald-500/30 text-emerald-200"><strong>هيكلة السوق:</strong> السعر يتفاعل حالياً مع {selectedAiTicker.smcType}.</p>
                    </div>
                  )}

                  {activeReportModal === 'derivatives' && (
                    <div className="space-y-2">
                      <p>تحليل الفائدة المفتوحة والأوردرفلو.</p>
                      <p className="bg-amber-950/40 p-2.5 rounded-xl border border-amber-500/30 text-amber-200"><strong>صافي السيولة:</strong> <span className="font-mono font-bold">{selectedAiTicker.netInflow}</span>.</p>
                    </div>
                  )}
                </div>

                <button onClick={() => setActiveReportModal(null)} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs shadow">
                  إغلاق التقرير
                </button>
              </div>
            </div>
          )}

          {showSettingsModal && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-emerald-500/50 rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-2xl">
                <div className="flex justify-between items-center"><h3 className="font-bold text-emerald-400 text-sm">الإعدادات</h3><button onClick={() => setShowSettingsModal(false)} className="text-gray-400 font-bold">✕</button></div>

                  <button onClick={() => setCategory('inflow')} className={`px-3 py-1.5 rounded-lg border font-bold whitespace-nowrap ${category === 'inflow' ? 'bg-emerald-500 text-gray-950 border-emerald-500' : 'bg-gray-900 border-gray-800 text-gray-300'}`}>دخول سيولة 🔥</button>
                  <button onClick={() => setCategory('outflow')} className={`px-3 py-1.5 rounded-lg border font-bold whitespace-nowrap ${category === 'outflow' ? 'bg-rose-500 text-white border-rose-500' : 'bg-gray-900 border-gray-800 text-gray-300'}`}>خروج سيولة ⚠️</button>
                  <button onClick={() => setCategory('majors')} className={`px-3 py-1.5 rounded-lg border font-bold whitespace-nowrap ${category === 'majors' ? 'bg-emerald-500 text-gray-950 border-emerald-500' : 'bg-gray-900 border-gray-800 text-gray-300'}`}>العملات الكبرى</button>
                  <button onClick={() => setCategory('ai')} className={`px-3 py-1.5 rounded-lg border font-bold whitespace-nowrap ${category === 'ai' ? 'bg-emerald-500 text-gray-950 border-emerald-500' : 'bg-gray-900 border-gray-800 text-gray-300'}`}>الذكاء الاصطناعي</button>
                </div>

                {loading ? <div className="text-center py-12 text-gray-400 text-xs">جاري تحليل بيانات السيولة...</div> : (
                  filteredPairs.map((item, idx) => {
                    const isFav = favorites.includes(item.symbol);
                    return (
                      <div key={idx} className="bg-gray-900 border border-gray-800 rounded-xl p-3.5 space-y-2.5">
                        <div className="flex justify-between items-center">
                          <div className="flex items-center gap-2 cursor-pointer" onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}>
                            <span className={`text-[10px] font-black px-1.5 py-0.5 rounded border ${item.isShort ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'}`}>
                              {item.isShort ? 'SHORT 🔴' : 'LONG 🟢'}
                            </span>
                            <span className="font-extrabold text-sm text-white">{item.label}</span>
                          </div>
                          <div className="flex gap-1.5">
                            <button onClick={() => copyTradePlanText(item)} className="text-[10px] bg-gray-800 border border-gray-700 text-indigo-300 px-2 py-1 rounded font-bold">نسخ 📋</button>
                            <button onClick={() => toggleFavorite(item.symbol)} className={`text-xs px-2 py-1 rounded-lg border font-bold ${isFav ? 'bg-amber-400 text-black border-amber-400' : 'bg-gray-800 border-gray-700 text-amber-400'}`}>
                              {isFav ? '⭐ مفضلة' : '☆ أضف'}
                            </button>
                          </div>
                        </div>
                        <div className="flex justify-between items-center text-xs cursor-pointer" onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}>
                          <div><span className="text-gray-400 text-[11px] block">السعر والتغير</span><span className="font-mono font-bold text-white">${item.price}</span><span className={`text-[11px] font-bold mr-1.5 ${item.changeNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{item.change}%</span></div>
                          <div className="text-left"><span className="text-gray-400 text-[11px] block">صافي السيولة</span><span className={`font-mono font-bold ${item.netInflowNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{item.netInflow}</span></div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            )}

            {activeTab === 'signals' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-amber-500/40 rounded-2xl p-3.5 flex justify-between items-center">
                  <h2 className="font-black text-amber-400 text-xs">🎯 مرصد الصفقات الذكية VIP</h2>
                  <div className="flex gap-1 text-[10px]">
                    <button onClick={() => setVipFilter('all')} className={`px-2 py-1 rounded font-bold ${vipFilter === 'all' ? 'bg-amber-400 text-black' : 'text-gray-400'}`}>الكل</button>
                    <button onClick={() => setVipFilter('long')} className={`px-2 py-1 rounded font-bold ${vipFilter === 'long' ? 'bg-emerald-500 text-black' : 'text-gray-400'}`}>LONG</button>
                    <button onClick={() => setVipFilter('short')} className={`px-2 py-1 rounded font-bold ${vipFilter === 'short' ? 'bg-rose-500 text-white' : 'text-gray-400'}`}>SHORT</button>
                  </div>
                </div>
                {smartMoneyVipSignals.map((item, idx) => (
                  <div key={idx} className="bg-gray-900 border border-amber-500/40 rounded-2xl p-3.5 space-y-3">
                    <div className="flex justify-between items-center">
                      <span className={`font-black text-[10px] px-2 py-0.5 rounded ${item.isShort ? 'bg-rose-500 text-white' : 'bg-emerald-500 text-gray-950'}`}>{item.isShort ? 'SHORT 🔴' : 'LONG 🟢'}</span>
                      <span className="font-extrabold text-sm text-white cursor-pointer" onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}>{item.label}</span>
                      <button onClick={() => copyTradePlanText(item)} className="text-[10px] bg-amber-500 text-black px-2 py-1 rounded font-bold">نسخ 📋</button>
                    </div>
                    <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]" onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-gray-800"><span className="text-gray-400 block text-[8px]">الدخول</span><span className="text-white font-mono font-bold">${item.entryFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-rose-500/30"><span className="text-rose-400 block text-[8px]">وقف (SL)</span><span className="text-rose-300 font-mono font-bold">${item.slFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-emerald-500/30"><span className="text-emerald-400 block text-[8px]">الهدف 1</span><span className="text-emerald-300 font-mono font-bold">${item.tp1Formatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-cyan-500/30"><span className="text-cyan-400 block text-[8px]">الهدف 2</span><span className="text-cyan-300 font-mono font-bold">${item.tp2Formatted}</span></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'breakouts' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-emerald-500/40 rounded-2xl p-3.5"><h2 className="font-black text-emerald-400 text-xs">🚀 الانفجارات السعرية</h2></div>
                {breakoutSignals.map((item, idx) => (
                  <div key={idx} className="bg-gray-900 border border-emerald-500/50 rounded-2xl p-3.5 space-y-3">
                    <div className="flex justify-between items-center">
                      <span className={`font-black text-[10px] px-2 py-0.5 rounded ${item.isShort ? 'bg-rose-500 text-white' : 'bg-emerald-500 text-gray-950'}`}>{item.isShort ? 'SHORT 🔴' : 'LONG 🟢'}</span>
                      <span className="font-extrabold text-sm text-white cursor-pointer" onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}>{item.label}</span>
                      <button onClick={() => copyTradePlanText(item)} className="text-[10px] bg-emerald-500 text-black px-2 py-1 rounded font-bold">نسخ 📋</button>
                    </div>
                    <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]" onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-gray-800"><span className="text-gray-400 block text-[8px]">الدخول</span><span className="text-white font-mono font-bold">${item.entryFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-rose-500/30"><span className="text-rose-400 block text-[8px]">وقف (SL)</span><span className="text-rose-300 font-mono font-bold">${item.slFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-emerald-500/30"><span className="text-emerald-400 block text-[8px]">الهدف 1</span><span className="text-emerald-300 font-mono font-bold">${item.tp1Formatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-cyan-500/30"><span className="text-cyan-400 block text-[8px]">الهدف 2</span><span className="text-cyan-300 font-mono font-bold">${item.tp2Formatted}</span></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'elliott' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-cyan-500/40 rounded-2xl p-3.5"><h2 className="font-black text-cyan-400 text-xs">🌊 موجات إليوت</h2></div>
                {elliottSignals.map((item, idx) => (
                  <div key={idx} className="bg-gray-900 border border-cyan-500/40 rounded-2xl p-3.5 space-y-3">
                    <div className="flex justify-between items-center">
                      <span className={`font-black text-[10px] px-2.5 py-1 rounded-lg border ${item.elliottColor}`}>{item.elliottPhase}</span>
                      <span className="font-extrabold text-sm text-white cursor-pointer" onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}>{item.label}</span>
                      <button onClick={() => copyTradePlanText(item)} className="text-[10px] bg-cyan-500 text-black px-2 py-1 rounded font-bold">نسخ 📋</button>
                    </div>
                    <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]" onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-gray-800"><span className="text-gray-400 block text-[8px]">الدخول</span><span className="text-white font-mono font-bold">${item.entryFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-rose-500/30"><span className="text-rose-400 block text-[8px]">وقف (SL)</span><span className="text-rose-300 font-mono font-bold">${item.slFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-emerald-500/30"><span className="text-emerald-400 block text-[8px]">الهدف 1</span><span className="text-emerald-300 font-mono font-bold">${item.tp1Formatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-cyan-500/30"><span className="text-cyan-400 block text-[8px]">الهدف 2</span><span className="text-cyan-300 font-mono font-bold">${item.tp2Formatted}</span></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'smc' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-emerald-500/40 rounded-2xl p-3.5"><h2 className="font-black text-emerald-400 text-xs">📊 مناطق SMC / ICT</h2></div>
                {smcSignals.map((item, idx) => (
                  <div key={idx} className="bg-gray-900 border border-emerald-500/40 rounded-2xl p-3.5 space-y-3">
                    <div className="flex justify-between items-center">
                      <span className="font-extrabold text-sm text-white cursor-pointer" onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}>{item.label}</span>
                      <span className="text-emerald-400 text-xs font-bold">{item.smcType}</span>
                      <button onClick={() => copyTradePlanText(item)} className="text-[10px] bg-emerald-500 text-black px-2 py-1 rounded font-bold">نسخ 📋</button>
                    </div>
                    <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]" onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-gray-800"><span className="text-gray-400 block text-[8px]">الدخول</span><span className="text-white font-mono font-bold">${item.entryFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-rose-500/30"><span className="text-rose-400 block text-[8px]">وقف (SL)</span><span className="text-rose-300 font-mono font-bold">${item.slFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-emerald-500/30"><span className="text-emerald-400 block text-[8px]">الهدف 1</span><span className="text-emerald-300 font-mono font-bold">${item.tp1Formatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-cyan-500/30"><span className="text-cyan-400 block text-[8px]">الهدف 2</span><span className="text-cyan-300 font-mono font-bold">${item.tp2Formatted}</span></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'liquidation' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-rose-500/40 rounded-2xl p-3.5"><h2 className="font-black text-rose-400 text-xs">⚡ التصفيات والسقويز</h2></div>
                {liquidationSignals.map((item, idx) => (
                  <div key={idx} className="bg-gray-900 border border-rose-500/40 rounded-2xl p-3.5 space-y-3">
                    <div className="flex justify-between items-center">
                      <span className="font-extrabold text-sm text-white cursor-pointer" onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}>{item.label}</span>
                      <span className="text-rose-400 text-xs font-bold">{item.smcType}</span>
                      <button onClick={() => copyTradePlanText(item)} className="text-[10px] bg-rose-500 text-white px-2 py-1 rounded font-bold">نسخ 📋</button>
                    </div>
                    <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]" onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-gray-800"><span className="text-gray-400 block text-[8px]">الدخول</span><span className="text-white font-mono font-bold">${item.entryFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-rose-500/30"><span className="text-rose-400 block text-[8px]">وقف (SL)</span><span className="text-rose-300 font-mono font-bold">${item.slFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-emerald-500/30"><span className="text-emerald-400 block text-[8px]">الهدف 1</span><span className="text-emerald-300 font-mono font-bold">${item.tp1Formatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-cyan-500/30"><span className="text-cyan-400 block text-[8px]">الهدف 2</span><span className="text-cyan-300 font-mono font-bold">${item.tp2Formatted}</span></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'journal' && (
              <div className="space-y-4">
                <div className="bg-gray-900 border border-emerald-500/40 rounded-2xl p-4 space-y-3">
                  <h2 className="font-bold text-emerald-400 text-xs">📖 دفتر الصفقات (Win Rate: {journalStats.winRate}%)</h2>
                  <form onSubmit={addJournalTrade} className="space-y-2 pt-2 border-t border-gray-800">
                    <div className="grid grid-cols-2 gap-2">
                      <input type="text" value={newTradeSymbol} onChange={(e) => setNewTradeSymbol(e.target.value)} placeholder="العملة (BTCUSDT)" className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white" required />
                      <select value={newTradeType} onChange={(e) => setNewTradeType(e.target.value)} className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white"><option value="LONG">LONG 🟢</option><option value="SHORT">SHORT 🔴</option></select>
                    </div>
                    <div className="grid grid-cols-3 gap-2">
                      <input type="number" step="any" value={newTradeEntry} onChange={(e) => setNewTradeEntry(e.target.value)} placeholder="الدخول" className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white" required />
                      <select value={newTradeResult} onChange={(e) => setNewTradeResult(e.target.value)} className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white"><option value="WIN">ربح ✅</option><option value="LOSS">خسارة ❌</option></select>
                      <input type="number" step="any" value={newTradePnL} onChange={(e) => setNewTradePnL(e.target.value)} placeholder="الربح ($)" className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white" required />
                    </div>
                    <button type="submit" className="w-full bg-emerald-500 text-gray-950 font-bold py-2 rounded-xl text-xs">تسجيل الصفقة</button>
                  </form>
                </div>
                {journalTrades.map((t) => (
                  <div key={t.id} className="bg-gray-900 border border-gray-800 rounded-xl p-3 flex justify-between items-center text-xs">
                    <div><span className={`font-bold ${t.type === 'LONG' ? 'text-emerald-400' : 'text-rose-400'}`}>{t.type}</span> <strong className="text-white">{t.symbol}</strong></div>
                    <div className="flex items-center gap-3"><span className={`font-mono font-bold ${t.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>${t.pnl}</span><button onClick={() => deleteJournalTrade(t.id)} className="text-gray-500 hover:text-rose-400">✕</button></div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'heatmap' && (
              <div className="grid grid-cols-3 gap-2">
                {allTickers.slice(0, 30).map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className={`p-3 rounded-xl border flex flex-col justify-between items-center text-center cursor-pointer ${item.changeNum >= 0 ? 'bg-emerald-950/40 border-emerald-500/30' : 'bg-rose-950/40 border-rose-500/30'}`}>
                    <span className="font-extrabold text-xs text-white">{item.base}</span>
                    <span className={`font-mono font-bold text-xs ${item.changeNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{item.change}%</span>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'chart' && (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-2 space-y-2 h-[520px]">
                <div className="text-xs font-bold text-emerald-400 px-2">الشارت المباشر: BINANCE:{selectedSymbol}</div>
                <div id="tradingview_chart" className="h-[470px] w-full"></div>
              </div>
            )}

            {activeTab === 'risk' && (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-4 text-xs">
                <h2 className="font-bold text-emerald-400 text-sm">حاسبة إدارة المخاطر</h2>
                <div className="space-y-3">
                  <div><label className="text-gray-400 block mb-1">رأس المال ($):</label><input type="number" value={capital} onChange={(e) => setCapital(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white" /></div>
                  <div><label className="text-gray-400 block mb-1">المخاطرة (%):</label><input type="number" value={riskPercent} onChange={(e) => setRiskPercent(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white" /></div>
                  <div className="p-3 bg-gray-950 border border-emerald-500/30 rounded-lg space-y-1">
                    <div className="flex justify-between"><span className="text-gray-400">المخاطرة:</span><span className="font-bold text-rose-400">${riskAmount}</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">العقد:</span><span className="font-bold text-emerald-400">${posSize}</span></div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NebrasApp />);
  </script>
</body>
</html>
