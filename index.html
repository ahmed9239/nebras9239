<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نِبْرَاس الشَّامِلَة - محطة التداول المؤسسي V25.0</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.99); }
    }
    .animate-pulse-fast { animation: pulse-fast 1.2s infinite; }
    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-down { animation: slideDown 0.35s ease-out forwards; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen selection:bg-emerald-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const playSmartAlertSound = () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const playTone = (freq, startTime, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.18, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        };
        playTone(587.33, now, 0.14);
        playTone(880.00, now + 0.14, 0.28);
      } catch (e) {
        console.error('Audio play error:', e);
      }
    };

    function NebrasApp() {
      const [activeTab, setActiveTab] = useState('security_ai'); // التبويب الجديد المفعل افتراضياً للاطلاع
      const [timeframe, setTimeframe] = useState('1h');
      const [elliottScope, setElliottScope] = useState('small');
      const [category, setCategory] = useState('all');
      const [vipFilter, setVipFilter] = useState('all');
      const [loading, setLoading] = useState(true);
      const [allTickers, setAllTickers] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedSymbol, setSelectedSymbol] = useState('BTCUSDT');
      const [manualSymbolInput, setManualSymbolInput] = useState('');
      
      const [userTelegram, setUserTelegram] = useState(localStorage.getItem('nebras_telegram') || '@ahmed17200');
      const [notificationsEnabled, setNotificationsEnabled] = useState(JSON.parse(localStorage.getItem('nebras_notif_active') || 'true'));
      const [soundEnabled, setSoundEnabled] = useState(JSON.parse(localStorage.getItem('nebras_sound_active') || 'true'));
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showNotifModal, setShowNotifModal] = useState(false);
      
      const [visualBanner, setVisualBanner] = useState(null);
      const lastAlertedSymbolRef = useRef('');

      const [platformNotifications, setPlatformNotifications] = useState(JSON.parse(localStorage.getItem('nebras_notif_list') || '[]'));

      const [journalTrades, setJournalTrades] = useState(JSON.parse(localStorage.getItem('nebras_journal') || '[]'));
      const [newTradeSymbol, setNewTradeSymbol] = useState('BTCUSDT');
      const [newTradeType, setNewTradeType] = useState('LONG');
      const [newTradeEntry, setNewTradeEntry] = useState('');
      const [newTradeResult, setNewTradeResult] = useState('WIN');
      const [newTradePnL, setNewTradePnL] = useState('');

      const [capital, setCapital] = useState(1000);
      const [riskPercent, setRiskPercent] = useState(2);
      const [entryPrice, setEntryPrice] = useState(67000);
      const [stopLoss, setStopLoss] = useState(66000);

      const aiSymbols = ['TAO', 'FET', 'NEAR', 'RNDR', 'WLD', 'AGIX', 'AKT'];
      const majorSymbols = ['BTC', 'ETH', 'SOL', 'BNB', 'XRP', 'ADA', 'AVAX'];

      const saveTelegramSettings = (e) => {
        e.preventDefault();
        localStorage.setItem('nebras_telegram', userTelegram);
        setShowSettingsModal(false);
      };

      const toggleNotifications = () => {
        const newState = !notificationsEnabled;
        setNotificationsEnabled(newState);
        localStorage.setItem('nebras_notif_active', JSON.stringify(newState));
        if (newState) {
          if (soundEnabled) playSmartAlertSound();
          addPlatformNotification("تم تفعيل تنبيهات الصفقات الذكية 🔔");
        }
      };

      const toggleSound = () => {
        const newState = !soundEnabled;
        setSoundEnabled(newState);
        localStorage.setItem('nebras_sound_active', JSON.stringify(newState));
        if (newState) playSmartAlertSound();
      };

      const addPlatformNotification = (text, symbol = null) => {
        const newNotif = {
          id: Date.now(),
          text: text,
          symbol: symbol,
          time: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        };
        setPlatformNotifications(prev => {
          const updated = [newNotif, ...prev].slice(0, 30);
          localStorage.setItem('nebras_notif_list', JSON.stringify(updated));
          return updated;
        });
      };

      const clearPlatformNotifications = () => {
        setPlatformNotifications([]);
        localStorage.removeItem('nebras_notif_list');
      };

      const fetchAllBinanceData = async () => {
        try {
          const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
          const data = await res.json();
          
          const usdtPairs = data
            .filter(t => t.symbol.endsWith('USDT'))
            .map(t => {
              const base = t.symbol.replace('USDT', '');
              const priceNum = parseFloat(t.lastPrice);
              if (priceNum <= 0) return null;
              
              let decimals = 2;
              if (priceNum < 0.0001) decimals = 8;
              else if (priceNum < 1) decimals = 4;

              const changeNum = parseFloat(t.priceChangePercent);
              const volNum = parseFloat(t.quoteVolume);

              const buyPercent = Math.min(Math.max(50 + (changeNum * 2.5), 20), 85).toFixed(1);
              const sellPercent = (100 - parseFloat(buyPercent)).toFixed(1);
              const netInflowNum = (volNum * (changeNum / 100) * 0.15) / 1000000;
              
              const isShort = netInflowNum < -0.25;
              const isBreakout = Math.abs(changeNum) >= 4.0 || volNum > 50000000;
              
              let entryLow = priceNum * 0.999;
              let entryHigh = priceNum * 1.001;
              let sl = isShort ? priceNum * 1.018 : priceNum * 0.982;
              const tp1 = isShort ? priceNum * 0.975 : priceNum * 1.025;
              const tp2 = isShort ? priceNum * 0.945 : priceNum * 1.055;
              const tp3 = isShort ? priceNum * 0.910 : priceNum * 1.100;

              return {
                symbol: t.symbol,
                base: base,
                label: `${base}/USDT`,
                rawPrice: priceNum,
                price: priceNum.toFixed(decimals),
                entryLowFormatted: entryLow.toFixed(decimals > 4 ? decimals : 5),
                entryHighFormatted: entryHigh.toFixed(decimals > 4 ? decimals : 5),
                entryFormatted: priceNum.toFixed(decimals),
                slFormatted: sl.toFixed(decimals),
                tp1Formatted: tp1.toFixed(decimals),
                tp2Formatted: tp2.toFixed(decimals),
                tp3Formatted: tp3.toFixed(decimals),
                changeNum: changeNum,
                change: changeNum.toFixed(2),
                volumeNum: volNum,
                volume: (volNum / 1000000).toFixed(2) + 'M',
                buyPercent: buyPercent,
                sellPercent: sellPercent,
                netInflowNum: netInflowNum,
                netInflow: (netInflowNum >= 0 ? `+${netInflowNum.toFixed(2)}M$` : `${netInflowNum.toFixed(2)}M$`),
                isShort: isShort,
                isBreakout: isBreakout,
                smartScore: 65,
                signalTag: netInflowNum >= 0 ? 'دخول سيولة حاد 🔥' : 'خروج سيولة حاد ⚠️',
                signalColor: netInflowNum >= 0 ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30' : 'text-rose-400 bg-rose-500/10 border-rose-500/30'
              };
            })
            .filter(Boolean);

          setAllTickers(usdtPairs);
          setLoading(false);
        } catch (err) {
          console.error('Binance Fetch Error:', err);
        }
      };

      useEffect(() => {
        fetchAllBinanceData();
        const interval = setInterval(fetchAllBinanceData, 4000);
        return () => clearInterval(interval);
      }, [notificationsEnabled, soundEnabled]);

      useEffect(() => {
        if (activeTab === 'chart' && window.TradingView) {
          let cleanSymbol = selectedSymbol ? selectedSymbol.replace('BINANCE:', '') : 'BTCUSDT';
          new window.TradingView.widget({
            "autosize": true,
            "symbol": `BINANCE:${cleanSymbol}`,
            "interval": timeframe === '5m' ? '5' : timeframe === '1h' ? '60' : '15',
            "timezone": "Asia/Riyadh",
            "theme": "dark",
            "style": "1",
            "locale": "ar",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "container_id": "tradingview_chart"
          });
        }
      }, [activeTab, selectedSymbol, timeframe]);

      const filteredPairs = useMemo(() => {
        let result = [...allTickers];
        if (category === 'inflow') {
          result = result.filter(item => item.netInflowNum > 0).sort((a, b) => b.netInflowNum - a.netInflowNum);
        } else if (category === 'outflow') {
          result = result.filter(item => item.netInflowNum < 0).sort((a, b) => a.netInflowNum - b.netInflowNum);
        } else if (category === 'majors') {
          result = result.filter(item => majorSymbols.includes(item.base));
        } else if (category === 'ai') {
          result = result.filter(item => aiSymbols.includes(item.base));
        } else {
          result.sort((a, b) => b.volumeNum - a.volumeNum);
        }
        if (searchTerm) {
          result = result.filter(item => item.label.toLowerCase().includes(searchTerm.toLowerCase()));
        }
        return result.slice(0, 60);
      }, [allTickers, searchTerm, category]);

      const breakoutSignals = useMemo(() => {
        return allTickers.filter(item => item.isBreakout).sort((a, b) => Math.abs(b.changeNum) - Math.abs(a.changeNum)).slice(0, 15);
      }, [allTickers]);

      const elliottSignals = useMemo(() => {
        return allTickers.filter(item => Math.abs(item.changeNum) >= 2.5).sort((a, b) => b.volumeNum - a.volumeNum).slice(0, 20);
      }, [allTickers]);

      const smcSignals = useMemo(() => {
        return allTickers.filter(item => item.volumeNum > 20000000 && Math.abs(item.changeNum) > 1.5).sort((a, b) => b.volumeNum - a.volumeNum).slice(0, 25);
      }, [allTickers]);

      const liquidationSignals = useMemo(() => {
        return allTickers.filter(item => Math.abs(item.changeNum) > 2.5 || item.volumeNum > 20000000).sort((a, b) => Math.abs(b.changeNum) - Math.abs(a.changeNum)).slice(0, 25);
      }, [allTickers]);

      const smartMoneyVipSignals = useMemo(() => {
        let list = allTickers.filter(item => Math.abs(item.netInflowNum) > 0.35).sort((a, b) => Math.abs(b.netInflowNum) - Math.abs(a.netInflowNum));
        if (vipFilter === 'long') list = list.filter(i => !i.isShort);
        if (vipFilter === 'short') list = list.filter(i => i.isShort);
        return list.slice(0, 25);
      }, [allTickers, vipFilter]);

      const selectedAiTicker = useMemo(() => {
        return allTickers.find(i => i.symbol === selectedSymbol) || allTickers[0] || {
          symbol: 'BARDUSDT', base: 'BARD', label: 'BARD/USDT', rawPrice: 0.030950, price: '0.030950',
          entryLowFormatted: '0.029484', entryHighFormatted: '0.030691', slFormatted: '0.027500',
          tp1Formatted: '0.034000', tp2Formatted: '0.038000', tp3Formatted: '0.042000', changeNum: 3.5, change: '3.50',
          netInflowNum: 1.2, netInflow: '+1.20M$', smartScore: 65
        };
      }, [allTickers, selectedSymbol]);

      const topInflow = useMemo(() => {
        const sorted = [...allTickers].sort((a, b) => b.netInflowNum - a.netInflowNum);
        return sorted.find(item => item.netInflowNum > 0) || sorted[0];
      }, [allTickers]);

      const topOutflow = useMemo(() => {
        const sorted = [...allTickers].sort((a, b) => a.netInflowNum - b.netInflowNum);
        return sorted.find(item => item.netInflowNum < 0) || sorted[sorted.length - 1];
      }, [allTickers]);

      const riskAmount = (capital * (riskPercent / 100)).toFixed(2);
      const priceDiff = Math.abs(entryPrice - stopLoss);
      const posSize = priceDiff > 0 ? (riskAmount / (priceDiff / entryPrice)).toFixed(2) : 0;

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col pb-6 relative bg-gray-950 text-gray-100">
          
          <header className="bg-gray-900 border-b border-gray-800 p-3 sticky top-0 z-50 flex items-center justify-between shadow-xl">
            <div>
              <h1 className="text-sm font-black text-emerald-400 tracking-wide flex items-center gap-1.5">
                نِبْرَاس الشَّامِلَة
                <span className="text-[10px] bg-emerald-500/20 text-emerald-300 font-normal px-1.5 py-0.5 rounded border border-emerald-500/30">V25.0</span>
              </h1>
              <p className="text-[10px] text-gray-400 mt-0.5">المستخدم: <span className="text-emerald-300 font-bold">{userTelegram}</span></p>
            </div>
            <div className="flex items-center gap-1.5">
              <button onClick={toggleSound} title="الصوت" className={`text-xs px-2 py-1.5 rounded-lg border font-bold transition ${soundEnabled ? 'bg-amber-500/20 border-amber-500/50 text-amber-300' : 'bg-gray-800 border-gray-700 text-gray-500'}`}>
                {soundEnabled ? '🔊' : '🔇'}
              </button>
              <button onClick={() => setShowNotifModal(true)} className="relative text-[11px] bg-gray-800 border border-gray-700 text-cyan-400 px-2.5 py-1.5 rounded-lg font-bold">
                🔔 الإشعارات
                {platformNotifications.length > 0 && (
                  <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">{platformNotifications.length}</span>
                )}
              </button>
              <button onClick={() => setShowSettingsModal(true)} className="text-[11px] bg-gray-800 border border-gray-700 text-emerald-400 px-2.5 py-1.5 rounded-lg font-bold">⚙️</button>
            </div>
          </header>

          {showSettingsModal && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-emerald-500/50 rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-2xl">
                <div className="flex justify-between items-center"><h3 className="font-bold text-emerald-400 text-sm">الإعدادات</h3><button onClick={() => setShowSettingsModal(false)} className="text-gray-400 font-bold">✕</button></div>
                <div className="bg-gray-950 p-3 rounded-xl border border-gray-800 flex items-center justify-between">
                  <span className="text-xs text-white font-bold">التنبيهات الفورية</span>
                  <button onClick={toggleNotifications} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${notificationsEnabled ? 'bg-emerald-500 text-gray-950' : 'bg-rose-500/20 text-rose-400'}`}>{notificationsEnabled ? 'مفعلة' : 'معطلة'}</button>
                </div>
                <button onClick={() => setShowSettingsModal(false)} className="w-full bg-emerald-500 text-gray-950 text-xs py-2 rounded-xl font-bold">حفظ</button>
              </div>
            </div>
          )}

          {showNotifModal && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-cyan-500/50 rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-2xl max-h-[80vh] flex flex-col">
                <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                  <h3 className="font-bold text-cyan-400 text-sm">سجل التنبيهات</h3>
                  <button onClick={() => setShowNotifModal(false)} className="text-gray-400 font-bold">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                  {platformNotifications.map((n) => (
                    <div key={n.id} className="bg-gray-950 border border-gray-800 p-2.5 rounded-xl text-xs"><p className="text-white">{n.text}</p><span className="text-[9px] text-gray-400">{n.time}</span></div>
                  ))}
                </div>
                <button onClick={clearPlatformNotifications} className="w-full bg-rose-500/20 border border-rose-500/50 text-rose-400 text-xs py-2 rounded-xl font-bold">مسح السجل</button>
              </div>
            </div>
          )}

          {/* شريط التبويبات (تم إضافة تبويب الأداة الجديدة كأول تبويب) */}
          <nav className="flex overflow-x-auto no-scrollbar bg-gray-900/90 p-1.5 m-3 rounded-xl border border-gray-800 gap-1 text-[10px] whitespace-nowrap">
            <button onClick={() => setActiveTab('security_ai')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'security_ai' ? 'bg-indigo-600 text-white shadow-lg' : 'text-indigo-400 border border-indigo-500/30'}`}>🛡️ تحليل الأمان والذكاء الاصطناعي</button>
            <button onClick={() => setActiveTab('ai_predict')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'ai_predict' ? 'bg-indigo-600 text-white shadow-lg' : 'text-gray-400'}`}>🧠 العقل الاصطناعي V5.0</button>
            <button onClick={() => setActiveTab('radar')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'radar' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>الرادار 📡</button>
            <button onClick={() => setActiveTab('signals')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'signals' ? 'bg-amber-400 text-gray-950 shadow-lg' : 'text-amber-400 border border-amber-500/30'}`}>VIP الذكي 🎯</button>
            <button onClick={() => setActiveTab('breakouts')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'breakouts' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>الانفجارات 🚀</button>
            <button onClick={() => setActiveTab('elliott')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'elliott' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>إليوت 🌊</button>
            <button onClick={() => setActiveTab('smc')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'smc' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>SMC 📊</button>
            <button onClick={() => setActiveTab('liquidation')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'liquidation' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>التصفيات ⚡</button>
            <button onClick={() => setActiveTab('journal')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'journal' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>الدفتر 📖</button>
            <button onClick={() => setActiveTab('chart')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'chart' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>الشارت</button>
            <button onClick={() => setActiveTab('risk')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'risk' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>المخاطر</button>
          </nav>

          <main className="flex-1 px-3 space-y-3">
            
            {/* --- تبويب الأداة الجديدة المطابقة تماماً للصور (تحليل الأمان والذكاء الاصطناعي) --- */}
            {activeTab === 'security_ai' && selectedAiTicker && (
              <div className="space-y-3">
                
                {/* شريط البحث اليدوي والعملات */}
                <div className="bg-gray-900 border border-indigo-500/40 rounded-2xl p-4 space-y-3">
                  <div className="flex gap-2">
                    <input 
                      type="text"
                      placeholder="أدخل رمز العملة للتحليل (مثال: BARD, PLAY, HOT)..."
                      value={manualSymbolInput}
                      onChange={(e) => setManualSymbolInput(e.target.value)}
                      className="flex-1 bg-gray-950 border border-indigo-500/50 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none"
                    />
                    <button 
                      onClick={() => {
                        if (!manualSymbolInput) return;
                        let sym = manualSymbolInput.toUpperCase().trim();
                        if (!sym.endsWith('USDT')) sym += 'USDT';
                        setSelectedSymbol(sym);
                        setManualSymbolInput('');
                      }}
                      className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-xl text-xs shadow"
                    >
                      تحليل 🔍
                    </button>
                  </div>
                  <div className="flex gap-1 overflow-x-auto no-scrollbar pb-1 text-[11px]">
                    {['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'BARDUSDT', 'PLAYUSDT', 'HOTUSDT'].map((sym, idx) => (
                      <button 
                        key={idx}
                        onClick={() => setSelectedSymbol(sym)}
                        className={`px-3 py-1.5 rounded-lg border font-bold whitespace-nowrap ${selectedSymbol === sym ? 'bg-amber-400 text-black border-amber-400' : 'bg-gray-950 border-gray-800 text-gray-300'}`}
                      >
                        {sym.replace('USDT', '')}
                      </button>
                    ))}
                  </div>
                </div>

                {/* 1. بطاقة توقع الافتتاح والذكاء الاصطناعي (مستوحاة من الصورة الأولى والثانية) */}
                <div className="bg-gradient-to-br from-indigo-950/80 via-gray-900 to-purple-950/60 border border-indigo-500/50 rounded-2xl p-4 space-y-3 shadow-xl">
                  <div className="flex justify-between items-center">
                    <div>
                      <span className="text-[10px] text-emerald-400 font-bold">توقع الافتتاح • الذكاء الاصطناعي + HORIZON</span>
                      <h2 className="text-base font-black text-white mt-1">▲ صاعد 57%</h2>
                    </div>
                    {/* مؤشر القوس الدائري */}
                    <div className="w-14 h-14 rounded-full border-4 border-emerald-500 flex flex-col items-center justify-center bg-gray-950 shadow">
                      <span className="text-xs font-black text-emerald-400">57</span>
                      <span className="text-[7px] text-gray-400">صعود</span>
                    </div>
                  </div>
                  <p className="text-[10px] text-amber-300 font-bold bg-amber-500/10 p-2 rounded-xl border border-amber-500/30">
                    ⚠️ ثقة منخفضة + | حتى أول قراءة لـ Horizon عند min 5+
                  </p>
                  <div className="flex gap-2">
                    <button onClick={() => alert('جاري تشغيل تحليل الرسم البياني المتقدم والمستويات الحية...')} className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs shadow flex items-center justify-center gap-1.5">
                      ✨ حلّل الرسم البياني <span className="text-[9px] text-indigo-200 font-normal">(يرسم المستويات ومناطق التداول)</span>
                    </button>
                  </div>
                </div>

                {/* 2. بطاقة تفاصيل الشمعة والإغلاق المتوقع (مستوحاة من الصورة) */}
                <div className="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-3">
                  <div className="grid grid-cols-3 gap-2 text-center text-xs border-b border-gray-800 pb-3">
                    <div>
                      <span className="text-gray-400 block text-[9px]">الآن</span>
                      <span className="text-white font-mono font-bold">${selectedAiTicker.price}</span>
                    </div>
                    <div>
                      <span className="text-gray-400 block text-[9px]">إغلاق متوقع</span>
                      <span className="text-emerald-400 font-mono font-bold">${selectedAiTicker.entryLowFormatted}</span>
                    </div>
                    <div>
                      <span className="text-gray-400 block text-[9px]">تغلق بعد</span>
                      <span className="text-amber-300 font-mono font-bold">14:14</span>
                    </div>
                  </div>

                  <div className="space-y-1.5">
                    <span className="text-[10px] text-gray-400 font-bold block">نطاق الذكاء الاصطناعي لهذه الشمعة:</span>
                    <div className="bg-gray-950 p-2 rounded-xl border border-gray-800 flex justify-between items-center text-xs">
                      <span className="text-rose-400 font-mono">▼ {selectedAiTicker.entryLowFormatted}</span>
                      <span className="w-3 h-3 rounded-full bg-amber-400 inline-block animate-pulse"></span>
                      <span className="text-emerald-400 font-mono">▲ {selectedAiTicker.entryHighFormatted}</span>
                    </div>
                    <span className="text-[9px] text-emerald-400 font-bold block text-left">✓ تم الوصول</span>
                  </div>
                </div>

                {/* 3. بطاقة القرار العملي ورأي الذكاء الاصطناعي (مستوحاة من صور BARD و PLAY) */}
                <div className="bg-gray-900 border border-indigo-500/40 rounded-2xl p-4 space-y-3">
                  <div className="flex justify-between items-center">
                    <span className="text-[10px] text-indigo-400 font-bold">إعداد تداول تعليمي</span>
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-bold">صاعد ↗</span>
                  </div>
                  <h3 className="text-sm font-black text-white">{selectedAiTicker.base} • القرار العملي</h3>
                  <p className="text-[10px] text-gray-300 leading-relaxed bg-gray-950 p-3 rounded-xl border border-gray-800">
                    الاتجاه المتوقع للشمعة المكتملة التالية هو صاعد. أغلقت آخر شمعة متاحة لمدة أربع ساعات عند نحو {selectedAiTicker.price} بعد اندفاع قوي، مع بقاء MACD موجباً واختراق مستويات المقاومة القريبة.
                  </p>
                  
                  {/* توقع Horizon */}
                  <div className="bg-amber-500/10 border border-amber-500/30 p-3 rounded-xl space-y-1">
                    <span className="text-[10px] text-amber-400 font-bold block">📊 توقع HORIZON</span>
                    <span className="text-xs font-bold text-white">جانبي - يتوقع أن ينتهي السعر بين ${selectedAiTicker.entryLowFormatted} و ${selectedAiTicker.entryHighFormatted} في أربع حالات من خمس.</span>
                  </div>
                </div>

                {/* 4. بطاقة بوابـة الأمان وفحص العقود (مستوحاة من صور أمان العقود) */}
                <div className="bg-gray-900 border border-rose-500/40 rounded-2xl p-4 space-y-2.5">
                  <h3 className="font-black text-rose-400 text-xs flex items-center gap-1.5">
                    🛡️ بوابة الأمان وفحص العقود الآلية
                  </h3>
                  
                  <div className="space-y-2 text-xs">
                    <div className="bg-gray-950 p-2.5 rounded-xl border border-emerald-500/30 flex justify-between items-center">
                      <span className="text-gray-300">مصیبة (Honeypot):</span>
                      <span className="text-emerald-400 font-bold">غير مصنف كمصيدة ✅</span>
                    </div>
                    <div className="bg-gray-950 p-2.5 rounded-xl border border-emerald-500/30 flex justify-between items-center">
                      <span className="text-gray-300">ضريبة التداول:</span>
                      <span className="text-emerald-400 font-bold">لا توجد ضريبة شراء/بيع ملحوظة ✅</span>
                    </div>
                    <div className="bg-gray-950 p-2.5 rounded-xl border border-emerald-500/30 flex justify-between items-center">
                      <span className="text-gray-300">السيولة (DEX):</span>
                      <span className="text-emerald-400 font-bold">سيولة قوية ~ $25,958,533 ✅</span>
                    </div>
                    <div className="bg-gray-950 p-2.5 rounded-xl border border-amber-500/30 flex justify-between items-center">
                      <span className="text-gray-300">حصة المنشئ:</span>
                      <span className="text-amber-300 font-bold">يمتلك المنشئ ~ 50.0% ⚠️</span>
                    </div>
                    <div className="bg-gray-950 p-2.5 rounded-xl border border-rose-500/30 flex justify-between items-center">
                      <span className="text-rose-400 font-bold">القرار النهائي وفق بوابة الأمان:</span>
                      <span className="text-rose-300 font-black">تجنّب صفقة شراء 🛑</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* --- باقي التبويبات والأدوات السابقة بكامل تفاصيلها تماماً --- */}
            
            {activeTab === 'ai_predict' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-indigo-500/40 rounded-2xl p-4 space-y-3">
                  <h2 className="text-sm font-black text-white">العقل الاصطناعي التنبؤي الشامل V5.0</h2>
                  <p className="text-[10px] text-gray-300">تحليل كفي متزامن عبر 9 مدارس تحليلية عالمية.</p>
                </div>
              </div>
            )}

            {activeTab === 'radar' && (
              <div className="space-y-3">
                <input 
                  type="text"
                  placeholder="ابحث عن أي عملة (BTC, ETH, WLD...)"
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="w-full bg-gray-900 border border-gray-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                />
                {loading ? <div className="text-center py-12 text-gray-400 text-xs">جاري تحليل بيانات السيولة...</div> : (
                  filteredPairs.map((item, idx) => (
                    <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className="bg-gray-900 border border-gray-800 rounded-xl p-3.5 space-y-2.5 cursor-pointer">
                      <div className="flex justify-between items-center"><span className="font-extrabold text-sm text-white">{item.label}</span><span className={`text-[10px] px-2 py-0.5 rounded-full border ${item.signalColor}`}>{item.signalTag}</span></div>
                      <div className="flex justify-between items-center text-xs">
                        <div><span className="text-gray-400 text-[11px] block">السعر والتغير</span><span className="font-mono font-bold text-white">${item.price}</span><span className={`text-[11px] font-bold mr-1.5 ${item.changeNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{item.change}%</span></div>
                        <div className="text-left"><span className="text-gray-400 text-[11px] block">صافي السيولة</span><span className={`font-mono font-bold ${item.netInflowNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{item.netInflow}</span></div>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {activeTab === 'signals' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-amber-500/40 rounded-2xl p-3.5 flex justify-between items-center">
                  <h2 className="font-black text-amber-400 text-xs">🎯 مرصد الصفقات الذكية VIP</h2>
                </div>
                {smartMoneyVipSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className="bg-gray-900 border border-amber-500/40 rounded-2xl p-3.5 space-y-3 cursor-pointer">
                    <div className="flex justify-between items-center">
                      <span className="font-extrabold text-sm text-white">{item.label}</span>
                      <span className="text-xs font-mono font-bold text-emerald-400">${item.entryFormatted}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'breakouts' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-emerald-500/40 rounded-2xl p-3.5"><h2 className="font-black text-emerald-400 text-xs">🚀 الانفجارات السعرية</h2></div>
                {breakoutSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className="bg-gray-900 border border-emerald-500/50 rounded-2xl p-3.5 flex justify-between items-center cursor-pointer">
                    <span className="font-extrabold text-sm text-white">{item.label}</span>
                    <span className="font-mono font-bold text-xs text-emerald-400">+{item.change}%</span>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'elliott' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-cyan-500/40 rounded-2xl p-3.5"><h2 className="font-black text-cyan-400 text-xs">🌊 موجات إليوت</h2></div>
                {elliottSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className="bg-gray-900 border border-cyan-500/40 rounded-2xl p-3.5 flex justify-between items-center cursor-pointer">
                    <span className="font-extrabold text-sm text-white">{item.label}</span>
                    <span className="text-cyan-400 text-xs">موجة دافعة</span>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'smc' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-emerald-500/40 rounded-2xl p-3.5"><h2 className="font-black text-emerald-400 text-xs">📊 مناطق SMC / ICT</h2></div>
                {smcSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className="bg-gray-900 border border-emerald-500/40 rounded-2xl p-3.5 flex justify-between items-center cursor-pointer">
                    <span className="font-extrabold text-sm text-white">{item.label}</span>
                    <span className="text-emerald-400 text-xs">منطقة طلب مؤسسي (OB)</span>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'liquidation' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-rose-500/40 rounded-2xl p-3.5"><h2 className="font-black text-rose-400 text-xs">⚡ التصفيات والسقويز</h2></div>
                {liquidationSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className="bg-gray-900 border border-rose-500/40 rounded-2xl p-3.5 flex justify-between items-center cursor-pointer">
                    <span className="font-extrabold text-sm text-white">{item.label}</span>
                    <span className="text-rose-400 text-xs">تصفية شورت ضخمة</span>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'journal' && (
              <div className="space-y-4">
                <div className="bg-gray-900 border border-emerald-500/40 rounded-2xl p-4 space-y-3">
                  <h2 className="font-bold text-emerald-400 text-xs">📖 دفتر الصفقات</h2>
                </div>
              </div>
            )}

            {activeTab === 'chart' && (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-2 space-y-2 h-[520px]">
                <div className="text-xs font-bold text-emerald-400 px-2">الشارت المباشر: BINANCE:{selectedSymbol}</div>
                <div id="tradingview_chart" className="h-[470px] w-full"></div>
              </div>
            )}

            {activeTab === 'risk' && (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-4 text-xs">
                <h2 className="font-bold text-emerald-400 text-sm">حاسبة إدارة المخاطر</h2>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NebrasApp />);
  </script>
</body>
</html>
