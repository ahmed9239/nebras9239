<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نِبْرَاس لِلتَّدَاوُل الذَّكِي</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function NebrasApp() {
      const [activeTab, setActiveTab] = useState('radar');
      const [pairs, setPairs] = useState([
        { symbol: 'BTC/USDT', price: '67,420.50', change: '+2.4%', volume: '1.2B', type: 'شراء قوي (Liquidation Breakout)' },
        { symbol: 'ETH/USDT', price: '3,520.10', change: '+1.8%', volume: '650M', type: 'تجميع صانع سوق (Order Block)' },
        { symbol: 'SOL/USDT', price: '185.30', change: '-0.9%', volume: '410M', type: 'منطقة سيولة ممتدة (Liquidity Sweep)' },
        { symbol: 'BNB/USDT', price: '595.00', change: '+0.5%', volume: '190M', type: 'اختبار مؤشر EMA 200' },
      ]);

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col pb-6">
          {/* Header */}
          <header className="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 flex items-center justify-between">
            <div>
              <h1 className="text-lg font-extrabold text-emerald-400 tracking-wide">نِبْرَاس لِلتَّدَاوُل الذَّكِي</h1>
              <p className="text-[10px] text-gray-400">رادار السيولة والتحليل الفني الفوري</p>
            </div>
            <span className="flex items-center gap-1.5 bg-emerald-500/10 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/20 font-medium">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              مباشر
            </span>
          </header>

          {/* Navigation Tabs */}
          <nav className="flex bg-gray-900/60 p-1.5 m-3 rounded-xl border border-gray-800 gap-1">
            <button 
              onClick={() => setActiveTab('radar')}
              className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${activeTab === 'radar' ? 'bg-emerald-500 text-gray-950 shadow-md shadow-emerald-500/20' : 'text-gray-400 hover:text-white'}`}
            >
              رادار السيولة
            </button>
            <button 
              onClick={() => setActiveTab('signals')}
              className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${activeTab === 'signals' ? 'bg-emerald-500 text-gray-950 shadow-md shadow-emerald-500/20' : 'text-gray-400 hover:text-white'}`}
            >
              صفقات VIP
            </button>
            <button 
              onClick={() => setActiveTab('admin')}
              className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${activeTab === 'admin' ? 'bg-emerald-500 text-gray-950 shadow-md shadow-emerald-500/20' : 'text-gray-400 hover:text-white'}`}
            >
              التحكم
            </button>
          </nav>

          {/* Main Content Areas */}
          <main className="flex-1 px-3 space-y-3">
            {activeTab === 'radar' && (
              <div className="space-y-3">
                <div className="bg-gray-900/80 border border-gray-800 rounded-xl p-3 flex justify-between items-center">
                  <span className="text-xs font-semibold text-gray-300">الفريم الزمني المعتمد:</span>
                  <span className="text-xs bg-gray-800 text-emerald-400 font-bold px-2.5 py-0.5 rounded border border-gray-700">15 دقيقة (15m)</span>
                </div>

                {pairs.map((item, idx) => (
                  <div key={idx} className="bg-gray-900 border border-gray-800/80 hover:border-emerald-500/40 rounded-xl p-3.5 space-y-2 transition-all">
                    <div className="flex justify-between items-center">
                      <span className="font-extrabold text-sm text-white tracking-wider">{item.symbol}</span>
                      <span className={`text-xs font-bold px-2 py-0.5 rounded ${item.change.startsWith('+') ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>
                        {item.change}
                      </span>
                    </div>
                    <div className="flex justify-between text-xs text-gray-400">
                      <span>السعر: <strong className="text-gray-200">{item.price}</strong></span>
                      <span>حجم 24h: <strong className="text-gray-200">{item.volume}</strong></span>
                    </div>
                    <div className="pt-1 border-t border-gray-800/50 flex justify-between items-center text-[11px]">
                      <span className="text-gray-400">النمط:</span>
                      <span className="text-emerald-400 font-medium">{item.type}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'signals' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-emerald-500/30 rounded-xl p-4 space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="bg-emerald-500 text-gray-950 font-black text-[10px] px-2 py-0.5 rounded">توصية شراء (Long)</span>
                    <span className="text-[10px] text-gray-400">قبل 5 دقائق</span>
                  </div>
                  <h3 className="text-sm font-bold text-white">BTC/USDT - كسر منطقة تجميع</h3>
                  <div className="grid grid-cols-2 gap-2 text-xs pt-2">
                    <div className="bg-gray-950 p-2 rounded border border-gray-800">
                      <span className="text-gray-500 block text-[10px]">الدخول</span>
                      <span className="text-gray-200 font-bold">67,200</span>
                    </div>
                    <div className="bg-gray-950 p-2 rounded border border-gray-800">
                      <span className="text-gray-500 block text-[10px]">الهدف الأول</span>
                      <span className="text-emerald-400 font-bold">68,500</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'admin' && (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-4">
                <h2 className="text-sm font-bold text-emerald-400">لوحة إدارة المشتركين والنظام</h2>
                <div className="space-y-2 text-xs">
                  <div className="flex justify-between p-2.5 bg-gray-950 rounded border border-gray-800">
                    <span className="text-gray-400">المشتركون النشطون:</span>
                    <span className="font-bold text-emerald-400">42 مشترك</span>
                  </div>
                  <div className="flex justify-between p-2.5 bg-gray-950 rounded border border-gray-800">
                    <span className="text-gray-400">مفتاح API الخاص بـ Binance:</span>
                    <span className="font-bold text-gray-300">متصل (Live Feed)</span>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NebrasApp />);
  </script>
</body>
</html>
