<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نِبْرَاس - رادار صافي تدفق السيولة المؤسسية والانفجارات</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.98); }
    }
    .animate-pulse-fast { animation: pulse-fast 1.2s infinite; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen selection:bg-emerald-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function NebrasApp() {
      const [activeTab, setActiveTab] = useState('breakouts');
      const [timeframe, setTimeframe] = useState('15m');
      const [category, setCategory] = useState('all');
      const [loading, setLoading] = useState(true);
      const [allTickers, setAllTickers] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedSymbol, setSelectedSymbol] = useState('BTCUSDT');
      
      const [userTelegram, setUserTelegram] = useState(localStorage.getItem('nebras_telegram') || '@ahmed17200');
      const [notificationsEnabled, setNotificationsEnabled] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);

      const [capital, setCapital] = useState(1000);
      const [riskPercent, setRiskPercent] = useState(2);
      const [entryPrice, setEntryPrice] = useState(67000);
      const [stopLoss, setStopLoss] = useState(66000);

      const aiSymbols = ['TAO', 'FET', 'NEAR', 'RNDR', 'WLD', 'AGIX', 'AKT'];
      const majorSymbols = ['BTC', 'ETH', 'SOL', 'BNB', 'XRP', 'ADA', 'AVAX'];

      const saveTelegramSettings = (e) => {
        e.preventDefault();
        localStorage.setItem('nebras_telegram', userTelegram);
        setShowSettingsModal(false);
        alert(`تم حفظ معرف التليجرام (${userTelegram}) بنجاح!`);
      };

      const requestNotificationPermission = () => {
        if ("Notification" in window) {
          Notification.requestPermission().then(permission => {
            if (permission === "granted") {
              setNotificationsEnabled(true);
              new Notification("نِبْرَاس لِلتَّدَاوُل الذَّكِي", {
                body: `تم تفعيل إشعارات الجوال بنجاح للمستخدم (${userTelegram})`,
                icon: "https://cryptologos.cc/logos/binance-coin-bnb-logo.png"
              });
            } else {
              alert("تم رفض إذن الإشعارات من المتصفح.");
            }
          });
        } else {
          alert("متصفحك لا يدعم الإشعارات الفورية.");
        }
      };

      const fetchAllBinanceData = async () => {
        try {
          const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
          const data = await res.json();
          
          const usdtPairs = data
            .filter(t => t.symbol.endsWith('USDT'))
            .map(t => {
              const base = t.symbol.replace('USDT', '');
              const priceNum = parseFloat(t.lastPrice);
              const decimals = priceNum < 1 ? 4 : 2;
              const changeNum = parseFloat(t.priceChangePercent);
              const volNum = parseFloat(t.quoteVolume);

              const buyPercent = Math.min(Math.max(50 + (changeNum * 2.5), 20), 85).toFixed(1);
              const sellPercent = (100 - parseFloat(buyPercent)).toFixed(1);
              const netInflowNum = (volNum * (changeNum / 100) * 0.15) / 1000000;
              
              const isShort = netInflowNum < -0.15;
              const isBreakout = Math.abs(changeNum) >= 4.0 || volNum > 50000000;
              
              let entry = priceNum * (isShort ? 1.005 : 0.995);
              let sl = isShort ? entry * 1.015 : entry * 0.985;
              const tp1 = isShort ? entry * 0.98 : entry * 1.02;
              const tp2 = isShort ? entry * 0.955 : entry * 1.045;

              let tradeStatus = 'active';
              let statusLabel = isShort ? 'شورت مستمرة 🔄' : 'لونج مستمرة 🔄';
              let statusColor = isShort ? 'bg-rose-500/10 text-rose-400 border-rose-500/30' : 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30';

              if (isShort) {
                if (priceNum <= tp2) {
                  tradeStatus = 'success';
                  statusLabel = 'تحقق هدف الشورت TP2 🚀';
                  statusColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50';
                } else if (priceNum <= tp1) {
                  statusLabel = 'تحقق هدف الشورت TP1 ✅';
                  statusColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                } else if (changeNum >= 3.0) {
                  tradeStatus = 'failed';
                  statusLabel = 'فشلت (ضربت SL للشورت) ❌';
                  statusColor = 'bg-rose-500/10 text-rose-400 border-rose-500/30';
                }
              } else {
                if (priceNum >= tp2) {
                  tradeStatus = 'success';
                  statusLabel = 'تحقق هدف اللونج TP2 🚀';
                  statusColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50';
                } else if (priceNum >= tp1) {
                  statusLabel = 'تحقق هدف اللونج TP1 ✅';
                  statusColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                } else if (changeNum <= -2.0) {
                  tradeStatus = 'failed';
                  statusLabel = 'فشلت (ضربت SL للونج) ❌';
                  statusColor = 'bg-rose-500/10 text-rose-400 border-rose-500/30';
                }
              }

              let catTag = 'عملة نشطة';
              if (majorSymbols.includes(base)) catTag = 'قيادية 👑';
              else if (aiSymbols.includes(base)) catTag = 'ذكاء اصطناعي 🤖';

              let signalTag = 'سيولة متوازنة';
              let signalColor = 'text-gray-400 bg-gray-800/40 border-gray-700/50';

              if (netInflowNum > 1) {
                signalTag = 'دخول سيولة حاد 🔥';
                signalColor = 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30';
              } else if (netInflowNum < -1) {
                signalTag = 'خروج سيولة حاد ⚠️';
                signalColor = 'text-rose-400 bg-rose-500/10 border-rose-500/30';
              }

              return {
                symbol: t.symbol,
                base: base,
                label: `${base}/USDT`,
                rawPrice: priceNum,
                price: priceNum.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }),
                entryFormatted: entry.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }),
                slFormatted: sl.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }),
                tp1Formatted: tp1.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }),
                tp2Formatted: tp2.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }),
                changeNum: changeNum,
                change: changeNum.toFixed(2),
                volumeNum: volNum,
                volume: (volNum / 1000000).toFixed(2) + 'M',
                buyPercent: buyPercent,
                sellPercent: sellPercent,
                netInflowNum: netInflowNum,
                netInflow: (netInflowNum >= 0 ? `+${netInflowNum.toFixed(2)}M$` : `${netInflowNum.toFixed(2)}M$`),
                catTag: catTag,
                isShort: isShort,
                isBreakout: isBreakout,
                tradeStatus: tradeStatus,
                statusLabel: statusLabel,
                statusColor: statusColor,
                signalTag: signalTag,
                signalColor: signalColor
              };
            });

          setAllTickers(usdtPairs);
          setLoading(false);
        } catch (err) {
          console.error('Binance Fetch Error:', err);
        }
      };

      useEffect(() => {
        fetchAllBinanceData();
        const interval = setInterval(fetchAllBinanceData, 3000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (activeTab === 'chart' && window.TradingView) {
          new window.TradingView.widget({
            "autosize": true,
            "symbol": `BINANCE:${selectedSymbol}`,
            "interval": timeframe === '5m' ? '5' : timeframe === '1h' ? '60' : '15',
            "timezone": "Asia/Riyadh",
            "theme": "dark",
            "style": "1",
            "locale": "ar",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "container_id": "tradingview_chart"
          });
        }
      }, [activeTab, selectedSymbol, timeframe]);

      const filteredPairs = useMemo(() => {
        let result = [...allTickers];

        if (category === 'inflow') {
          result = result.filter(item => item.netInflowNum > 0).sort((a, b) => b.netInflowNum - a.netInflowNum);
        } else if (category === 'outflow') {
          result = result.filter(item => item.netInflowNum < 0).sort((a, b) => a.netInflowNum - b.netInflowNum);
        } else if (category === 'majors') {
          result = result.filter(item => majorSymbols.includes(item.base));
        } else if (category === 'ai') {
          result = result.filter(item => aiSymbols.includes(item.base));
        } else {
          result.sort((a, b) => b.volumeNum - a.volumeNum);
        }

        if (searchTerm) {
          result = result.filter(item => item.label.toLowerCase().includes(searchTerm.toLowerCase()));
        }

        return result.slice(0, 60);
      }, [allTickers, searchTerm, category]);

      const breakoutSignals = useMemo(() => {
        return allTickers
          .filter(item => item.isBreakout)
          .sort((a, b) => Math.abs(b.changeNum) - Math.abs(a.changeNum))
          .slice(0, 15);
      }, [allTickers]);

      const vipSignals = useMemo(() => {
        return allTickers
          .filter(item => Math.abs(item.netInflowNum) > 0.15 || Math.abs(item.changeNum) > 2.0)
          .sort((a, b) => Math.abs(b.netInflowNum) - Math.abs(a.netInflowNum))
          .slice(0, 20);
      }, [allTickers]);

      const activeLongSignals = useMemo(() => vipSignals.filter(item => !item.isShort && item.tradeStatus === 'active'), [vipSignals]);
      const activeShortSignals = useMemo(() => vipSignals.filter(item => item.isShort && item.tradeStatus === 'active'), [vipSignals]);
      const archivedVipSignals = useMemo(() => vipSignals.filter(item => item.tradeStatus !== 'active'), [vipSignals]);
      const readyToEntry = useMemo(() => breakoutSignals[0] || activeLongSignals[0], [breakoutSignals, activeLongSignals]);

      const topInflow = useMemo(() => [...allTickers].sort((a, b) => b.netInflowNum - a.netInflowNum)[0], [allTickers]);
      const topOutflow = useMemo(() => [...allTickers].sort((a, b) => b.netInflowNum - a.netInflowNum)[0], [allTickers]);

      const riskAmount = (capital * (riskPercent / 100)).toFixed(2);
      const priceDiff = Math.abs(entryPrice - stopLoss);
      const posSize = priceDiff > 0 ? (riskAmount / (priceDiff / entryPrice)).toFixed(2) : 0;

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col pb-6 relative">
          {/* Header */}
          <header className="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 flex items-center justify-between shadow-xl">
            <div>
              <h1 className="text-lg font-black text-emerald-400 tracking-wide flex items-center gap-1.5">
                نِبْرَاس لِلتَّدَاوُل الذَّكِي
                <span className="text-[10px] bg-emerald-500/20 text-emerald-300 font-normal px-1.5 py-0.5 rounded border border-emerald-500/30">V12.0</span>
              </h1>
              <p className="text-[10px] text-gray-400 mt-0.5">المستخدم: <span className="text-emerald-300 font-bold">{userTelegram}</span></p>
            </div>
            <div className="flex items-center gap-1.5">
              <button 
                onClick={() => setShowSettingsModal(true)}
                className="text-[10px] bg-gray-800 border border-gray-700 text-emerald-400 px-2.5 py-1.5 rounded-lg font-bold hover:bg-gray-700 transition"
              >
                ⚙️ إعدادات التنبيه
              </button>
            </div>
          </header>

          {/* Settings Modal */}
          {showSettingsModal && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-emerald-500/50 rounded-2xl p-5 w-full max-w-sm space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-emerald-400 text-sm">إعدادات تنبيهات المستخدم</h3>
                  <button onClick={() => setShowSettingsModal(false)} className="text-gray-400 hover:text-white font-bold">✕</button>
                </div>
                <p className="text-[11px] text-gray-300">
                  ربط معرف تيليجرام أو تفعيل إشعار الجوال الفوري للانفجارات وصفقات VIP:
                </p>
                <form onSubmit={saveTelegramSettings} className="space-y-3">
                  <div>
                    <label className="text-xs text-gray-400 block mb-1">معرف تيليجرام (Telegram Username):</label>
                    <input 
                      type="text" 
                      value={userTelegram} 
                      onChange={(e) => setUserTelegram(e.target.value)} 
                      placeholder="@username"
                      className="w-full bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-xs text-white focus:border-emerald-500 focus:outline-none"
                      required
                    />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button 
                      type="button" 
                      onClick={requestNotificationPermission} 
                      className={`flex-1 border text-xs py-2 rounded-xl font-bold transition ${notificationsEnabled ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-gray-800 border-gray-700 text-gray-200'}`}
                    >
                      {notificationsEnabled ? '🔔 الجوال مفعل' : '🔕 تفعيل إشعار الجوال'}
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 bg-emerald-500 text-gray-950 text-xs py-2 rounded-xl font-bold shadow-lg shadow-emerald-500/20"
                    >
                      حفظ الإعدادات
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Stats Bar */}
          <div className="grid grid-cols-2 gap-2 p-3 bg-gray-900/50 border-b border-gray-800/80">
            <div className="bg-gray-900 border border-emerald-500/20 rounded-xl p-2.5 flex items-center justify-between">
              <div>
                <span className="text-[10px] text-gray-400 block">زعيم ضخ السيولة (Top Inflow)</span>
                <strong className="text-xs text-emerald-400 font-extrabold">{topInflow ? topInflow.label : '---'}</strong>
              </div>
              <span className="text-xs font-mono font-bold text-emerald-400">{topInflow ? topInflow.netInflow : '0$'}</span>
            </div>
            <div className="bg-gray-900 border border-rose-500/20 rounded-xl p-2.5 flex items-center justify-between">
              <div>
                <span className="text-[10px] text-gray-400 block">زعيم خروج السيولة (Top Outflow)</span>
                <strong className="text-xs text-rose-400 font-extrabold">{topOutflow ? topOutflow.label : '---'}</strong>
              </div>
              <span className="text-xs font-mono font-bold text-rose-400">{topOutflow ? topOutflow.netInflow : '0$'}</span>
            </div>
          </div>

          {/* Navigation Tabs */}
          <nav className="grid grid-cols-6 bg-gray-900/80 p-1 m-3 rounded-xl border border-gray-800 gap-1 text-[10px] text-center">
            <button onClick={() => setActiveTab('breakouts')} className={`py-2 font-bold rounded-lg transition-all ${activeTab === 'breakouts' ? 'bg-emerald-500 text-gray-950 shadow-lg shadow-emerald-500/20' : 'text-gray-400'}`}>الانفجارات 🚀</button>
            <button onClick={() => setActiveTab('radar')} className={`py-2 font-bold rounded-lg transition-all ${activeTab === 'radar' ? 'bg-emerald-500 text-gray-950 shadow-lg shadow-emerald-500/20' : 'text-gray-400'}`}>الرادار</button>
            <button onClick={() => setActiveTab('heatmap')} className={`py-2 font-bold rounded-lg transition-all ${activeTab === 'heatmap' ? 'bg-emerald-500 text-gray-950 shadow-lg shadow-emerald-500/20' : 'text-gray-400'}`}>الحرارية</button>
            <button onClick={() => setActiveTab('signals')} className={`py-2 font-bold rounded-lg transition-all ${activeTab === 'signals' ? 'bg-emerald-500 text-gray-950 shadow-lg shadow-emerald-500/20' : 'text-gray-400'}`}>VIP 🎯</button>
            <button onClick={() => setActiveTab('chart')} className={`py-2 font-bold rounded-lg transition-all ${activeTab === 'chart' ? 'bg-emerald-500 text-gray-950 shadow-lg shadow-emerald-500/20' : 'text-gray-400'}`}>الشارت</button>
            <button onClick={() => setActiveTab('risk')} className={`py-2 font-bold rounded-lg transition-all ${activeTab === 'risk' ? 'bg-emerald-500 text-gray-950 shadow-lg shadow-emerald-500/20' : 'text-gray-400'}`}>المخاطر</button>
          </nav>

          {/* Content Area */}
          <main className="flex-1 px-3 space-y-3">
            {activeTab === 'breakouts' && (
              <div className="space-y-3">
                <div className="bg-gradient-to-r from-emerald-950/70 to-gray-900 border border-emerald-500/50 rounded-2xl p-3.5 space-y-2">
                  <h2 className="font-black text-emerald-400 text-xs flex items-center gap-1.5">
                    <span>🚀 رادار الانفجارات السعرية اللحظية (Breakout & Momentum)</span>
                  </h2>
                  <p className="text-[10px] text-gray-300">
                    ترصد هذه الأداة العملات التي تخترق مستويات التجميع بفوليوم انفجاري لحظي (صعوداً وهبوطاً).
                  </p>
                </div>

                {loading ? (
                  <div className="text-center py-12 text-gray-400 text-xs">جاري رصد الانفجارات السعرية وحجم التداول الحاد...</div>
                ) : breakoutSignals.length === 0 ? (
                  <div className="text-center py-8 text-gray-500 text-xs bg-gray-900/50 rounded-xl border border-gray-800">لا توجد انفجارات سعرية قوية حالياً، بانتظار شمعة العزم...</div>
                ) : (
                  breakoutSignals.map((item, idx) => (
                    <div 
                      key={idx}
                      onClick={() => { 
                        setSelectedSymbol(item.symbol); 
                        setEntryPrice(item.rawPrice); 
                        setActiveTab('chart'); 
                      }}
                      className={`border rounded-2xl p-3.5 space-y-3 cursor-pointer transition-all hover:scale-[1.01] ${item.isShort ? 'bg-gray-900 border-rose-500/50 hover:border-rose-400' : 'bg-gray-900 border-emerald-500/50 hover:border-emerald-400'}`}
                    >
                      <div className="flex justify-between items-center">
                        <div className="flex items-center gap-2">
                          <span className={`font-black text-[10px] px-2 py-0.5 rounded text-gray-950 ${item.isShort ? 'bg-rose-500' : 'bg-emerald-500'}`}>
                            {item.isShort ? 'انفجار هابط 📉' : 'انفجار صاعد 🚀'}
                          </span>
                          <span className="font-extrabold text-sm text-white">{item.label}</span>
                        </div>
                        <span className={`font-mono font-bold text-xs ${item.changeNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                          {item.changeNum >= 0 ? `+${item.change}%` : `${item.change}%`}
                        </span>
                      </div>

                      <div className="grid grid-cols-3 gap-2 text-center text-[10px]">
                        <div className="bg-gray-950 p-2 rounded-lg border border-gray-800">
                          <span className="text-gray-400 block text-[8px] mb-0.5">السعر الحالي</span>
                          <span className="text-white font-mono font-bold">${item.price}</span>
                        </div>
                        <div className="bg-gray-950 p-2 rounded-lg border border-gray-800">
                          <span className="text-gray-400 block text-[8px] mb-0.5">حجم التداول</span>
                          <span className="text-cyan-300 font-mono font-bold">${item.volume}</span>
                        </div>
                        <div className="bg-gray-950 p-2 rounded-lg border border-gray-800">
                          <span className="text-gray-400 block text-[8px] mb-0.5">صافي السيولة</span>
                          <span className={`font-mono font-bold ${item.netInflowNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{item.netInflow}</span>
                        </div>
                      </div>

                      <div className="flex justify-between items-center text-[10px] text-gray-400 pt-1 border-t border-gray-800">
                        <span>حالة السيولة: <strong className={item.isShort ? 'text-rose-400' : 'text-emerald-400'}>{item.signalTag}</strong></span>
                        <span className="text-emerald-400 underline font-medium">عرض الشارت 📊</span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {activeTab === 'radar' && (
              <div className="space-y-3">
                <div className="flex gap-2 items-center">
                  <input 
                    type="text"
                    placeholder="ابحث عن أي عملة (BTC, ETH, PEPE...)"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="flex-1 bg-gray-900 border border-gray-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                  />
                  <div className="flex bg-gray-900 p-1 border border-gray-800 rounded-xl text-[10px]">
                    <button onClick={() => setTimeframe('5m')} className={`px-2 py-1 rounded ${timeframe === '5m' ? 'bg-emerald-500 text-black font-bold' : 'text-gray-400'}`}>5m</button>
                    <button onClick={() => setTimeframe('15m')} className={`px-2 py-1 rounded ${timeframe === '15m' ? 'bg-emerald-500 text-black font-bold' : 'text-gray-400'}`}>15m</button>
                    <button onClick={() => setTimeframe('1h')} className={`px-2 py-1 rounded ${timeframe === '1h' ? 'bg-emerald-500 text-black font-bold' : 'text-gray-400'}`}>1h</button>
                  </div>
                </div>

                <div className="flex gap-1.5 overflow-x-auto pb-1 text-[11px] no-scrollbar">
                  <button onClick={() => setCategory('all')} className={`px-3 py-1.5 rounded-lg border whitespace-nowrap ${category === 'all' ? 'bg-gray-800 border-emerald-500/50 text-emerald-400 font-bold' : 'bg-gray-900/60 border-gray-800 text-gray-400'}`}>كل العملات</button>
                  <button onClick={() => setCategory('inflow')} className={`px-3 py-1.5 rounded-lg border whitespace-nowrap ${category === 'inflow' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-400 font-bold' : 'bg-gray-900/60 border-gray-800 text-gray-400'}`}>دخول سيولة 🔥</button>
                  <button onClick={() => setCategory('outflow')} className={`px-3 py-1.5 rounded-lg border whitespace-nowrap ${category === 'outflow' ? 'bg-rose-500/20 border-rose-500/50 text-rose-400 font-bold' : 'bg-gray-900/60 border-gray-800 text-gray-400'}`}>خروج سيولة ⚠️</button>
                  <button onClick={() => setCategory('majors')} className={`px-3 py-1.5 rounded-lg border whitespace-nowrap ${category === 'majors' ? 'bg-gray-800 border-cyan-500/50 text-cyan-400 font-bold' : 'bg-gray-900/60 border-gray-800 text-gray-400'}`}>العملات القيادية 👑</button>
                  <button onClick={() => setCategory('ai')} className={`px-3 py-1.5 rounded-lg border whitespace-nowrap ${category === 'ai' ? 'bg-gray-800 border-purple-500/50 text-purple-400 font-bold' : 'bg-gray-900/60 border-gray-800 text-gray-400'}`}>الذكاء الاصطناعي 🤖</button>
                </div>

                {loading ? (
                  <div className="text-center py-12 text-gray-400 text-xs">جاري تحليل بيانات السيولة والمؤشرات الحية...</div>
                ) : (
                  filteredPairs.map((item, idx) => (
                    <div 
                      key={idx} 
                      onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}
                      className="bg-gray-900 border border-gray-800/90 hover:border-emerald-500/50 rounded-xl p-3 space-y-2.5 cursor-pointer transition-all"
                    >
                      <div className="flex justify-between items-center">
                        <div className="flex items-center gap-2">
                          <span className="font-extrabold text-sm text-white">{item.label}</span>
                          <span className="text-[10px] bg-gray-800 text-gray-300 px-2 py-0.5 rounded border border-gray-700">{item.catTag}</span>
                        </div>
                        <span className={`text-[10px] px-2 py-0.5 rounded-full border font-semibold ${item.signalColor}`}>{item.signalTag}</span>
                      </div>

                      <div className="flex justify-between items-center text-xs">
                        <div>
                          <span className="text-gray-400 text-[11px] block">السعر والتغير</span>
                          <span className="font-mono font-bold text-white">${item.price}</span>
                          <span className={`text-[11px] font-bold mr-1.5 ${item.changeNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{item.changeNum >= 0 ? `+${item.change}%` : `${item.change}%`}</span>
                        </div>
                        <div className="text-left">
                          <span className="text-gray-400 text-[11px] block">صافي تدفق السيولة</span>
                          <span className={`font-mono font-bold ${item.netInflowNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{item.netInflow}</span>
                        </div>
                      </div>

                      <div className="space-y-1 pt-1 border-t border-gray-800/60">
                        <div className="flex justify-between text-[10px]">
                          <span className="text-emerald-400 font-bold">شراء {item.buyPercent}%</span>
                          <span className="text-rose-400 font-bold">بيع {item.sellPercent}%</span>
                        </div>
                        <div className="h-1.5 w-full bg-rose-500/30 rounded-full overflow-hidden flex">
                          <div style={{ width: `${item.buyPercent}%` }} className="bg-emerald-500 h-full"></div>
                        </div>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {activeTab === 'heatmap' && (
              <div className="grid grid-cols-3 gap-2">
                {allTickers.slice(0, 30).map((item, idx) => {
                  const isGreen = item.changeNum >= 0;
                  return (
                    <div 
                      key={idx}
                      onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}
                      className={`p-3 rounded-xl border flex flex-col justify-between items-center text-center cursor-pointer ${isGreen ? 'bg-emerald-950/40 border-emerald-500/30' : 'bg-rose-950/40 border-rose-500/30'}`}
                    >
                      <span className="font-extrabold text-xs text-white">{item.base}</span>
                      <span className={`font-mono font-bold text-xs my-1 ${isGreen ? 'text-emerald-400' : 'text-rose-400'}`}>{isGreen ? `+${item.change}%` : `${item.change}%`}</span>
                    </div>
                  );
                })}
              </div>
            )}

            {activeTab === 'signals' && (
              <div className="space-y-4">
                {readyToEntry && (
                  <div 
                    onClick={() => { 
                      setSelectedSymbol(readyToEntry.symbol); 
                      setEntryPrice(readyToEntry.rawPrice);
                      setActiveTab('chart'); 
                    }}
                    className="bg-emerald-950/80 border-2 border-emerald-500 rounded-2xl p-3.5 space-y-2 cursor-pointer animate-pulse-fast shadow-lg shadow-emerald-500/20"
                  >
                    <div className="flex justify-between items-center">
                      <span className="bg-emerald-500 text-gray-950 font-black text-[10px] px-2.5 py-1 rounded-full">🚨 صفقة VIP جاهزة الآن!</span>
                      <span className="text-xs font-mono font-bold text-emerald-400">{readyToEntry.netInflow}</span>
                    </div>
                    <div className="flex justify-between items-center text-xs">
                      <span className="font-extrabold text-white text-sm">عملة {readyToEntry.label}</span>
                      <span className="text-emerald-300 font-bold">دخول فوري بسعر: ${readyToEntry.price}</span>
                    </div>
                    <p className="text-[10px] text-gray-300">موجه إلى ({userTelegram}) - الأهداف المزدوجة وتتبع الـ SL مفعلة.</p>
                  </div>
                )}

                <div className="space-y-2.5">
                  <div className="bg-gray-900 border border-emerald-500/40 rounded-xl p-3 text-xs flex justify-between items-center">
                    <span className="font-bold text-emerald-400">📈 صفقات VIP لونج (Long)</span>
                    <span className="text-[10px] bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded">مباشر 🔄</span>
                  </div>

                  {loading ? (
                    <div className="text-center py-6 text-gray-400 text-xs">جاري تحليل الصفقات...</div>
                  ) : activeLongSignals.length === 0 ? (
                    <div className="text-center py-4 text-gray-500 text-xs bg-gray-900/50 rounded-xl border border-gray-800">لا توجد صفقات لونج نشطة حالياً...</div>
                  ) : (
                    activeLongSignals.map((item, idx) => (
                      <div 
                        key={idx} 
                        onClick={() => { setSelectedSymbol(item.symbol); setEntryPrice(item.rawPrice); setActiveTab('chart'); }}
                        className="bg-gray-900 border border-emerald-500/40 rounded-xl p-3.5 space-y-3 cursor-pointer hover:border-emerald-400 transition-all"
                      >
                        <div className="flex justify-between items-center">
                          <div className="flex items-center gap-2">
                            <span className="bg-emerald-500 text-gray-950 font-black text-[10px] px-2 py-0.5 rounded">LONG 🟢</span>
                            <span className="font-extrabold text-sm text-white">{item.label}</span>
                          </div>
                          <span className={`text-[10px] px-2.5 py-0.5 rounded-full border font-bold ${item.statusColor}`}>{item.statusLabel}</span>
                        </div>

                        <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]">
                          <div className="bg-gray-950 p-1.5 rounded-lg border border-gray-800">
                            <span className="text-gray-400 block text-[8px] mb-0.5">الدخول</span>
                            <span className="text-white font-mono font-bold">${item.entryFormatted}</span>
                          </div>
                          <div className="bg-gray-950 p-1.5 rounded-lg border border-rose-500/20">
                            <span className="text-rose-400 block text-[8px] mb-0.5">وقف (SL)</span>
                            <span className="text-rose-300 font-mono font-bold">${item.slFormatted}</span>
                          </div>
                          <div className="bg-gray-950 p-1.5 rounded-lg border border-emerald-500/20">
                            <span className="text-emerald-400 block text-[8px] mb-0.5">الهدف 1</span>
                            <span className="text-emerald-300 font-mono font-bold">${item.tp1Formatted}</span>
                          </div>
                          <div className="bg-gray-950 p-1.5 rounded-lg border border-cyan-500/20">
                            <span className="text-cyan-400 block text-[8px] mb-0.5">الهدف 2</span>
                            <span className="text-cyan-300 font-mono font-bold">${item.tp2Formatted}</span>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                <div className="space-y-2.5 pt-2">
                  <div className="bg-gray-900 border border-rose-500/40 rounded-xl p-3 text-xs flex justify-between items-center">
                    <span className="font-bold text-rose-400">📉 صفقات VIP شورت (Short)</span>
                    <span className="text-[10px] bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded">مباشر 🔄</span>
                  </div>

                  {activeShortSignals.length === 0 ? (
                    <div className="text-center py-4 text-gray-500 text-xs bg-gray-900/50 rounded-xl border border-gray-800">لا توجد صفقات شورت نشطة حالياً...</div>
                  ) : (
                    activeShortSignals.map((item, idx) => (
                      <div 
                        key={idx} 
                        onClick={() => { setSelectedSymbol(item.symbol); setEntryPrice(item.rawPrice); setActiveTab('chart'); }}
                        className="bg-gray-900 border border-rose-500/40 rounded-xl p-3.5 space-y-3 cursor-pointer hover:border-rose-400 transition-all"
                      >
                        <div className="flex justify-between items-center">
                          <div className="flex items-center gap-2">
                            <span className="bg-rose-500 text-gray-950 font-black text-[10px] px-2 py-0.5 rounded">SHORT 🔴</span>
                            <span className="font-extrabold text-sm text-white">{item.label}</span>
                          </div>
                          <span className={`text-[10px] px-2.5 py-0.5 rounded-full border font-bold ${item.statusColor}`}>{item.statusLabel}</span>
                        </div>

                        <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]">
                          <div className="bg-gray-950 p-1.5 rounded-lg border border-gray-800">
                            <span className="text-gray-400 block text-[8px] mb-0.5">الدخول</span>
                            <span className="text-white font-mono font-bold">${item.entryFormatted}</span>
                          </div>
                          <div className="bg-gray-950 p-1.5 rounded-lg border border-rose-500/20">
                            <span className="text-rose-400 block text-[8px] mb-0.5">وقف (SL)</span>
                            <span className="text-rose-300 font-mono font-bold">${item.slFormatted}</span>
                          </div>
                          <div className="bg-gray-950 p-1.5 rounded-lg border border-emerald-500/20">
                            <span className="text-emerald-400 block text-[8px] mb-0.5">الهدف 1</span>
                            <span className="text-emerald-300 font-mono font-bold">${item.tp1Formatted}</span>
                          </div>
                          <div className="bg-gray-950 p-1.5 rounded-lg border border-cyan-500/20">
                            <span className="text-cyan-400 block text-[8px] mb-0.5">الهدف 2</span>
                            <span className="text-cyan-300 font-mono font-bold">${item.tp2Formatted}</span>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {activeTab === 'chart' && (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-2 space-y-2 h-[520px]">
                <div className="text-xs font-bold text-emerald-400 px-2 flex justify-between">
                  <span>الشارت المباشر: BINANCE:{selectedSymbol} ({timeframe})</span>
                </div>
                <div id="tradingview_chart" className="h-[470px] w-full"></div>
              </div>
            )}

            {activeTab === 'risk' && (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-4 text-xs">
                <h2 className="font-bold text-emerald-400 text-sm">حاسبة إدارة المخاطر وتداول الانفجارات</h2>
                <div className="space-y-3">
                  <div>
                    <label className="text-gray-400 block mb-1">رأس المال الإجمالي ($):</label>
                    <input type="number" value={capital} onChange={(e) => setCapital(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white" />
                  </div>
                  <div>
                    <label className="text-gray-400 block mb-1">نسبة المخاطرة (%):</label>
                    <input type="number" value={riskPercent} onChange={(e) => setRiskPercent(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white" />
                  </div>
                  <div>
                    <label className="text-gray-400 block mb-1">سعر الدخول ($):</label>
                    <input type="number" value={entryPrice} onChange={(e) => setEntryPrice(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white" />
                  </div>
                  <div>
                    <label className="text-gray-400 block mb-1">وقف الخسارة SL ($):</label>
                    <input type="number" value={stopLoss} onChange={(e) => setStopLoss(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white" />
                  </div>

                  <div className="p-3 bg-gray-950 border border-emerald-500/30 rounded-lg space-y-1">
                    <div className="flex justify-between">
                      <span className="text-gray-400">مبلغ المخاطرة:</span>
                      <span className="font-bold text-rose-400">${riskAmount}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-400">حجم العقد:</span>
                      <span className="font-bold text-emerald-400">${posSize}</span>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NebrasApp />);
  </script>
</body>
</html>
