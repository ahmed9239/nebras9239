<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وُول سْتريت الشَّامِلَة - محطة الأسهم الأمريكية (متوافقة مع الكمبيوتر)</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #030712; color: #f3f4f6; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen selection:bg-blue-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function WallStreetApp() {
      const [activeTab, setActiveTab] = useState('ai_predict');
      const [timeframe, setTimeframe] = useState('1h');
      const [category, setCategory] = useState('all');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedSymbol, setSelectedSymbol] = useState('NASDAQ:AAPL');
      const [manualSymbolInput, setManualSymbolInput] = useState('');
      
      const [toastMessage, setToastMessage] = useState(null);
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 2500);
      };

      const [favorites, setFavorites] = useState(JSON.parse(localStorage.getItem('wallstreet_favorites') || '["NASDAQ:AAPL", "NASDAQ:NVDA", "NASDAQ:TSLA"]'));

      const toggleFavorite = (sym) => {
        let updated = favorites.includes(sym) ? favorites.filter(s => s !== sym) : [...favorites, sym];
        setFavorites(updated);
        localStorage.setItem('wallstreet_favorites', JSON.stringify(updated));
        showToast('تم تحديث المفضلة ⭐');
      };

      const [userTelegram] = useState('@ahmed17200');

      const [journalTrades, setJournalTrades] = useState(JSON.parse(localStorage.getItem('wallstreet_journal') || '[]'));
      const [newTradeSymbol, setNewTradeSymbol] = useState('AAPL');
      const [newTradeType, setNewTradeType] = useState('LONG');
      const [newTradeEntry, setNewTradeEntry] = useState('');
      const [newTradePnL, setNewTradePnL] = useState('');

      const [capital, setCapital] = useState(10000);
      const [riskPercent, setRiskPercent] = useState(2);

      const [usStocks, setUsStocks] = useState([
        { symbol: 'AAPL', label: 'Apple Inc.', price: '228.50', change: '+1.45', changeNum: 1.45, netInflow: '+45.2M$', netInflowNum: 45.2, isShort: false, tvSymbol: 'NASDAQ:AAPL', sl: '224.20', tp1: '232.00', tp2: '236.50', tp3: '242.00', smartScore: 89, smcType: 'منطقة طلب مؤسسي 🟩', elliott: 'الموجة الدافعة الثالثة 🚀', isBreakout: true },
        { symbol: 'NVDA', label: 'NVIDIA Corp.', price: '128.30', change: '+3.80', changeNum: 3.80, netInflow: '+112.5M$', netInflowNum: 112.5, isShort: false, tvSymbol: 'NASDAQ:NVDA', sl: '123.50', tp1: '133.00', tp2: '139.00', tp3: '148.00', smartScore: 94, smcType: 'اختراق هيكلي صاعد 🚀', elliott: 'الموجة الدافعة الثالثة (انفجار) 🚀', isBreakout: true },
        { symbol: 'TSLA', label: 'Tesla Inc.', price: '215.40', change: '-2.10', changeNum: -2.10, netInflow: '-38.4M$', netInflowNum: -38.4, isShort: true, tvSymbol: 'NASDAQ:TSLA', sl: '221.00', tp1: '209.00', tp2: '202.00', tp3: '194.00', smartScore: 76, smcType: 'منطقة عرض مؤسسي 🟥', elliott: 'تصحيح مركب هابط', isBreakout: false },
        { symbol: 'MSFT', label: 'Microsoft Corp.', price: '425.10', change: '+0.85', changeNum: 0.85, netInflow: '+28.1M$', netInflowNum: 28.1, isShort: false, tvSymbol: 'NASDAQ:MSFT', sl: '418.00', tp1: '432.00', tp2: '440.00', tp3: '450.00', smartScore: 84, smcType: 'منطقة طلب مؤسسي 🟩', elliott: 'الموجة الأولى', isBreakout: false },
        { symbol: 'AMZN', label: 'Amazon.com', price: '186.20', change: '+1.15', changeNum: 1.15, netInflow: '+31.0M$', netInflowNum: 31.0, isShort: false, tvSymbol: 'NASDAQ:AMZN', sl: '182.50', tp1: '191.00', tp2: '196.00', tp3: '203.00', smartScore: 82, smcType: 'تجميع إيجابي 🟩', elliott: 'الموجة الرئيسية صاعدة', isBreakout: false },
        { symbol: 'GOOGL', label: 'Alphabet Inc.', price: '165.80', change: '-0.40', changeNum: -0.40, netInflow: '-5.2M$', netInflowNum: -5.2, isShort: true, tvSymbol: 'NASDAQ:GOOGL', sl: '169.00', tp1: '162.00', tp2: '158.00', tp3: '153.00', smartScore: 78, smcType: 'تصحيح فرعي 🟥', elliott: 'موجة تصحيحية', isBreakout: false },
        { symbol: 'META', label: 'Meta Platforms', price: '512.30', change: '+2.30', changeNum: 2.30, netInflow: '+64.0M$', netInflowNum: 64.0, isShort: false, tvSymbol: 'NASDAQ:META', sl: '501.00', tp1: '525.00', tp2: '538.00', tp3: '555.00', smartScore: 91, smcType: 'منطقة طلب مؤسسي 🟩', elliott: 'الموجة الدافعة الثالثة 🚀', isBreakout: true },
        { symbol: 'AMD', label: 'Advanced Micro Devices', price: '156.40', change: '+4.10', changeNum: 4.10, netInflow: '+55.8M$', netInflowNum: 55.8, isShort: false, tvSymbol: 'NASDAQ:AMD', sl: '150.00', tp1: '163.00', tp2: '170.00', tp3: '182.00', smartScore: 88, smcType: 'اختراق هيكلي صاعد 🚀', elliott: 'الانفجار السعري الصاعد 🚀', isBreakout: true },
        { symbol: 'NFLX', label: 'Netflix Inc.', price: '680.20', change: '-1.20', changeNum: -1.20, netInflow: '-12.4M$', netInflowNum: -12.4, isShort: true, tvSymbol: 'NASDAQ:NFLX', sl: '695.00', tp1: '665.00', tp2: '650.00', tp3: '630.00', smartScore: 75, smcType: 'منطقة عرض مؤسسي 🟥', elliott: 'تصحيح هابط', isBreakout: false },
        { symbol: 'PLTR', label: 'Palantir Tech.', price: '38.90', change: '+5.60', changeNum: 5.60, netInflow: '+78.2M$', netInflowNum: 78.2, isShort: false, tvSymbol: 'NYSE:PLTR', sl: '36.50', tp1: '41.00', tp2: '44.00', tp3: '48.00', smartScore: 93, smcType: 'اختراق قوي 🚀', elliott: 'موجة الاندفاع الكبرى 🚀', isBreakout: true }
      ]);

      const activeStockObj = useMemo(() => {
        return usStocks.find(s => s.symbol === selectedSymbol || s.tvSymbol === selectedSymbol) || usStocks[0];
      }, [usStocks, selectedSymbol]);

      const filteredStocks = useMemo(() => {
        let res = [...usStocks];
        if (category === 'inflow') res = res.filter(s => s.netInflowNum > 0);
        else if (category === 'outflow') res = res.filter(s => s.netInflowNum < 0);
        else if (category === 'long') res = res.filter(s => !s.isShort);
        else if (category === 'short') res = res.filter(s => s.isShort);
        
        if (searchTerm) {
          res = res.filter(s => s.symbol.toLowerCase().includes(searchTerm.toLowerCase()) || s.label.toLowerCase().includes(searchTerm.toLowerCase()));
        }
        return res;
      }, [usStocks, category, searchTerm]);

      const favoriteStocks = useMemo(() => usStocks.filter(s => favorites.includes(s.tvSymbol) || favorites.includes(s.symbol)), [usStocks, favorites]);
      const breakoutStocks = useMemo(() => usStocks.filter(s => s.isBreakout), [usStocks]);
      const elliottStocks = useMemo(() => usStocks.filter(s => Math.abs(s.changeNum) >= 2.0), [usStocks]);
      const smcStocks = useMemo(() => usStocks.filter(s => Math.abs(s.changeNum) >= 1.0), [usStocks]);

      useEffect(() => {
        if (activeTab === 'chart' && window.TradingView) {
          try {
            document.getElementById('tradingview_us_chart').innerHTML = '';
            new window.TradingView.widget({
              "autosize": true,
              "symbol": selectedSymbol,
              "interval": timeframe === '15m' ? '15' : timeframe === '4h' ? '240' : '60',
              "timezone": "Asia/Riyadh",
              "theme": "dark",
              "style": "1",
              "locale": "ar",
              "toolbar_bg": "#f1f3f6",
              "enable_publishing": false,
              "container_id": "tradingview_us_chart"
            });
          } catch (e) { console.error("TV Error:", e); }
        }
      }, [activeTab, selectedSymbol, timeframe]);

      const addCustomStock = (e) => {
        e.preventDefault();
        if (!manualSymbolInput) return;
        const cleanSymbol = manualSymbolInput.toUpperCase().trim();
        const tvSym = cleanSymbol.includes(':') ? cleanSymbol : `NASDAQ:${cleanSymbol}`;
        const newStock = {
          symbol: cleanSymbol.replace(/^(NASDAQ|NYSE|AMEX):/, ''),
          label: `US Stock (${cleanSymbol})`,
          price: '150.00',
          change: '+2.50',
          changeNum: 2.5,
          netInflow: '+25.0M$',
          netInflowNum: 25.0,
          isShort: false,
          tvSymbol: tvSym,
          sl: '145.00',
          tp1: '158.00',
          tp2: '165.00',
          tp3: '175.00',
          smartScore: 88,
          smcType: 'منطقة طلب مؤسسي 🟩',
          elliott: 'الموجة الدافعة 🚀',
          isBreakout: true
        };
        setUsStocks([newStock, ...usStocks]);
        setSelectedSymbol(tvSym);
        setManualSymbolInput('');
        setActiveTab('ai_predict');
        showToast(`تمت إضافة وتحليل السهم ${cleanSymbol} بنجاح 🚀`);
      };

      const copyTradePlanText = (stock) => {
        const tradeTypeStr = stock.isShort ? 'SHORT 🔴 (بيع)' : 'LONG 🟢 (شراء)';
        const text = `🇺🇸 توصية من وول ستريت الشاملة\nاتجاه الصفقة: ${tradeTypeStr}\nالسهم: ${stock.label} (${stock.symbol})\nالسعر الحالي: $${stock.price}\n🛑 وقف الخسارة: $${stock.sl}\n🎯 الهدف الأول: $${stock.tp1}\n🎯 الهدف الثاني: $${stock.tp2}\n🎯 الهدف الثالث: $${stock.tp3}`;
        navigator.clipboard.writeText(text);
        showToast('تم نسخ خطة الصفقة بنجاح! 📋');
      };

      const addJournalTrade = (e) => {
        e.preventDefault();
        if (!newTradeEntry || !newTradePnL) return;
        const trade = {
          id: Date.now(),
          symbol: newTradeSymbol,
          type: newTradeType,
          entry: newTradeEntry,
          pnl: parseFloat(newTradePnL),
          date: new Date().toLocaleDateString('ar-SA')
        };
        const updated = [trade, ...journalTrades];
        setJournalTrades(updated);
        localStorage.setItem('wallstreet_journal', JSON.stringify(updated));
        setNewTradePnL('');
        showToast('تم تسجيل الصفقة في الدفتر بنجاح ✅');
      };

      const deleteJournalTrade = (id) => {
        const updated = journalTrades.filter(t => t.id !== id);
        setJournalTrades(updated);
        localStorage.setItem('wallstreet_journal', JSON.stringify(updated));
        showToast('تم حذف الصفقة 🗑️');
      };

      const riskAmount = (capital * (riskPercent / 100)).toFixed(2);

      return (
        <div className="max-w-7xl mx-auto min-h-screen flex flex-col pb-6 px-4 relative">
          
          {toastMessage && (
            <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 bg-blue-500 text-gray-950 px-5 py-3 rounded-2xl shadow-2xl font-bold text-sm flex items-center gap-2 border border-blue-400">
              <span>{toastMessage}</span>
            </div>
          )}

          <header className="bg-gray-900 border border-gray-800 rounded-2xl p-4 mt-3 sticky top-3 z-50 flex items-center justify-between shadow-xl">
            <div>
              <h1 className="text-base font-black text-blue-400 tracking-wide flex items-center gap-2">
                وُول سْتريت الشَّامِلَة - السوق الأمريكي
                <span className="text-xs bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded border border-blue-500/30">Desktop Pro V2.1</span>
              </h1>
              <p className="text-xs text-gray-400 mt-0.5">المستخدم: <span className="text-blue-300 font-bold">{userTelegram}</span></p>
            </div>
          </header>

          <nav className="flex overflow-x-auto no-scrollbar bg-gray-900/90 p-2 my-4 rounded-xl border border-gray-800 gap-2 text-xs whitespace-nowrap">
            <button onClick={() => setActiveTab('ai_predict')} className={`px-4 py-2.5 font-bold rounded-lg transition-all ${activeTab === 'ai_predict' ? 'bg-blue-600 text-white shadow-lg' : 'text-blue-400 border border-blue-500/30'}`}>🧠 العقل الاصطناعي</button>
            <button onClick={() => setActiveTab('us_radar')} className={`px-4 py-2.5 font-bold rounded-lg transition-all ${activeTab === 'us_radar' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-400'}`}>الرادار 📡</button>
            <button onClick={() => setActiveTab('favorites')} className={`px-4 py-2.5 font-bold rounded-lg transition-all ${activeTab === 'favorites' ? 'bg-amber-400 text-black shadow-lg' : 'text-amber-400'}`}>⭐ المفضلة</button>
            <button onClick={() => setActiveTab('breakouts')} className={`px-4 py-2.5 font-bold rounded-lg transition-all ${activeTab === 'breakouts' ? 'bg-blue-500 text-black shadow-lg' : 'text-gray-400'}`}>الانفجارات 🚀</button>
            <button onClick={() => setActiveTab('elliott')} className={`px-4 py-2.5 font-bold rounded-lg transition-all ${activeTab === 'elliott' ? 'bg-cyan-500 text-black shadow-lg' : 'text-gray-400'}`}>إليوت 🌊</button>
            <button onClick={() => setActiveTab('smc')} className={`px-4 py-2.5 font-bold rounded-lg transition-all ${activeTab === 'smc' ? 'bg-blue-500 text-black shadow-lg' : 'text-gray-400'}`}>SMC 📊</button>
            <button onClick={() => setActiveTab('journal')} className={`px-4 py-2.5 font-bold rounded-lg transition-all ${activeTab === 'journal' ? 'bg-blue-500 text-black shadow-lg' : 'text-gray-400'}`}>الدفتر 📖</button>
            <button onClick={() => setActiveTab('chart')} className={`px-4 py-2.5 font-bold rounded-lg transition-all ${activeTab === 'chart' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-400'}`}>الشارت 📊</button>
            <button onClick={() => setActiveTab('risk')} className={`px-4 py-2.5 font-bold rounded-lg transition-all ${activeTab === 'risk' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-400'}`}>المخاطر 🛡️</button>
          </nav>

          <main className="flex-1 space-y-4">
            
            {activeTab === 'ai_predict' && activeStockObj && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                <div className="lg:col-span-2 space-y-4">
                  <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1 text-xs items-center">
                    <span className="bg-blue-500/20 text-blue-300 px-3 py-1.5 rounded-lg font-bold">🔥 الأسهم النشطة</span>
                    {usStocks.slice(0, 6).map((s, idx) => (
                      <button key={idx} onClick={() => setSelectedSymbol(s.tvSymbol)} className={`px-4 py-1.5 rounded-lg border font-bold whitespace-nowrap ${selectedSymbol === s.tvSymbol ? 'bg-blue-600 text-white border-blue-400' : 'bg-gray-900 border-gray-800 text-gray-300'}`}>
                        {s.symbol}
                      </button>
                    ))}
                  </div>

                  <div className="bg-gradient-to-r from-blue-950/80 via-gray-900 to-indigo-950/60 border border-blue-500/50 rounded-2xl p-5 space-y-3 shadow-xl">
                    <span className="text-[10px] bg-blue-500/20 text-blue-300 font-bold px-2.5 py-1 rounded border border-blue-500/40">WALL STREET AI ENGINE V2.1</span>
                    <h2 className="text-base font-black text-white">العقل الاصطناعي لتحليل الأسهم الأمريكية</h2>
                    
                    <form onSubmit={addCustomStock} className="flex gap-2">
                      <input 
                        type="text"
                        placeholder="أدخل رمز أي سهم (مثال: META, AMD, NFLX)..."
                        value={manualSymbolInput}
                        onChange={(e) => setManualSymbolInput(e.target.value)}
                        className="flex-1 bg-gray-950 border border-blue-500/50 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none"
                      />
                      <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2.5 rounded-xl text-sm shadow">إضافة وتحليل 🔍</button>
                    </form>
                  </div>

                  <div className="grid grid-cols-4 gap-2 text-center text-xs">
                    <button onClick={() => setTimeframe('15m')} className={`p-2.5 rounded-xl border font-bold ${timeframe === '15m' ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400'}`}>15m</button>
                    <button onClick={() => setTimeframe('1h')} className={`p-2.5 rounded-xl border font-bold ${timeframe === '1h' ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400'}`}>1h</button>
                    <button onClick={() => setTimeframe('4h')} className={`p-2.5 rounded-xl border font-bold ${timeframe === '4h' ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400'}`}>4h</button>
                    <button onClick={() => setTimeframe('1d')} className={`p-2.5 rounded-xl border font-bold ${timeframe === '1d' ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400'}`}>1d</button>
                  </div>

                  <div className="bg-gray-900 border border-blue-500/40 rounded-2xl p-5 space-y-4 shadow-xl">
                    <div className="flex justify-between items-center border-b border-gray-800 pb-4">
                      <div>
                        <span className={`text-xs font-bold px-3 py-1 rounded border ${activeStockObj.isShort ? 'bg-rose-500/20 text-rose-300' : 'bg-emerald-500/20 text-emerald-300'}`}>
                          {activeStockObj.isShort ? 'SHORT 🔴' : 'LONG 🟢'}
                        </span>
                        <strong className="text-lg text-white font-black block mt-2">{activeStockObj.label} (${activeStockObj.symbol})</strong>
                        <span className="text-sm text-emerald-400 font-mono font-bold">${activeStockObj.price} ({activeStockObj.change}%)</span>
                      </div>
                      <div className="w-16 h-16 rounded-full border-4 border-blue-500 flex flex-col items-center justify-center bg-gray-950 shadow-lg">
                        <span className="text-sm font-black text-blue-400">{activeStockObj.smartScore}</span>
                        <span className="text-[9px] text-gray-400">القوة</span>
                      </div>
                    </div>

                    <div className="text-xs space-y-2 bg-gray-950 p-3.5 rounded-xl border border-gray-800">
                      <div className="flex justify-between"><span className="text-gray-400">صافي السيولة:</span><span className={activeStockObj.netInflowNum >= 0 ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}>{activeStockObj.netInflow}</span></div>
                      <div className="flex justify-between"><span className="text-gray-400">هيكلة SMC:</span><span className="text-blue-300 font-bold">{activeStockObj.smcType}</span></div>
                    </div>

                    <button onClick={() => toggleFavorite(activeStockObj.tvSymbol)} className="w-full bg-gray-950 border border-amber-500/40 text-amber-400 text-sm py-2.5 rounded-xl font-bold">
                      {favorites.includes(activeStockObj.tvSymbol) ? '⭐ إزالة من المفضلة' : '☆ إضافة للمفضلة'}
                    </button>
                  </div>
                </div>

                <div className="space-y-4">
                  <div className="bg-gray-900 border border-blue-500/40 rounded-2xl p-5 space-y-4 shadow-xl">
                    <div className="flex justify-between items-center">
                      <h3 className="font-bold text-blue-300 text-sm">📋 خطة التداول المقترحة</h3>
                      <button onClick={() => copyTradePlanText(activeStockObj)} className="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg shadow font-bold">نسخ 📋</button>
                    </div>
                    <div className="grid grid-cols-2 gap-2 text-center text-xs">
                      <div className="bg-gray-950 p-3 rounded-xl border border-blue-500/30">
                        <span className="text-blue-400 block text-[10px] mb-1">وقف الخسارة (SL)</span>
                        <span className="text-rose-300 font-bold text-sm">${activeStockObj.sl}</span>
                      </div>
                      <div className="bg-gray-950 p-3 rounded-xl border border-emerald-500/30">
                        <span className="text-emerald-400 block text-[10px] mb-1">الهدف الأول (TP1)</span>
                        <span className="text-emerald-300 font-bold text-sm">${activeStockObj.tp1}</span>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2 text-center text-xs">
                      <div className="bg-gray-950 p-3 rounded-xl border border-emerald-500/40">
                        <span className="text-emerald-400 block text-[10px] mb-1">الهدف الثاني (TP2)</span>
                        <span className="text-emerald-300 font-bold text-sm">${activeStockObj.tp2}</span>
                      </div>
                      <div className="bg-gray-950 p-3 rounded-xl border border-cyan-500/40">
                        <span className="text-cyan-400 block text-[10px] mb-1">الهدف الثالث (TP3)</span>
                        <span className="text-cyan-300 font-bold text-sm">${activeStockObj.tp3}</span>
                      </div>
                    </div>
                    <button onClick={() => setActiveTab('chart')} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-xs shadow">
                      📊 عرض الشارت المباشر لهذا السهم
                    </button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'us_radar' && (
              <div className="space-y-4">
                <input 
                  type="text" 
                  placeholder="ابحث في الأسهم الأمريكية..." 
                  value={searchTerm} 
                  onChange={(e) => setSearchTerm(e.target.value)} 
                  className="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none" 
                />

                <div className="flex gap-2 text-xs">
                  <button onClick={() => setCategory('all')} className={`px-3 py-1.5 rounded-lg ${category === 'all' ? 'bg-blue-600 text-white font-bold' : 'bg-gray-900 text-gray-300'}`}>الكل</button>
                  <button onClick={() => setCategory('inflow')} className={`px-3 py-1.5 rounded-lg ${category === 'inflow' ? 'bg-emerald-500 text-black font-bold' : 'bg-gray-900 text-gray-300'}`}>دخول سيولة</button>
                  <button onClick={() => setCategory('outflow')} className={`px-3 py-1.5 rounded-lg ${category === 'outflow' ? 'bg-rose-500 text-white font-bold' : 'bg-gray-900 text-gray-300'}`}>خروج سيولة</button>
                  <button onClick={() => setCategory('long')} className={`px-3 py-1.5 rounded-lg ${category === 'long' ? 'bg-emerald-500 text-black font-bold' : 'bg-gray-900 text-gray-300'}`}>صاعد LONG</button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                  {filteredStocks.map((stock, idx) => (
                    <div key={idx} className="bg-gray-900 border border-blue-500/30 rounded-2xl p-4 space-y-3 shadow-xl">
                      <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                        <div className="flex items-center gap-2">
                          <span className={`text-xs font-black px-2 py-0.5 rounded border ${stock.isShort ? 'bg-rose-500/20 text-rose-300' : 'bg-emerald-500/20 text-emerald-300'}`}>
                            {stock.isShort ? 'SHORT 🔴' : 'LONG 🟢'}
                          </span>
                          <div>
                            <span className="font-black text-sm text-white block">{stock.symbol}</span>
                            <span className="text-[10px] text-gray-400">{stock.label}</span>
                          </div>
                        </div>
                        <span className="font-mono font-bold text-sm text-emerald-400">${stock.price}</span>
                      </div>

                      <div className="flex items-center justify-between pt-1 text-xs">
                        <span className="text-gray-400">التغير: <strong className={stock.change.startsWith('+') ? 'text-emerald-400' : 'text-rose-400'}>{stock.change}%</strong> | السيولة: <strong className="text-blue-300">{stock.netInflow}</strong></span>
                        <div className="flex gap-2">
                          <button onClick={() => { setSelectedSymbol(stock.tvSymbol); setActiveTab('ai_predict'); }} className="bg-gray-800 border border-gray-700 text-indigo-300 font-bold px-3 py-1.5 rounded-lg text-xs">تحليل 🧠</button>
                          <button onClick={() => { setSelectedSymbol(stock.tvSymbol); setActiveTab('chart'); }} className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1.5 rounded-lg text-xs">الشارت 📊</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'favorites' && (
              <div className="space-y-4">
                <h2 className="font-black text-amber-400 text-sm">⭐ الأسهم الأمريكية المفضلة ({favoriteStocks.length})</h2>
                {favoriteStocks.length === 0 ? <p className="text-xs text-gray-400">لا توجد أسهم في المفضلة.</p> : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {favoriteStocks.map((stock, idx) => (
                      <div key={idx} className="bg-gray-900 border border-amber-500/30 rounded-xl p-4 flex justify-between items-center text-sm shadow-xl">
                        <div>
                          <span className="font-bold text-white block">{stock.symbol}</span>
                          <span className="text-xs text-gray-400">{stock.label}</span>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className="font-mono font-bold text-emerald-400">${stock.price}</span>
                          <button onClick={() => { setSelectedSymbol(stock.tvSymbol); setActiveTab('ai_predict'); }} className="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">تحليل</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'breakouts' && (
              <div className="space-y-3">
                <h2 className="font-black text-blue-400 text-sm">🚀 الانفجارات السعرية في السوق الأمريكي</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {breakoutStocks.map((stock, idx) => (
                    <div key={idx} className="bg-gray-900 border border-blue-500/40 rounded-xl p-4 flex justify-between items-center text-sm shadow-xl">
                      <div>
                        <span className="font-bold text-white block">{stock.symbol} ({stock.label})</span>
                        <span className="text-xs text-emerald-400">زخم صاعد قوي</span>
                      </div>
                      <button onClick={() => { setSelectedSymbol(stock.tvSymbol); setActiveTab('chart'); }} className="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-xs">شارت</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'elliott' && (
              <div className="space-y-3">
                <h2 className="font-black text-cyan-400 text-sm">🌊 موجات إليوت للأسهم</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {elliottStocks.map((stock, idx) => (
                    <div key={idx} className="bg-gray-900 border border-cyan-500/30 rounded-xl p-4 flex justify-between items-center text-sm shadow-xl">
                      <div>
                        <span className="font-bold text-white block">{stock.symbol}</span>
                        <span className="text-xs text-cyan-300">{stock.elliott}</span>
                      </div>
                      <button onClick={() => { setSelectedSymbol(stock.tvSymbol); setActiveTab('chart'); }} className="bg-cyan-600 text-black font-bold px-4 py-2 rounded-lg text-xs">شارت</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'smc' && (
              <div className="space-y-3">
                <h2 className="font-black text-blue-400 text-sm">📊 مناطق العرض والطلب (SMC / ICT)</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {smcStocks.map((stock, idx) => (
                    <div key={idx} className="bg-gray-900 border border-blue-500/30 rounded-xl p-4 flex justify-between items-center text-sm shadow-xl">
                      <div>
                        <span className="font-bold text-white block">{stock.symbol}</span>
                        <span className="text-xs text-blue-300">{stock.smcType}</span>
                      </div>
                      <button onClick={() => { setSelectedSymbol(stock.tvSymbol); setActiveTab('ai_predict'); }} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs">تحليل</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'journal' && (
              <div className="space-y-4 max-w-2xl mx-auto text-sm">
                <div className="bg-gray-900 border border-blue-500/40 rounded-2xl p-5 space-y-3 shadow-xl">
                  <h2 className="font-bold text-blue-400 text-base">📖 دفتر صفقات وول ستريت</h2>
                  <form onSubmit={addJournalTrade} className="space-y-3 pt-3 border-t border-gray-800">
                    <div className="grid grid-cols-2 gap-3">
                      <input type="text" value={newTradeSymbol} onChange={(e) => setNewTradeSymbol(e.target.value)} placeholder="السهم (AAPL)" className="bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white" required />
                      <select value={newTradeType} onChange={(e) => setNewTradeType(e.target.value)} className="bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white"><option value="LONG">LONG 🟢</option><option value="SHORT">SHORT 🔴</option></select>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <input type="number" step="any" value={newTradeEntry} onChange={(e) => setNewTradeEntry(e.target.value)} placeholder="سعر الدخول" className="bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white" required />
                      <input type="number" step="any" value={newTradePnL} onChange={(e) => setNewTradePnL(e.target.value)} placeholder="الربح/الخسارة ($)" className="bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white" required />
                    </div>
                    <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-sm shadow">تسجيل الصفقة في الدفتر</button>
                  </form>
                </div>
                <div className="space-y-2">
                  {journalTrades.map((t) => (
                    <div key={t.id} className="bg-gray-900 border border-gray-800 rounded-xl p-4 flex justify-between items-center text-sm">
                      <div><span className={`font-bold ${t.type === 'LONG' ? 'text-emerald-400' : 'text-rose-400'}`}>{t.type}</span> <strong className="text-white ml-2">{t.symbol}</strong></div>
                      <div className="flex items-center gap-4"><span className={`font-mono font-bold ${t.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>${t.pnl}</span><button onClick={() => deleteJournalTrade(t.id)} className="text-gray-500 hover:text-rose-400">✕</button></div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'chart' && (
              <div className="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-3 h-[750px] shadow-2xl">
                <div className="text-sm font-bold text-blue-400 px-2">الشارت المباشر للرمز: {selectedSymbol}</div>
                <div id="tradingview_us_chart" className="h-[680px] w-full"></div>
              </div>
            )}

            {activeTab === 'risk' && (
              <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-4 max-w-xl mx-auto text-sm shadow-2xl">
                <h2 className="font-bold text-blue-400 text-base">حاسبة إدارة المخاطر للأسهم الأمريكية</h2>
                <div className="space-y-4">
                  <div><label className="text-gray-400 block mb-2">رأس المال ($):</label><input type="number" value={capital} onChange={(e) => setCapital(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-white" /></div>
                  <div><label className="text-gray-400 block mb-2">نسبة المخاطرة (%):</label><input type="number" value={riskPercent} onChange={(e) => setRiskPercent(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-white" /></div>
                  <div className="p-4 bg-gray-950 border border-blue-500/30 rounded-xl space-y-2">
                    <div className="flex justify-between"><span className="text-gray-400">المبلغ المعرض للمخاطرة:</span><span className="font-bold text-rose-400">${riskAmount}</span></div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<WallStreetApp />);
  </script>
</body>
</html>
