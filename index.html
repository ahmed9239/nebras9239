<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نِبْرَاس الشَّامِلَة - محطة التداول المؤسسي V27.0</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }

<body class="bg-gray-950 text-gray-100 min-h-screen selection:bg-emerald-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const playSmartAlertSound = () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const playTone = (freq, startTime, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.18, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        };
        playTone(587.33, now, 0.14);
        playTone(880.00, now + 0.14, 0.28);
      } catch (e) { console.error(e); }
    };

    function NebrasApp() {
      const [activeTab, setActiveTab] = useState('ai_predict');
      const [timeframe, setTimeframe] = useState('1h');
      const [category, setCategory] = useState('all');
      const [vipFilter, setVipFilter] = useState('all');
      const [loading, setLoading] = useState(true);
      const [allTickers, setAllTickers] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedSymbol, setSelectedSymbol] = useState('BTCUSDT');
      const [manualSymbolInput, setManualSymbolInput] = useState('');
      
      const [userTelegram, setUserTelegram] = useState(localStorage.getItem('nebras_telegram') || '@ahmed17200');
      const [notificationsEnabled, setNotificationsEnabled] = useState(true);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showNotifModal, setShowNotifModal] = useState(false);
      const [platformNotifications, setPlatformNotifications] = useState([]);

      const [capital, setCapital] = useState(1000);
      const [riskPercent, setRiskPercent] = useState(2);
      const [entryPrice, setEntryPrice] = useState(67000);
      const [stopLoss, setStopLoss] = useState(66000);

      const aiSymbols = ['TAO', 'FET', 'NEAR', 'RNDR', 'WLD', 'AGIX', 'AKT'];
      const majorSymbols = ['BTC', 'ETH', 'SOL', 'BNB', 'XRP', 'ADA', 'AVAX'];

      const fetchAllBinanceData = async () => {
        try {
          const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
          const data = await res.json();
          
          const usdtPairs = data
            .filter(t => t.symbol.endsWith('USDT'))
            .map(t => {
              const base = t.symbol.replace('USDT', '');
              const priceNum = parseFloat(t.lastPrice);
              if (priceNum <= 0) return null;
              
              let decimals = 2;
              if (priceNum < 0.0001) decimals = 8;
              else if (priceNum < 1) decimals = 4;

              const changeNum = parseFloat(t.priceChangePercent);
              const volNum = parseFloat(t.quoteVolume);

              const buyPercent = Math.min(Math.max(50 + (changeNum * 2.5), 20), 85).toFixed(1);
              const sellPercent = (100 - parseFloat(buyPercent)).toFixed(1);
              const netInflowNum = (volNum * (changeNum / 100) * 0.15) / 1000000;
              
              const isShort = netInflowNum < -0.25;
              const isBreakout = Math.abs(changeNum) >= 4.0 || volNum > 50000000;
              
              let entryLow = priceNum * 0.999;
              let entryHigh = priceNum * 1.001;
              let sl = isShort ? priceNum * 1.018 : priceNum * 0.982;
              const tp1 = isShort ? priceNum * 0.975 : priceNum * 1.025;
              const tp2 = isShort ? priceNum * 0.945 : priceNum * 1.055;
              const tp3 = isShort ? priceNum * 0.910 : priceNum * 1.100;

              return {
                symbol: t.symbol,
                base: base,
                label: `${base}/USDT`,
                rawPrice: priceNum,
                price: priceNum.toFixed(decimals),
                entryLowFormatted: entryLow.toFixed(decimals > 4 ? decimals : 5),
                entryHighFormatted: entryHigh.toFixed(decimals > 4 ? decimals : 5),
                entryFormatted: priceNum.toFixed(decimals),
                slFormatted: sl.toFixed(decimals),
                tp1Formatted: tp1.toFixed(decimals),
                tp2Formatted: tp2.toFixed(decimals),
                tp3Formatted: tp3.toFixed(decimals),
                changeNum: changeNum,
                change: changeNum.toFixed(2),
                volumeNum: volNum,
                volume: (volNum / 1000000).toFixed(2) + 'M',
                buyPercent: buyPercent,
                sellPercent: sellPercent,
                netInflowNum: netInflowNum,
                netInflow: (netInflowNum >= 0 ? `+${netInflowNum.toFixed(2)}M$` : `${netInflowNum.toFixed(2)}M$`),
                isShort: isShort,
                isBreakout: isBreakout,
                smartScore: 82,
                signalTag: netInflowNum >= 0 ? 'دخول سيولة حاد 🔥' : 'خروج سيولة حاد ⚠️',
                signalColor: netInflowNum >= 0 ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30' : 'text-rose-400 bg-rose-500/10 border-rose-500/30'
              };
            })
            .filter(Boolean);

          setAllTickers(usdtPairs);
          setLoading(false);
        } catch (err) { console.error(err); }
      };

      useEffect(() => {
        fetchAllBinanceData();
        const interval = setInterval(fetchAllBinanceData, 4000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (activeTab === 'chart' && window.TradingView) {
          let cleanSymbol = selectedSymbol ? selectedSymbol.replace('BINANCE:', '') : 'BTCUSDT';
          new window.TradingView.widget({
            "autosize": true,
            "symbol": `BINANCE:${cleanSymbol}`,
            "interval": timeframe === '5m' ? '5' : timeframe === '1h' ? '60' : '15',
            "timezone": "Asia/Riyadh",
            "theme": "dark",
            "style": "1",
            "locale": "ar",
            "toolbar_bg": "#f1f3f6",
            "container_id": "tradingview_chart"
          });
        }
      }, [activeTab, selectedSymbol, timeframe]);

      const filteredPairs = useMemo(() => {
        let result = [...allTickers];
        if (searchTerm) {
          result = result.filter(item => item.label.toLowerCase().includes(searchTerm.toLowerCase()));
        }
        return result.slice(0, 50);
      }, [allTickers, searchTerm]);

      const breakoutSignals = useMemo(() => allTickers.filter(i => i.isBreakout).slice(0, 20), [allTickers]);
      const elliottSignals = useMemo(() => allTickers.filter(i => Math.abs(i.changeNum) >= 2.5).slice(0, 20), [allTickers]);
      const smcSignals = useMemo(() => allTickers.filter(i => i.volumeNum > 15000000).slice(0, 20), [allTickers]);
      const liquidationSignals = useMemo(() => allTickers.filter(i => Math.abs(i.changeNum) > 3).slice(0, 20), [allTickers]);
      const vipSignals = useMemo(() => allTickers.filter(i => Math.abs(i.netInflowNum) > 0.2).slice(0, 20), [allTickers]);

      const selectedAiTicker = useMemo(() => {
        return allTickers.find(i => i.symbol === selectedSymbol) || allTickers[0] || {
          symbol: 'BTCUSDT', base: 'BTC', label: 'BTC/USDT', rawPrice: 65278, price: '65278.96',
          entryLowFormatted: '65213.68', entryHighFormatted: '65400.00', slFormatted: '66453.98',
          tp1Formatted: '67500.00', tp2Formatted: '69000.00', tp3Formatted: '72000.00', changeNum: 2.5, change: '2.50',
          netInflowNum: 1.5, netInflow: '+1.50M$', smartScore: 78
        };
      }, [allTickers, selectedSymbol]);

      const riskAmount = (capital * (riskPercent / 100)).toFixed(2);
      const priceDiff = Math.abs(entryPrice - stopLoss);
      const posSize = priceDiff > 0 ? (riskAmount / (priceDiff / entryPrice)).toFixed(2) : 0;

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col pb-6 relative bg-gray-950 text-gray-100">

            <div>
              <h1 className="text-sm font-black text-emerald-400 tracking-wide flex items-center gap-1.5">
                نِبْرَاس الشَّامِلَة
                <span className="text-[10px] bg-emerald-500/20 text-emerald-300 font-normal px-1.5 py-0.5 rounded border border-emerald-500/30">V27.0</span>
              </h1>
              <p className="text-[10px] text-gray-400 mt-0.5">المستخدم: <span className="text-emerald-300 font-bold">{userTelegram}</span></p>
            </div>
            <div className="flex items-center gap-1.5">
              <button onClick={() => setSoundEnabled(!soundEnabled)} className="text-xs px-2 py-1.5 rounded-lg border font-bold bg-gray-800 border-gray-700 text-amber-300">
                {soundEnabled ? '🔊' : '🔇'}
              </button>
              <button onClick={() => setShowNotifModal(true)} className="relative text-[11px] bg-gray-800 border border-gray-700 text-cyan-400 px-2.5 py-1.5 rounded-lg font-bold">
                🔔 الإشعارات
              </button>
            </div>
          </header>

          {/* شريط التبويبات المتكاملة */}
          <nav className="flex overflow-x-auto no-scrollbar bg-gray-900/90 p-1.5 m-3 rounded-xl border border-gray-800 gap-1 text-[10px] whitespace-nowrap">
            <button onClick={() => setActiveTab('ai_predict')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'ai_predict' ? 'bg-indigo-600 text-white shadow-lg' : 'text-indigo-400 border border-indigo-500/30'}`}>🧠 العقل الاصطناعي V5.0</button>
            <button onClick={() => setActiveTab('security_ai')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'security_ai' ? 'bg-indigo-600 text-white shadow-lg' : 'text-gray-400'}`}>🛡️ تحليل الأمان الهاني بوت</button>
            <button onClick={() => setActiveTab('radar')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'radar' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>الرادار 📡</button>
            <button onClick={() => setActiveTab('signals')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'signals' ? 'bg-amber-400 text-gray-950 shadow-lg' : 'text-amber-400 border border-amber-500/30'}`}>VIP الذكي 🎯</button>
            <button onClick={() => setActiveTab('breakouts')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'breakouts' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>الانفجارات 🚀</button>
            <button onClick={() => setActiveTab('elliott')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'elliott' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>إليوت 🌊</button>
            <button onClick={() => setActiveTab('smc')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'smc' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>SMC 📊</button>
            <button onClick={() => setActiveTab('liquidation')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'liquidation' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>التصفيات ⚡</button>
            <button onClick={() => setActiveTab('chart')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'chart' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>الشارت</button>
            <button onClick={() => setActiveTab('risk')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'risk' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>المخاطر</button>
          </nav>

          <main className="flex-1 px-3 space-y-3">
            
            {/* 1. العقل الاصطناعي الشامل بكامل تفاصيله */}
            {activeTab === 'ai_predict' && selectedAiTicker && (
              <div className="space-y-3">
                <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1 text-[11px]">
                  <span className="bg-amber-500/20 border border-amber-500/40 text-amber-300 px-2.5 py-1.5 rounded-lg font-bold whitespace-nowrap">🔥 عملات رائجة</span>
                  {['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'SUIUSDT', 'PEPEUSDT', 'DOGEUSDT'].map((sym, idx) => (
                    <button key={idx} onClick={() => setSelectedSymbol(sym)} className={`px-3 py-1.5 rounded-lg border font-bold whitespace-nowrap ${selectedSymbol === sym ? 'bg-amber-400 text-black border-amber-400' : 'bg-gray-900 border-gray-800 text-gray-300'}`}>
                      {sym.replace('USDT', '')}
                    </button>
                  ))}
                </div>

                <div className="bg-gradient-to-r from-indigo-950/80 via-gray-900 to-purple-950/60 border border-indigo-500/50 rounded-2xl p-4 space-y-3 shadow-xl">
                  <div className="flex justify-between items-start">
                    <div>
                      <span className="text-[9px] bg-indigo-500/20 text-indigo-300 font-bold px-2 py-0.5 rounded border border-indigo-500/40">QUANTUM AI & TIME ANALYSIS V5.0</span>
                      <h2 className="text-sm font-black text-white mt-1">العقل الاصطناعي التنبؤي الشامل</h2>
                    </div>
                  </div>
                  <div className="flex gap-2 pt-1">
                    <input 
                      type="text"
                      placeholder="ابحث عن أي عملة يدوياً (BTC, ETH, PEPE...)"
                      value={manualSymbolInput}
                      onChange={(e) => setManualSymbolInput(e.target.value)}
                      className="flex-1 bg-gray-950 border border-indigo-500/50 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none"
                    />
                    <button onClick={() => { if (!manualSymbolInput) return; let sym = manualSymbolInput.toUpperCase().trim(); if (!sym.endsWith('USDT')) sym += 'USDT'; setSelectedSymbol(sym); setManualSymbolInput(''); }} className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-xl text-xs shadow">
                      تحليل شامل 🔍
                    </button>
                  </div>
                </div>

                <div className="bg-gray-900 border border-indigo-500/40 rounded-2xl p-4 space-y-3.5">
                  <div className="flex justify-between items-center border-b border-gray-800 pb-3">
                    <div>
                      <span className="text-[10px] bg-emerald-500/20 text-emerald-300 font-bold px-2 py-0.5 rounded border border-emerald-500/40">شراء قوي جداً 🚀</span>
                      <strong className="text-base text-white font-black block mt-1.5">{selectedAiTicker.label} ${selectedAiTicker.price}</strong>
                    </div>
                    <div className="relative w-16 h-16 rounded-full border-4 border-emerald-500 flex flex-col items-center justify-center bg-gray-950 shadow-lg">
                      <span className="text-sm font-black text-emerald-400">78</span>
                      <span className="text-[8px] text-gray-400 font-bold">قوة القرار</span>
                    </div>
                  </div>

                  <div className="space-y-2 text-[11px]">
                    <div className="flex justify-between bg-gray-950 p-2.5 rounded-xl border border-gray-800">
                      <span className="text-gray-400">الترند العام:</span>
                      <span className="text-white font-bold">صاعد مؤسسي | السيولة: {selectedAiTicker.netInflow}</span>
                    </div>
                    <div className="flex justify-between bg-gray-950 p-2.5 rounded-xl border border-gray-800">
                      <span className="text-gray-400">الجلسة النشطة:</span>
                      <span className="text-emerald-400 font-bold">New York Killzone 🟢</span>
                    </div>
                  </div>
                </div>

                <div className="bg-gradient-to-br from-gray-900 to-indigo-950/50 border border-indigo-500/60 rounded-2xl p-4 space-y-3">
                  <h3 className="font-black text-indigo-300 text-xs">📋 بطاقة خطة التداول المؤسسية المقترحة</h3>
                  <div className="grid grid-cols-2 gap-2 text-center text-xs">
                    <div className="bg-gray-950 p-2.5 rounded-xl border border-indigo-500/30">
                      <span className="text-indigo-400 block text-[9px] mb-0.5">منطقة الدخول المقترحة</span>
                      <span className="text-white font-mono font-bold">${selectedAiTicker.entryLowFormatted}</span>
                    </div>
                    <div className="bg-gray-950 p-2.5 rounded-xl border border-rose-500/30">
                      <span className="text-rose-400 block text-[9px] mb-0.5">وقف الخسارة (SL)</span>
                      <span className="text-rose-300 font-mono font-bold">${selectedAiTicker.slFormatted}</span>
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-1.5 text-center text-[10px]">
                    <div className="bg-gray-950 p-2 rounded-xl border border-emerald-500/30"><span className="text-emerald-400 block text-[8px]">الهدف 1</span><span className="text-emerald-300 font-mono font-bold">${selectedAiTicker.tp1Formatted}</span></div>
                    <div className="bg-gray-950 p-2 rounded-xl border border-emerald-500/40"><span className="text-emerald-400 block text-[8px]">الهدف 2</span><span className="text-emerald-300 font-mono font-bold">${selectedAiTicker.tp2Formatted}</span></div>
                    <div className="bg-gray-950 p-2 rounded-xl border border-cyan-500/40"><span className="text-cyan-400 block text-[8px]">الهدف 3</span><span className="text-cyan-300 font-mono font-bold">${selectedAiTicker.tp3Formatted}</span></div>
                  </div>
                  <button onClick={() => { setSelectedSymbol(selectedAiTicker.symbol); setActiveTab('chart'); }} className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-xs shadow">عرض الشارت التنفيذي 📊</button>
                </div>
              </div>
            )}

            {/* 2. تحليل الأمان وبوابة الهاني بوت */}
            {activeTab === 'security_ai' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-indigo-500/40 rounded-2xl p-4 space-y-3">
                  <h3 className="font-black text-rose-400 text-xs flex items-center gap-1.5">
                    🛡️ بوابة الأمان وفحص العقود الآلية (Honeypot Checker)
                  </h3>
                  <div className="space-y-2 text-xs">
                    <div className="bg-gray-950 p-2.5 rounded-xl border border-emerald-500/30 flex justify-between items-center">
                      <span className="text-gray-300">مصيدة (Honeypot):</span>
                      <span className="text-emerald-400 font-bold">غير مصنف كمصيدة ✅</span>
                    </div>
                    <div className="bg-gray-950 p-2.5 rounded-xl border border-emerald-500/30 flex justify-between items-center">
                      <span className="text-gray-300">ضريبة التداول:</span>
                      <span className="text-emerald-400 font-bold">لا توجد ضريبة شراء/بيع ملحوظة ✅</span>
                    </div>
                    <div className="bg-gray-950 p-2.5 rounded-xl border border-emerald-500/30 flex justify-between items-center">
                      <span className="text-gray-300">السيولة (DEX):</span>
                      <span className="text-emerald-400 font-bold">سيولة قوية ~ $25,958,533 ✅</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 3. الرادار */}
            {activeTab === 'radar' && (
              <div className="space-y-3">
                <input type="text" placeholder="بحث في الرادار..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full bg-gray-900 border border-gray-800 rounded-xl px-3.5 py-2 text-xs text-white" />
                {filteredPairs.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className="bg-gray-900 border border-gray-800 rounded-xl p-3 flex justify-between items-center text-xs cursor-pointer">
                    <div><strong className="text-white block">{item.label}</strong><span className="text-gray-400">${item.price}</span></div>
                    <div className="text-left"><span className={`font-bold ${item.changeNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{item.change}%</span><span className="text-[10px] text-gray-400 block">{item.netInflow}</span></div>
                  </div>
                ))}
              </div>
            )}

            {/* 4. VIP الذكي */}
            {activeTab === 'signals' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-amber-500/40 rounded-2xl p-3"><h2 className="font-black text-amber-400 text-xs">🎯 مرصد الصفقات الذكية VIP</h2></div>
                {vipSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className="bg-gray-900 border border-amber-500/30 rounded-xl p-3 flex justify-between items-center text-xs cursor-pointer">
                    <div><span className="text-white font-extrabold">{item.label}</span><span className="text-emerald-400 mr-2 font-mono">${item.entryFormatted}</span></div>
                    <span className="text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-bold">VIP صفقة</span>
                  </div>
                ))}
              </div>
            )}

            {/* 5. الانفجارات */}
            {activeTab === 'breakouts' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-emerald-500/40 rounded-2xl p-3"><h2 className="font-black text-emerald-400 text-xs">🚀 الانفجارات السعرية</h2></div>
                {breakoutSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className="bg-gray-900 border border-emerald-500/40 rounded-xl p-3 flex justify-between items-center text-xs cursor-pointer">
                    <span className="text-white font-extrabold">{item.label}</span>
                    <span className="text-emerald-400 font-bold">+{item.change}% 🚀</span>
                  </div>
                ))}
              </div>
            )}

            {/* 6. إليوت */}
            {activeTab === 'elliott' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-cyan-500/40 rounded-2xl p-3"><h2 className="font-black text-cyan-400 text-xs">🌊 موجات إليوت</h2></div>
                {elliottSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className="bg-gray-900 border border-cyan-500/40 rounded-xl p-3 flex justify-between items-center text-xs cursor-pointer">
                    <span className="text-white font-extrabold">{item.label}</span>
                    <span className="text-cyan-400 font-bold">موجة دافعة صاعدة 🌊</span>
                  </div>
                ))}
              </div>
            )}

            {/* 7. SMC */}
            {activeTab === 'smc' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-emerald-500/40 rounded-2xl p-3"><h2 className="font-black text-emerald-400 text-xs">📊 مناطق SMC / ICT</h2></div>
                {smcSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className="bg-gray-900 border border-emerald-500/40 rounded-xl p-3 flex justify-between items-center text-xs cursor-pointer">
                    <span className="text-white font-extrabold">{item.label}</span>
                    <span className="text-emerald-400 font-bold">منطقة طلب مؤسسي (OB) 🟩</span>
                  </div>
                ))}
              </div>
            )}

            {/* 8. التصفيات */}
            {activeTab === 'liquidation' && (
              <div className="space-y-3">
                <div className="bg-gray-900 border border-rose-500/40 rounded-2xl p-3"><h2 className="font-black text-rose-400 text-xs">⚡ التصفيات والسقويز</h2></div>
                {liquidationSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className="bg-gray-900 border border-rose-500/40 rounded-xl p-3 flex justify-between items-center text-xs cursor-pointer">
                    <span className="text-white font-extrabold">{item.label}</span>
                    <span className="text-rose-400 font-bold">تصفية شورت ضخمة ⚡</span>
                  </div>
                ))}
              </div>
            )}

            {/* 9. الشارت */}
            {activeTab === 'chart' && (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-2 space-y-2 h-[520px]">
                <div className="text-xs font-bold text-emerald-400 px-2">الشارت المباشر: BINANCE:{selectedSymbol}</div>
                <div id="tradingview_chart" className="h-[470px] w-full"></div>
              </div>
            )}

            {/* 10. المخاطر */}
            {activeTab === 'risk' && (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-4 text-xs">
                <h2 className="font-bold text-emerald-400 text-sm">حاسبة إدارة المخاطر</h2>
                <div className="space-y-3">
                  <div><label className="text-gray-400 block mb-1">رأس المال ($):</label><input type="number" value={capital} onChange={(e) => setCapital(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white" /></div>
                  <div><label className="text-gray-400 block mb-1">المخاطرة (%):</label><input type="number" value={riskPercent} onChange={(e) => setRiskPercent(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white" /></div>
                  <div className="p-3 bg-gray-950 border border-emerald-500/30 rounded-lg space-y-1">
                    <div className="flex justify-between"><span className="text-gray-400">المخاطرة:</span><span className="font-bold text-rose-400">${riskAmount}</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">العقد:</span><span className="font-bold text-emerald-400">${posSize}</span></div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NebrasApp />);
  </script>
</body>
</html>
