<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نِبْرَاس لِلتَّدَاوُل الذَّكِي - كافة العملات</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function NebrasApp() {
      const [activeTab, setActiveTab] = useState('radar');
      const [loading, setLoading] = useState(true);
      const [allTickers, setAllTickers] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [displayLimit, setDisplayLimit] = useState(50);

      const fetchAllBinanceData = async () => {
        try {
          const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
          const data = await res.json();
          
          // تصفية جميع أزواج USDT فقط وفرزها حسب حجم التداول الأكبر
          const usdtPairs = data
            .filter(t => t.symbol.endsWith('USDT'))
            .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
            .map(t => {
              const base = t.symbol.replace('USDT', '');
              const priceNum = parseFloat(t.lastPrice);
              const decimals = priceNum < 1 ? 4 : 2;
              const changeNum = parseFloat(t.priceChangePercent);
              
              return {
                symbol: t.symbol,
                label: `${base}/USDT`,
                price: priceNum.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }),
                change: changeNum.toFixed(2),
                volumeNum: parseFloat(t.quoteVolume),
                volume: (parseFloat(t.quoteVolume) / 1000000).toFixed(2) + 'M',
                type: changeNum > 5 ? 'اختراق صعودي قوي (Breakout)' : changeNum < -5 ? 'كسر هبوطي حاد (Liquidation)' : 'تداول عرضي منظم (Consolidation)'
              };
            });

          setAllTickers(usdtPairs);
          setLoading(false);
        } catch (err) {
          console.error('Binance All Pairs Error:', err);
        }
      };

      useEffect(() => {
        fetchAllBinanceData();
        const interval = setInterval(fetchAllBinanceData, 3000);
        return () => clearInterval(interval);
      }, []);

      // البحث الفوري والتصفية
      const filteredPairs = useMemo(() => {
        return allTickers
          .filter(item => item.label.toLowerCase().includes(searchTerm.toLowerCase()) || item.symbol.toLowerCase().includes(searchTerm.toLowerCase()))
          .slice(0, displayLimit);
      }, [allTickers, searchTerm, displayLimit]);

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col pb-6">
          {/* Header */}
          <header className="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 flex items-center justify-between">
            <div>
              <h1 className="text-lg font-extrabold text-emerald-400 tracking-wide">نِبْرَاس لِلتَّدَاوُل الذَّكِي</h1>
              <p className="text-[10px] text-gray-400">رادار السيولة المباشر لجميع عملات Binance ({allTickers.length})</p>
            </div>
            <span className="flex items-center gap-1.5 bg-emerald-500/10 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/20 font-medium">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              شامل Binance
            </span>
          </header>

          {/* Navigation Tabs */}
          <nav className="flex bg-gray-900/60 p-1.5 m-3 rounded-xl border border-gray-800 gap-1">
            <button 
              onClick={() => setActiveTab('radar')}
              className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${activeTab === 'radar' ? 'bg-emerald-500 text-gray-950 shadow-md shadow-emerald-500/20' : 'text-gray-400 hover:text-white'}`}
            >
              رادار السيولة ({allTickers.length})
            </button>
            <button 
              onClick={() => setActiveTab('signals')}
              className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${activeTab === 'signals' ? 'bg-emerald-500 text-gray-950 shadow-md shadow-emerald-500/20' : 'text-gray-400 hover:text-white'}`}
            >
              توصيات VIP
            </button>
            <button 
              onClick={() => setActiveTab('admin')}
              className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${activeTab === 'admin' ? 'bg-emerald-500 text-gray-950 shadow-md shadow-emerald-500/20' : 'text-gray-400 hover:text-white'}`}
            >
              التحكم
            </button>
          </nav>

          {/* Main Content */}
          <main className="flex-1 px-3 space-y-3">
            {activeTab === 'radar' && (
              <div className="space-y-3">
                {/* البحث المباشر */}
                <div className="relative">
                  <input 
                    type="text"
                    placeholder="ابحث عن أي عملة (مثال: PEPE, XRP, NEAR...)"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition-all"
                  />
                </div>

                <div className="bg-gray-900/80 border border-gray-800 rounded-xl p-2.5 flex justify-between items-center text-xs">
                  <span className="text-gray-400">الفريم: <strong className="text-emerald-400">15m</strong></span>
                  <span className="text-gray-400">المعروض: <strong className="text-white">{filteredPairs.length}</strong> من <strong className="text-emerald-400">{allTickers.length}</strong> عملة</span>
                </div>

                {loading ? (
                  <div className="text-center py-12 text-gray-400 text-xs">جاري تحميل وسحب كافة عملات باينانس المباشرة...</div>
                ) : (
                  <>
                    {filteredPairs.map((item, idx) => (
                      <div key={idx} className="bg-gray-900 border border-gray-800/80 hover:border-emerald-500/40 rounded-xl p-3.5 space-y-2 transition-all">
                        <div className="flex justify-between items-center">
                          <span className="font-extrabold text-sm text-white tracking-wider">{item.label}</span>
                          <span className={`text-xs font-bold px-2 py-0.5 rounded ${parseFloat(item.change) >= 0 ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>
                            {parseFloat(item.change) >= 0 ? `+${item.change}%` : `${item.change}%`}
                          </span>
                        </div>
                        <div className="flex justify-between text-xs text-gray-400">
                          <span>السعر: <strong className="text-gray-100 font-mono">${item.price}</strong></span>
                          <span>حجم 24h: <strong className="text-gray-100">${item.volume}</strong></span>
                        </div>
                        <div className="pt-1 border-t border-gray-800/50 flex justify-between items-center text-[11px]">
                          <span className="text-gray-400">الحركة:</span>
                          <span className="text-emerald-400 font-medium">{item.type}</span>
                        </div>
                      </div>
                    ))}

                    {displayLimit < allTickers.length && !searchTerm && (
                      <button 
                        onClick={() => setDisplayLimit(prev => prev + 50)}
                        className="w-full py-3 bg-gray-900 border border-gray-800 hover:border-emerald-500/50 rounded-xl text-xs font-bold text-emerald-400 transition-all"
                      >
                        عرض المزيد من العملات (+50)
                      </button>
                    )}
                  </>
                )}
              </div>
            )}

            {activeTab === 'signals' && (
              <div className="bg-gray-900 border border-emerald-500/30 rounded-xl p-4 space-y-2">
                <span className="bg-emerald-500 text-gray-950 font-black text-[10px] px-2 py-0.5 rounded">تنبيه سيولة VIP</span>
                <h3 className="text-sm font-bold text-white">رادار الصفقات التلقائي نشط على كافة أزواج USDT</h3>
              </div>
            )}

            {activeTab === 'admin' && (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-2 text-xs">
                <div className="flex justify-between">
                  <span className="text-gray-400">إجمالي الأزواج المتصلة:</span>
                  <span className="text-emerald-400 font-bold">{allTickers.length} عملة</span>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NebrasApp />);
  </script>
</body>
</html>
