<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نِبْرَاس الشَّامِلَة - محطة التداول المؤسسي V17.1</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.98); }
    }
    .animate-pulse-fast { animation: pulse-fast 1.2s infinite; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen selection:bg-emerald-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function NebrasApp() {
      const [activeTab, setActiveTab] = useState('radar');
      const [timeframe, setTimeframe] = useState('15m');
      const [elliottScope, setElliottScope] = useState('small');
      const [category, setCategory] = useState('all');
      const [loading, setLoading] = useState(true);
      const [allTickers, setAllTickers] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedSymbol, setSelectedSymbol] = useState('BTCUSDT');
      
      const [userTelegram, setUserTelegram] = useState(localStorage.getItem('nebras_telegram') || '@ahmed17200');
      const [notificationsEnabled, setNotificationsEnabled] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);

      const [journalTrades, setJournalTrades] = useState(JSON.parse(localStorage.getItem('nebras_journal') || '[]'));
      const [newTradeSymbol, setNewTradeSymbol] = useState('BTCUSDT');
      const [newTradeType, setNewTradeType] = useState('LONG');
      const [newTradeEntry, setNewTradeEntry] = useState('');
      const [newTradeResult, setNewTradeResult] = useState('WIN');
      const [newTradePnL, setNewTradePnL] = useState('');

      const [capital, setCapital] = useState(1000);
      const [riskPercent, setRiskPercent] = useState(2);
      const [entryPrice, setEntryPrice] = useState(67000);
      const [stopLoss, setStopLoss] = useState(66000);

      const aiSymbols = ['TAO', 'FET', 'NEAR', 'RNDR', 'WLD', 'AGIX', 'AKT'];
      const majorSymbols = ['BTC', 'ETH', 'SOL', 'BNB', 'XRP', 'ADA', 'AVAX'];

      const saveTelegramSettings = (e) => {
        e.preventDefault();
        localStorage.setItem('nebras_telegram', userTelegram);
        setShowSettingsModal(false);
        alert(`تم حفظ معرف التليجرام (${userTelegram}) بنجاح!`);
      };

      const requestNotificationPermission = () => {
        if ("Notification" in window) {
          Notification.requestPermission().then(permission => {
            if (permission === "granted") {
              setNotificationsEnabled(true);
              new Notification("نِبْرَاس لِلتَّدَاوُل الذَّكِي", {
                body: `تم تفعيل إشعارات الجوال الفورية للمستخدم (${userTelegram})`,
                icon: "https://cryptologos.cc/logos/binance-coin-bnb-logo.png"
              });
            } else {
              alert("تم رفض إذن الإشعارات من المتصفح.");
            }
          });
        } else {
          alert("متصفحك لا يدعم الإشعارات الفورية.");
        }
      };

      const addJournalTrade = (e) => {
        e.preventDefault();
        if (!newTradeEntry || !newTradePnL) return;
        const trade = {
          id: Date.now(),
          symbol: newTradeSymbol,
          type: newTradeType,
          entry: newTradeEntry,
          result: newTradeResult,
          pnl: parseFloat(newTradePnL),
          date: new Date().toLocaleDateString('ar-SA')
        };
        const updated = [trade, ...journalTrades];
        setJournalTrades(updated);
        localStorage.setItem('nebras_journal', JSON.stringify(updated));
        setNewTradePnL('');
        alert('تم تسجيل الصفقة بنجاح في دفتر نبراس!');
      };

      const deleteJournalTrade = (id) => {
        const updated = journalTrades.filter(t => t.id !== id);
        setJournalTrades(updated);
        localStorage.setItem('nebras_journal', JSON.stringify(updated));
      };

      const journalStats = useMemo(() => {
        const total = journalTrades.length;
        if (total === 0) return { winRate: 0, totalPnL: 0, wins: 0, losses: 0 };
        const wins = journalTrades.filter(t => t.result === 'WIN').length;
        const losses = total - wins;
        const winRate = ((wins / total) * 100).toFixed(1);
        const totalPnL = journalTrades.reduce((acc, t) => acc + t.pnl, 0).toFixed(2);
        return { winRate, totalPnL, wins, losses };
      }, [journalTrades]);

      const fetchAllBinanceData = async () => {
        try {
          const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
          const data = await res.json();
          
          const usdtPairs = data
            .filter(t => t.symbol.endsWith('USDT'))
            .map(t => {
              const base = t.symbol.replace('USDT', '');
              const priceNum = parseFloat(t.lastPrice);
              
              let decimals = 2;
              if (priceNum < 0.0001) decimals = 8;
              else if (priceNum < 1) decimals = 4;

              const changeNum = parseFloat(t.priceChangePercent);
              const volNum = parseFloat(t.quoteVolume);

              const buyPercent = Math.min(Math.max(50 + (changeNum * 2.5), 20), 85).toFixed(1);
              const sellPercent = (100 - parseFloat(buyPercent)).toFixed(1);
              const netInflowNum = (volNum * (changeNum / 100) * 0.15) / 1000000;
              
              const isShort = netInflowNum < -0.15;
              const isBreakout = Math.abs(changeNum) >= 4.0 || volNum > 50000000;
              
              let entry = priceNum * (isShort ? 1.002 : 0.998);
              let sl = isShort ? entry * 1.018 : entry * 0.982;
              const tp1 = isShort ? entry * 0.975 : entry * 1.025;
              const tp2 = isShort ? entry * 0.945 : entry * 1.055;

              let elliottPhase = 'الموجة الأولى (Wave 1)';
              let elliottColor = 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30';
              if (changeNum > 4.5 && volNum > 30000000) {
                elliottPhase = 'الموجة الدافعة الثالثة (Wave 3 - الانفجار الأعنف 🚀)';
                elliottColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50';
              } else if (changeNum > 2.0 && changeNum <= 4.5) {
                elliottPhase = 'الموجة الخامسة (Wave 5 - القمة ⚠️)';
                elliottColor = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
              } else if (changeNum < 0 && changeNum > -3.0) {
                elliottPhase = 'موجة التصحيح الرابعة (Wave 4 - ارتداد 🔄)';
                elliottColor = 'bg-purple-500/10 text-purple-400 border-purple-500/30';
              } else if (changeNum <= -3.0) {
                elliottPhase = 'تصحيح مركب (Wave A-B-C هابط)';
                elliottColor = 'bg-rose-500/10 text-rose-400 border-rose-500/30';
              }

              let smcType = 'منطقة تجميع هادئة';
              let smcColor = 'bg-gray-800 text-gray-300 border-gray-700';
              if (volNum > 80000000 && changeNum > 3) {
                smcType = 'منطقة طلب مؤسسي (Bullish OB 🟩)';
                smcColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
              } else if (volNum > 80000000 && changeNum < -3) {
                smcType = 'منطقة عرض مؤسسي (Bearish OB 🟥)';
                smcColor = 'bg-rose-500/10 text-rose-400 border-rose-500/30';
              } else if (Math.abs(changeNum) > 5) {
                smcType = 'فجوة سعرية مؤسسية (FVG ⚡)';
                smcColor = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
              }

              let liqType = 'متوازن';
              let liqColor = 'text-gray-400 border-gray-700';
              let estimatedLiqUsd = ((volNum * Math.abs(changeNum)) / 45).toFixed(0);
              if (changeNum > 3.5) {
                liqType = `تصفية شورت ضخمة (Short Squeeze)`;
                liqColor = 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30';
              } else if (changeNum < -3.5) {
                liqType = `تصفية لونج ضخمة (Long Squeeze)`;
                liqColor = 'text-rose-400 bg-rose-500/10 border-rose-500/30';
              } else {
                liqType = 'استقرار في عقود الهامش';
              }

              let tradeStatus = 'active';
              let statusLabel = isShort ? 'شورت مستمرة 🔄' : 'لونج مستمرة 🔄';
              let statusColor = isShort ? 'bg-rose-500/10 text-rose-400 border-rose-500/30' : 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30';

              if (isShort) {
                if (priceNum <= tp2) { tradeStatus = 'success'; statusLabel = 'تحقق هدف الشورت TP2 🚀'; statusColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50'; }
                else if (priceNum <= tp1) { statusLabel = 'تحقق هدف الشورت TP1 ✅'; statusColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'; }
              } else {
                if (priceNum >= tp2) { tradeStatus = 'success'; statusLabel = 'تحقق هدف اللونج TP2 🚀'; statusColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50'; }
                else if (priceNum >= tp1) { statusLabel = 'تحقق هدف اللونج TP1 ✅'; statusColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'; }
              }

              let catTag = 'عملة نشطة';
              if (majorSymbols.includes(base)) catTag = 'قيادية 👑';
              else if (aiSymbols.includes(base)) catTag = 'ذكاء اصطناعي 🤖';

              let signalTag = 'سيولة متوازنة';
              let signalColor = 'text-gray-400 bg-gray-800/40 border-gray-700/50';

              if (netInflowNum > 1) {
                signalTag = 'دخول سيولة حاد 🔥';
                signalColor = 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30';
              } else if (netInflowNum < -1) {
                signalTag = 'خروج سيولة حاد ⚠️';
                signalColor = 'text-rose-400 bg-rose-500/10 border-rose-500/30';
              }

              return {
                symbol: t.symbol,
                base: base,
                label: `${base}/USDT`,
                rawPrice: priceNum,
                price: priceNum.toFixed(decimals),
                entryFormatted: entry.toFixed(decimals),
                slFormatted: sl.toFixed(decimals),
                tp1Formatted: tp1.toFixed(decimals),
                tp2Formatted: tp2.toFixed(decimals),
                changeNum: changeNum,
                change: changeNum.toFixed(2),
                volumeNum: volNum,
                volume: (volNum / 1000000).toFixed(2) + 'M',
                buyPercent: buyPercent,
                sellPercent: sellPercent,
                netInflowNum: netInflowNum,
                netInflow: (netInflowNum >= 0 ? `+${netInflowNum.toFixed(2)}M$` : `${netInflowNum.toFixed(2)}M$`),
                catTag: catTag,
                isShort: isShort,
                isBreakout: isBreakout,
                elliottPhase: elliottPhase,
                elliottColor: elliottColor,
                smcType: smcType,
                smcColor: smcColor,
                liqType: liqType,
                liqColor: liqColor,
                estimatedLiqUsd: estimatedLiqUsd,
                tradeStatus: tradeStatus,
                statusLabel: statusLabel,
                statusColor: statusColor,
                signalTag: signalTag,
                signalColor: signalColor
              };
            });

          setAllTickers(usdtPairs);
          setLoading(false);

          if (notificationsEnabled && usdtPairs.length > 0) {
            const topBreakout = usdtPairs.find(p => p.isBreakout);
            if (topBreakout) {
              new Notification("🚨 تنبيه انفجار سعري في نِبْرَاس", {
                body: `تم رصد انفجار للعملة ${topBreakout.label} بنسبة ${topBreakout.change}%!`,
                icon: "https://cryptologos.cc/logos/binance-coin-bnb-logo.png"
              });
            }
          }
        } catch (err) {
          console.error('Binance Fetch Error:', err);
        }
      };

      useEffect(() => {
        fetchAllBinanceData();
        const interval = setInterval(fetchAllBinanceData, 3000);
        return () => clearInterval(interval);
      }, [notificationsEnabled]);

      useEffect(() => {
        if (activeTab === 'chart' && window.TradingView) {
          let cleanSymbol = selectedSymbol ? selectedSymbol.replace('BINANCE:', '') : 'BTCUSDT';
          if (cleanSymbol.includes('HAEDAL') || cleanSymbol.includes('WTC')) {
            cleanSymbol = 'BTCUSDT';
          }

          new window.TradingView.widget({
            "autosize": true,
            "symbol": `BINANCE:${cleanSymbol}`,
            "interval": timeframe === '5m' ? '5' : timeframe === '1h' ? '60' : '15',
            "timezone": "Asia/Riyadh",
            "theme": "dark",
            "style": "1",
            "locale": "ar",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "container_id": "tradingview_chart"
          });
        }
      }, [activeTab, selectedSymbol, timeframe]);

      const filteredPairs = useMemo(() => {
        let result = [...allTickers];

        if (category === 'inflow') {
          result = result.filter(item => item.netInflowNum > 0).sort((a, b) => b.netInflowNum - a.netInflowNum);
        } else if (category === 'outflow') {
          result = result.filter(item => item.netInflowNum < 0).sort((a, b) => a.netInflowNum - b.netInflowNum);
        } else if (category === 'majors') {
          result = result.filter(item => majorSymbols.includes(item.base));
        } else if (category === 'ai') {
          result = result.filter(item => aiSymbols.includes(item.base));
        } else {
          result.sort((a, b) => b.volumeNum - a.volumeNum);
        }

        if (searchTerm) {
          result = result.filter(item => item.label.toLowerCase().includes(searchTerm.toLowerCase()));
        }

        return result.slice(0, 60);
      }, [allTickers, searchTerm, category]);

      const breakoutSignals = useMemo(() => {
        return allTickers
          .filter(item => item.isBreakout)
          .sort((a, b) => Math.abs(b.changeNum) - Math.abs(a.changeNum))
          .slice(0, 15);
      }, [allTickers]);

      const elliottSignals = useMemo(() => {
        let list = [...allTickers];
        if (elliottScope === 'small') {
          list = list.filter(item => Math.abs(item.changeNum) >= 2.5);
        } else {
          list = list.filter(item => majorSymbols.includes(item.base) || Math.abs(item.netInflowNum) > 0.5);
        }
        return list.sort((a, b) => b.volumeNum - a.volumeNum).slice(0, 20);
      }, [allTickers, elliottScope]);

      const smcSignals = useMemo(() => {
        return allTickers
          .filter(item => item.volumeNum > 30000000 && Math.abs(item.changeNum) > 2.0)
          .sort((a, b) => b.volumeNum - a.volumeNum)
          .slice(0, 25);
      }, [allTickers]);

      const liquidationSignals = useMemo(() => {
        return allTickers
          .filter(item => Math.abs(item.changeNum) > 3.0 || item.volumeNum > 30000000)
          .sort((a, b) => Math.abs(b.changeNum) - Math.abs(a.changeNum))
          .slice(0, 25);
      }, [allTickers]);

      const vipSignals = useMemo(() => {
        return allTickers
          .filter(item => Math.abs(item.netInflowNum) > 0.15 || Math.abs(item.changeNum) > 2.0)
          .sort((a, b) => Math.abs(b.netInflowNum) - Math.abs(a.netInflowNum))
          .slice(0, 20);
      }, [allTickers]);

      const activeLongSignals = useMemo(() => vipSignals.filter(item => !item.isShort && item.tradeStatus === 'active'), [vipSignals]);
      const activeShortSignals = useMemo(() => vipSignals.filter(item => item.isShort && item.tradeStatus === 'active'), [vipSignals]);
      const readyToEntry = useMemo(() => breakoutSignals[0] || activeLongSignals[0], [breakoutSignals, activeLongSignals]);

      const topInflow = useMemo(() => {
        const sorted = [...allTickers].sort((a, b) => b.netInflowNum - a.netInflowNum);
        return sorted.find(item => item.netInflowNum > 0) || sorted[0];
      }, [allTickers]);

      const topOutflow = useMemo(() => {
        const sorted = [...allTickers].sort((a, b) => a.netInflowNum - b.netInflowNum);
        return sorted.find(item => item.netInflowNum < 0) || sorted[sorted.length - 1];
      }, [allTickers]);

      const riskAmount = (capital * (riskPercent / 100)).toFixed(2);
      const priceDiff = Math.abs(entryPrice - stopLoss);
      const posSize = priceDiff > 0 ? (riskAmount / (priceDiff / entryPrice)).toFixed(2) : 0;

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col pb-6 relative">
          <header className="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 flex items-center justify-between shadow-xl">
            <div>
              <h1 className="text-sm font-black text-emerald-400 tracking-wide flex items-center gap-1.5">
                نِبْرَاس الشَّامِلَة
                <span className="text-[10px] bg-emerald-500/20 text-emerald-300 font-normal px-1.5 py-0.5 rounded border border-emerald-500/30">V17.1</span>
              </h1>
              <p className="text-[10px] text-gray-400 mt-0.5">المستخدم: <span className="text-emerald-300 font-bold">{userTelegram}</span></p>
            </div>
            <div className="flex items-center gap-1.5">
              <button 
                onClick={() => setShowSettingsModal(true)}
                className="text-[10px] bg-gray-800 border border-gray-700 text-emerald-400 px-2.5 py-1.5 rounded-lg font-bold hover:bg-gray-700 transition"
              >
                ⚙️ الإعدادات والتنبيهات
              </button>
            </div>
          </header>

          {showSettingsModal && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-emerald-500/50 rounded-2xl p-5 w-full max-w-sm space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-emerald-400 text-sm">إعدادات التنبيهات وجوالك</h3>
                  <button onClick={() => setShowSettingsModal(false)} className="text-gray-400 hover:text-white font-bold">✕</button>
                </div>
                <p className="text-[11px] text-gray-300">ربط معرف تيليجرام أو تفعيل إشعار الجوال الفوري للانفجارات:</p>
                <form onSubmit={saveTelegramSettings} className="space-y-3">
                  <div>
                    <label className="text-xs text-gray-400 block mb-1">معرف تيليجرام (Telegram Username):</label>
                    <input 
                      type="text" 
                      value={userTelegram} 
                      onChange={(e) => setUserTelegram(e.target.value)} 
                      placeholder="@username"
                      className="w-full bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-xs text-white focus:border-emerald-500 focus:outline-none"
                      required
                    />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button 
                      type="button" 
                      onClick={requestNotificationPermission} 
                      className={`flex-1 border text-xs py-2 rounded-xl font-bold transition ${notificationsEnabled ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-gray-800 border-gray-700 text-gray-200'}`}
                    >
                      {notificationsEnabled ? '🔔 التنبيهات مفعلة' : '🔕 تفعيل إشعار الجوال'}
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 bg-emerald-500 text-gray-950 text-xs py-2 rounded-xl font-bold shadow-lg shadow-emerald-500/20"
                    >
                      حفظ الإعدادات
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <div className="grid grid-cols-2 gap-2 p-3 bg-gray-900/50 border-b border-gray-800/80">
            <div className="bg-gray-900 border border-emerald-500/20 rounded-xl p-2.5 flex items-center justify-between">
              <div>
                <span className="text-[10px] text-gray-400 block">زعيم ضخ السيولة</span>
                <strong className="text-xs text-emerald-400 font-extrabold">{topInflow ? topInflow.label : '---'}</strong>
              </div>
              <span className="text-xs font-mono font-bold text-emerald-400">{topInflow ? topInflow.netInflow : '0$'}</span>
            </div>
            <div className="bg-gray-900 border border-rose-500/20 rounded-xl p-2.5 flex items-center justify-between">
              <div>
                <span className="text-[10px] text-gray-400 block">زعيم خروج السيولة</span>
                <strong className="text-xs text-rose-400 font-extrabold">{topOutflow ? topOutflow.label : '---'}</strong>
              </div>
              <span className="text-xs font-mono font-bold text-rose-400">{topOutflow ? topOutflow.netInflow : '0$'}</span>
            </div>
          </div>

          <nav className="flex overflow-x-auto no-scrollbar bg-gray-900/90 p-1.5 m-3 rounded-xl border border-gray-800 gap-1 text-[10px] whitespace-nowrap">
            <button onClick={() => setActiveTab('breakouts')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'breakouts' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>الانفجارات 🚀</button>
            <button onClick={() => setActiveTab('elliott')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'elliott' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>إليوت 🌊</button>
            <button onClick={() => setActiveTab('smc')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'smc' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>مناطق SMC 📊</button>
            <button onClick={() => setActiveTab('liquidation')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'liquidation' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>التصفيات المفصلة ⚡</button>
            <button onClick={() => setActiveTab('journal')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'journal' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>الدفتر 📖</button>
            <button onClick={() => setActiveTab('radar')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'radar' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>الرادار 📡</button>
            <button onClick={() => setActiveTab('heatmap')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'heatmap' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>الحرارية</button>
            <button onClick={() => setActiveTab('signals')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'signals' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>VIP 🎯</button>
            <button onClick={() => setActiveTab('chart')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'chart' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>الشارت</button>
            <button onClick={() => setActiveTab('risk')} className={`px-3 py-2 font-bold rounded-lg transition-all ${activeTab === 'risk' ? 'bg-emerald-500 text-gray-950 shadow-lg' : 'text-gray-400'}`}>المخاطر</button>
          </nav>

          <main className="flex-1 px-3 space-y-3">
            
            {/* 1. Radar Tab (Restored Full Trade & Liquidity Data) */}
            {activeTab === 'radar' && (
              <div className="space-y-3">
                <div className="flex gap-2 items-center">
                  <input 
                    type="text"
                    placeholder="ابحث عن أي عملة (BTC, ETH, PEPE...)"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="flex-1 bg-gray-900 border border-gray-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                  />
                  <div className="flex bg-gray-900 p-1 border border-gray-800 rounded-xl text-[10px]">
                    <button onClick={() => setTimeframe('5m')} className={`px-2 py-1 rounded ${timeframe === '5m' ? 'bg-emerald-500 text-black font-bold' : 'text-gray-400'}`}>5m</button>
                    <button onClick={() => setTimeframe('15m')} className={`px-2 py-1 rounded ${timeframe === '15m' ? 'bg-emerald-500 text-black font-bold' : 'text-gray-400'}`}>15m</button>
                    <button onClick={() => setTimeframe('1h')} className={`px-2 py-1 rounded ${timeframe === '1h' ? 'bg-emerald-500 text-black font-bold' : 'text-gray-400'}`}>1h</button>
                  </div>
                </div>

                <div className="flex gap-1.5 overflow-x-auto pb-1 text-[11px] no-scrollbar">
                  <button onClick={() => setCategory('all')} className={`px-3 py-1.5 rounded-lg border whitespace-nowrap ${category === 'all' ? 'bg-gray-800 border-emerald-500/50 text-emerald-400 font-bold' : 'bg-gray-900/60 border-gray-800 text-gray-400'}`}>كل العملات</button>
                  <button onClick={() => setCategory('inflow')} className={`px-3 py-1.5 rounded-lg border whitespace-nowrap ${category === 'inflow' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-400 font-bold' : 'bg-gray-900/60 border-gray-800 text-gray-400'}`}>دخول سيولة 🔥</button>
                  <button onClick={() => setCategory('outflow')} className={`px-3 py-1.5 rounded-lg border whitespace-nowrap ${category === 'outflow' ? 'bg-rose-500/20 border-rose-500/50 text-rose-400 font-bold' : 'bg-gray-900/60 border-gray-800 text-gray-400'}`}>خروج سيولة ⚠️</button>
                  <button onClick={() => setCategory('majors')} className={`px-3 py-1.5 rounded-lg border whitespace-nowrap ${category === 'majors' ? 'bg-gray-800 border-cyan-500/50 text-cyan-400 font-bold' : 'bg-gray-900/60 border-gray-800 text-gray-400'}`}>القيادية 👑</button>
                  <button onClick={() => setCategory('ai')} className={`px-3 py-1.5 rounded-lg border whitespace-nowrap ${category === 'ai' ? 'bg-gray-800 border-purple-500/50 text-purple-400 font-bold' : 'bg-gray-900/60 border-gray-800 text-gray-400'}`}>الذكاء الاصطناعي 🤖</button>
                </div>

                {loading ? (
                  <div className="text-center py-12 text-gray-400 text-xs">جاري تحليل بيانات السيولة والمؤشرات الحية...</div>
                ) : (
                  filteredPairs.map((item, idx) => (
                    <div 
                      key={idx} 
                      onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }}
                      className="bg-gray-900 border border-gray-800/90 hover:border-emerald-500/50 rounded-xl p-3.5 space-y-2.5 cursor-pointer transition-all shadow"
                    >
                      <div className="flex justify-between items-center">
                        <div className="flex items-center gap-2">
                          <span className="font-extrabold text-sm text-white">{item.label}</span>
                          <span className="text-[10px] bg-gray-800 text-gray-300 px-2 py-0.5 rounded border border-gray-700">{item.catTag}</span>
                        </div>
                        <span className={`text-[10px] px-2 py-0.5 rounded-full border font-semibold ${item.signalColor}`}>{item.signalTag}</span>
                      </div>

                      <div className="flex justify-between items-center text-xs">
                        <div>
                          <span className="text-gray-400 text-[11px] block">السعر والتغير</span>
                          <span className="font-mono font-bold text-white">${item.price}</span>
                          <span className={`text-[11px] font-bold mr-1.5 ${item.changeNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{item.changeNum >= 0 ? `+${item.change}%` : `${item.change}%`}</span>
                        </div>
                        <div className="text-left">
                          <span className="text-gray-400 text-[11px] block">صافي تدفق السيولة</span>
                          <span className={`font-mono font-bold ${item.netInflowNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{item.netInflow}</span>
                        </div>
                      </div>

                      <div className="space-y-1 pt-1 border-t border-gray-800/60">
                        <div className="flex justify-between text-[10px]">
                          <span className="text-emerald-400 font-bold">شراء {item.buyPercent}%</span>
                          <span className="text-rose-400 font-bold">بيع {item.sellPercent}%</span>
                        </div>
                        <div className="h-1.5 w-full bg-rose-500/30 rounded-full overflow-hidden flex">
                          <div style={{ width: `${item.buyPercent}%` }} className="bg-emerald-500 h-full"></div>
                        </div>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {/* 2. Breakouts Tab */}
            {activeTab === 'breakouts' && (
              <div className="space-y-3">
                <div className="bg-gradient-to-r from-emerald-950/70 to-gray-900 border border-emerald-500/50 rounded-2xl p-3.5 space-y-2">
                  <h2 className="font-black text-emerald-400 text-xs">🚀 رادار الانفجارات السعرية اللحظية (مع الأهداف والصفقات)</h2>
                </div>
                {breakoutSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setEntryPrice(item.rawPrice); setActiveTab('chart'); }} className="border rounded-2xl p-3.5 space-y-3 cursor-pointer bg-gray-900 border-emerald-500/50">
                    <div className="flex justify-between items-center">
                      <span className="font-black text-[10px] px-2 py-0.5 rounded bg-emerald-500 text-gray-950">انفجار صاعد 🚀</span>
                      <span className="font-extrabold text-sm text-white">{item.label}</span>
                      <span className="font-mono font-bold text-xs text-emerald-400">+{item.change}%</span>
                    </div>
                    <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]">
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-gray-800"><span className="text-gray-400 block text-[8px]">الدخول</span><span className="text-white font-mono font-bold">${item.entryFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-rose-500/30"><span className="text-rose-400 block text-[8px]">وقف (SL)</span><span className="text-rose-300 font-mono font-bold">${item.slFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-emerald-500/30"><span className="text-emerald-400 block text-[8px]">الهدف 1</span><span className="text-emerald-300 font-mono font-bold">${item.tp1Formatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-cyan-500/30"><span className="text-cyan-400 block text-[8px]">الهدف 2</span><span className="text-cyan-300 font-mono font-bold">${item.tp2Formatted}</span></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* 3. Elliott Waves Tab */}
            {activeTab === 'elliott' && (
              <div className="space-y-3">
                <div className="bg-gradient-to-r from-cyan-950/70 to-gray-900 border border-cyan-500/50 rounded-2xl p-3.5 space-y-2.5">
                  <div className="flex justify-between items-center">
                    <h2 className="font-black text-cyan-400 text-xs">🌊 رادار موجات إليوت والصفقات الذكية</h2>
                    <div className="flex bg-gray-950 p-1 border border-cyan-500/30 rounded-xl text-[10px]">
                      <button onClick={() => setElliottScope('small')} className={`px-2.5 py-1 rounded-lg font-bold ${elliottScope === 'small' ? 'bg-cyan-500 text-black' : 'text-gray-400'}`}>⚡ صغرى</button>
                      <button onClick={() => setElliottScope('large')} className={`px-2.5 py-1 rounded-lg font-bold ${elliottScope === 'large' ? 'bg-cyan-500 text-black' : 'text-gray-400'}`}>🏛️ كبرى</button>
                    </div>
                  </div>
                </div>
                {elliottSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setEntryPrice(item.rawPrice); setActiveTab('chart'); }} className="bg-gray-900 border border-cyan-500/40 rounded-2xl p-3.5 space-y-3 cursor-pointer">
                    <div className="flex justify-between items-center">
                      <span className={`font-black text-[10px] px-2.5 py-1 rounded-lg border ${item.elliottColor}`}>{item.elliottPhase}</span>
                      <span className="font-extrabold text-sm text-white">{item.label}</span>
                    </div>
                    <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]">
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-gray-800"><span className="text-gray-400 block text-[8px]">الدخول</span><span className="text-white font-mono font-bold">${item.entryFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-rose-500/30"><span className="text-rose-400 block text-[8px]">وقف (SL)</span><span className="text-rose-300 font-mono font-bold">${item.slFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-emerald-500/30"><span className="text-emerald-400 block text-[8px]">الهدف 1</span><span className="text-emerald-300 font-mono font-bold">${item.tp1Formatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-cyan-500/30"><span className="text-cyan-400 block text-[8px]">الهدف 2</span><span className="text-cyan-300 font-mono font-bold">${item.tp2Formatted}</span></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* 4. SMC / ICT Order Blocks Tab */}
            {activeTab === 'smc' && (
              <div className="space-y-3">
                <div className="bg-gradient-to-r from-emerald-950/70 to-gray-900 border border-emerald-500/50 rounded-2xl p-3.5">
                  <h2 className="font-black text-emerald-400 text-xs">📊 مناطق الذكاء المؤسسي (SMC / ICT)</h2>
                </div>
                {smcSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className="bg-gray-900 border border-gray-800 rounded-xl p-3 space-y-2 cursor-pointer">
                    <div className="flex justify-between items-center"><span className="font-extrabold text-sm text-white">{item.label}</span><span className={`text-[10px] px-2 py-0.5 rounded border ${item.smcColor}`}>{item.smcType}</span></div>
                  </div>
                ))}
              </div>
            )}

            {/* 5. Liquidations Tab */}
            {activeTab === 'liquidation' && (
              <div className="space-y-3">
                <div className="bg-gradient-to-r from-rose-950/70 to-gray-900 border border-rose-500/50 rounded-2xl p-3.5">
                  <h2 className="font-black text-rose-400 text-xs">⚡ تصفيات العقود الآجلة لكل عملة</h2>
                </div>
                {liquidationSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className="bg-gray-900 border border-gray-800 rounded-xl p-3.5 space-y-2 cursor-pointer">
                    <div className="flex justify-between items-center"><span className="font-extrabold text-sm text-white">{item.label}</span><span className={`text-[10px] px-2.5 py-0.5 rounded-full border font-bold ${item.liqColor}`}>{item.liqType}</span></div>
                    <div className="grid grid-cols-3 gap-2 text-center text-[10px] bg-gray-950 p-2 rounded-xl border border-gray-800">
                      <div><span className="text-gray-400 block text-[8px]">التصفية المقدرة</span><strong className="text-rose-400 font-mono">${item.estimatedLiqUsd}</strong></div>
                      <div><span className="text-gray-400 block text-[8px]">السعر</span><strong className="text-white font-mono">${item.price}</strong></div>
                      <div><span className="text-gray-400 block text-[8px]">التغير</span><strong className={`font-mono ${item.changeNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{item.change}%</strong></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* 6. Journal Tab */}
            {activeTab === 'journal' && (
              <div className="space-y-4">
                <div className="bg-gray-900 border border-emerald-500/40 rounded-2xl p-4 space-y-3">
                  <h2 className="font-bold text-emerald-400 text-xs">📖 دفتر الصفقات (Win Rate: {journalStats.winRate}%)</h2>
                  <form onSubmit={addJournalTrade} className="space-y-2 pt-2 border-t border-gray-800">
                    <div className="grid grid-cols-2 gap-2">
                      <input type="text" value={newTradeSymbol} onChange={(e) => setNewTradeSymbol(e.target.value)} placeholder="العملة (BTCUSDT)" className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white" required />
                      <select value={newTradeType} onChange={(e) => setNewTradeType(e.target.value)} className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white"><option value="LONG">LONG 🟢</option><option value="SHORT">SHORT 🔴</option></select>
                    </div>
                    <div className="grid grid-cols-3 gap-2">
                      <input type="number" step="any" value={newTradeEntry} onChange={(e) => setNewTradeEntry(e.target.value)} placeholder="الدخول" className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white" required />
                      <select value={newTradeResult} onChange={(e) => setNewTradeResult(e.target.value)} className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white"><option value="WIN">ربح ✅</option><option value="LOSS">خسارة ❌</option></select>
                      <input type="number" step="any" value={newTradePnL} onChange={(e) => setNewTradePnL(e.target.value)} placeholder="الربح ($)" className="bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-white" required />
                    </div>
                    <button type="submit" className="w-full bg-emerald-500 text-gray-950 font-bold py-2 rounded-xl text-xs">تسجيل الصفقة</button>
                  </form>
                </div>
                {journalTrades.map((t) => (
                  <div key={t.id} className="bg-gray-900 border border-gray-800 rounded-xl p-3 flex justify-between items-center text-xs">
                    <div><span className={`font-bold ${t.type === 'LONG' ? 'text-emerald-400' : 'text-rose-400'}`}>{t.type}</span> <strong className="text-white">{t.symbol}</strong></div>
                    <div className="flex items-center gap-3"><span className={`font-mono font-bold ${t.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>${t.pnl}</span><button onClick={() => deleteJournalTrade(t.id)} className="text-gray-500 hover:text-rose-400">✕</button></div>
                  </div>
                ))}
              </div>
            )}

            {/* 7. Heatmap Tab */}
            {activeTab === 'heatmap' && (
              <div className="grid grid-cols-3 gap-2">
                {allTickers.slice(0, 30).map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setActiveTab('chart'); }} className={`p-3 rounded-xl border flex flex-col justify-between items-center text-center cursor-pointer ${item.changeNum >= 0 ? 'bg-emerald-950/40 border-emerald-500/30' : 'bg-rose-950/40 border-rose-500/30'}`}>
                    <span className="font-extrabold text-xs text-white">{item.base}</span>
                    <span className={`font-mono font-bold text-xs ${item.changeNum >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{item.change}%</span>
                  </div>
                ))}
              </div>
            )}

            {/* 8. VIP Signals Tab */}
            {activeTab === 'signals' && (
              <div className="space-y-4">
                {readyToEntry && (
                  <div onClick={() => { setSelectedSymbol(readyToEntry.symbol); setEntryPrice(readyToEntry.rawPrice); setActiveTab('chart'); }} className="bg-emerald-950/80 border-2 border-emerald-500 rounded-2xl p-3.5 space-y-2 cursor-pointer animate-pulse-fast">
                    <span className="bg-emerald-500 text-gray-950 font-black text-[10px] px-2.5 py-1 rounded-full">🚨 صفقة VIP جاهزة الآن!</span>
                    <span className="font-extrabold text-white text-sm block">عملة {readyToEntry.label} - دخول (${readyToEntry.price})</span>
                  </div>
                )}
                {activeLongSignals.map((item, idx) => (
                  <div key={idx} onClick={() => { setSelectedSymbol(item.symbol); setEntryPrice(item.rawPrice); setActiveTab('chart'); }} className="bg-gray-900 border border-emerald-500/40 rounded-xl p-3.5 space-y-3 cursor-pointer">
                    <div className="flex justify-between items-center"><span className="bg-emerald-500 text-gray-950 font-black text-[10px] px-2 py-0.5 rounded">LONG 🟢</span><span className="font-extrabold text-sm text-white">{item.label}</span></div>
                    <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]">
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-gray-800"><span className="text-gray-400 block text-[8px]">الدخول</span><span className="text-white font-mono font-bold">${item.entryFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-rose-500/20"><span className="text-rose-400 block text-[8px]">وقف (SL)</span><span className="text-rose-300 font-mono font-bold">${item.slFormatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-emerald-500/20"><span className="text-emerald-400 block text-[8px]">الهدف 1</span><span className="text-emerald-300 font-mono font-bold">${item.tp1Formatted}</span></div>
                      <div className="bg-gray-950 p-1.5 rounded-lg border border-cyan-500/20"><span className="text-cyan-400 block text-[8px]">الهدف 2</span><span className="text-cyan-300 font-mono font-bold">${item.tp2Formatted}</span></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Chart Tab */}
            {activeTab === 'chart' && (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-2 space-y-2 h-[520px]">
                <div className="text-xs font-bold text-emerald-400 px-2">الشارت المباشر: BINANCE:{selectedSymbol}</div>
                <div id="tradingview_chart" className="h-[470px] w-full"></div>
              </div>
            )}

            {/* Risk Tab */}
            {activeTab === 'risk' && (
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-4 text-xs">
                <h2 className="font-bold text-emerald-400 text-sm">حاسبة إدارة المخاطر</h2>
                <div className="space-y-3">
                  <div><label className="text-gray-400 block mb-1">رأس المال ($):</label><input type="number" value={capital} onChange={(e) => setCapital(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white" /></div>
                  <div><label className="text-gray-400 block mb-1">المخاطرة (%):</label><input type="number" value={riskPercent} onChange={(e) => setRiskPercent(e.target.value)} className="w-full bg-gray-950 border border-gray-800 rounded p-2 text-white" /></div>
                  <div className="p-3 bg-gray-950 border border-emerald-500/30 rounded-lg space-y-1">
                    <div className="flex justify-between"><span className="text-gray-400">المخاطرة:</span><span className="font-bold text-rose-400">${riskAmount}</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">العقد:</span><span className="font-bold text-emerald-400">${posSize}</span></div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NebrasApp />);
  </script>
</body>
</html>
